  // ---------- leśni wrogowie (PixelGrid 34×30, ślad 24×21 jak koty) ----------
  const forestCache = new Map();
  function forestMats(kind) {
    const pals = {
      walker: [['#E9473F', '#4A0E0E'], ['#F4ECD8', '#4A3A2A'], ['#FFFFFF', null], ['#1A1420', null], ['#8A5A3A', '#2A160A']],
      hopper: [['#5FBF4A', '#163A14'], ['#B8E87A', '#1E4A1A'], ['#FFFFFF', null], ['#1A1420', null], ['#3E8A32', '#163A14']],
      hedgehog: [['#7A5A3E', '#24160C'], ['#E8C8A0', '#4A2E18'], ['#FFFFFF', null], ['#1A1420', null], ['#4A321E', '#1A0E06']],
      squirrel: [['#D9762E', '#4A1E06'], ['#F4D8B0', '#4A2E18'], ['#FFFFFF', null], ['#1A1420', null], ['#B85A1E', '#3A1606']],
      bee: [['#FFD23A', '#3A2A06'], ['#2A2230', '#120E16'], ['#FFFFFF', null], ['#1A1420', null], ['#DDEEFF', '#7A8AA8']],
      boss: [['#B8402E', '#3A0E08'], ['#F0E2C4', '#4A3A2A'], ['#FFFFFF', null], ['#1A1420', null], ['#FFC62E', '#5A3A06']]
    };
    return (pals[kind] || pals.walker).map(([c, o], i) => (i === 2 || i === 3) ? makeMat(c, null, { flat: true }) : makeMat(c, o));
  }
  function buildForestEnemy(kind, frame = 0, state = 'walk') {
    const key = `${kind}|${frame}|${state}`;
    const hit = forestCache.get(key);
    if (hit) return hit;
    const g = new PixelGrid(34, 30);
    const X = (v) => 5 + v;
    const Y = (v) => 7 + v;
    const stun = state === 'stun';
    const air = state === 'air';
    const warn = state === 'warn';
    const eye = (x, y, big = 1.3) => {
      if (stun) { g.put(X(x - 1), Y(y - 1), 3); g.put(X(x + 1), Y(y + 1), 3); g.put(X(x + 1), Y(y - 1), 3); g.put(X(x - 1), Y(y + 1), 3); g.put(X(x), Y(y), 3); return; }
      g.ellipse(X(x), Y(y), big, big + 0.3, 2, 0, true);
      g.put(X(x + 0.4), Y(y + 0.2), 3);
    };
    const step = frame ? 1 : -1;
    if (kind === 'walker' || kind === 'boss') {
      const sq = warn ? 1.2 : 0;
      g.ellipse(X(12), Y(15 + sq * 0.5), 6, 6 - sq * 0.5, 1);
      if (!air) { g.ellipse(X(8 + step), Y(20.5), 2.4, 1.2, 4); g.ellipse(X(16 - step), Y(20.5), 2.4, 1.2, 4); }
      else { g.ellipse(X(9), Y(19.5), 2, 1.2, 4); g.ellipse(X(15), Y(19.5), 2, 1.2, 4); }
      g.ellipse(X(12), Y(8 + sq), 11.5, 6.4 - sq * 0.4, 0);
      g.pattern(0, (x, y) => y > Y(10 + sq), -1);
      [[6, 6], [12, 4], [17, 7], [9, 10], [15, 10.5]].forEach(([x, y]) => g.ellipse(X(x), Y(y + sq), 1.5, 1.2, 2, 0, true));
      eye(9.6, 15.5);
      eye(14.4, 15.5);
      if (kind === 'boss') {
        g.rect(X(8), Y(-1), 9, 2, 4);
        g.put(X(8), Y(-2), 4); g.put(X(12), Y(-3), 4); g.put(X(12), Y(-2), 4); g.put(X(16), Y(-2), 4);
        g.rect(X(9.5), Y(13.2), 2.5, 0.8, 3, 2);
        g.rect(X(13), Y(13.2), 2.5, 0.8, 3, 2);
      }
    } else if (kind === 'hopper') {
      const crouch = warn ? 1.5 : 0;
      g.ellipse(X(12), Y(15 + crouch * 0.6), 9, 5.5 - crouch * 0.4, 0);
      g.ellipse(X(12), Y(17 + crouch * 0.4), 6, 3, 1);
      g.ellipse(X(7.5), Y(10 + crouch), 3, 3, 0);
      g.ellipse(X(16.5), Y(10 + crouch), 3, 3, 0);
      eye(7.5, 9.6 + crouch, 1.6);
      eye(16.5, 9.6 + crouch, 1.6);
      if (air) { g.capsule(X(5), Y(18), X(1), Y(21), 1.4, 1, 4); g.capsule(X(19), Y(18), X(23), Y(21), 1.4, 1, 4); }
      else { g.ellipse(X(4), Y(20.4), 3.4, 1.2, 4); g.ellipse(X(20), Y(20.4), 3.4, 1.2, 4); }
      g.rect(X(9.5), Y(15.6), 5, 0.8, 3, 2);
    } else if (kind === 'hedgehog') {
      const ball = stun;
      if (ball) {
        g.ellipse(X(12), Y(14), 8, 7, 0);
      } else {
        g.ellipse(X(11), Y(15), 9, 5.6, 0);
        g.ellipse(X(19), Y(16.4), 4, 3.4, 1);
        g.put(X(23), Y(16.4), 3);
        g.put(X(22.8), Y(15.6), 3);
        eye(19.4, 14.6, 1);
        g.ellipse(X(7 + step), Y(20.6), 2, 1, 4);
        g.ellipse(X(16 - step), Y(20.6), 2, 1, 4);
      }
      for (let k = 0; k < 9; k += 1) {
        const a = Math.PI * (0.95 + k * 0.12);
        const cx = ball ? 12 : 11;
        const cy = ball ? 14 : 15;
        const r = ball ? 7 : 5.5;
        g.tri(X(cx + Math.cos(a) * r * 0.7 - 1.4), Y(cy + Math.sin(a) * r * 0.7), X(cx + Math.cos(a) * r * 0.7 + 1.4), Y(cy + Math.sin(a) * r * 0.7), X(cx + Math.cos(a) * (r + 3.4)), Y(cy + Math.sin(a) * (r + 3.4)), 4, 1);
      }
    } else if (kind === 'squirrel') {
      const t = warn ? -1 : 0;
      g.ellipse(X(5), Y(9 + t), 4.4, 7, 0);
      g.ellipse(X(4), Y(4 + t), 3.6, 3, 0);
      g.pattern(0, (x, y) => x < X(5), -1);
      g.ellipse(X(13), Y(15), 5, 5.4, 0);
      g.ellipse(X(14), Y(16.4), 3, 3.4, 1);
      g.ellipse(X(16), Y(9), 4.4, 4, 0);
      g.tri(X(14), Y(6), X(16), Y(6), X(14.6), Y(2.4), 0, 1);
      g.tri(X(17), Y(6), X(19), Y(6), X(18.4), Y(2.6), 0, 1);
      g.ellipse(X(19.2), Y(10.4), 1.6, 1.2, 1);
      eye(17, 8.6, 1.1);
      g.put(X(20.4), Y(10), 3);
      g.ellipse(X(11 + step), Y(20.5), 2, 1, 4);
      g.ellipse(X(16 - step), Y(20.5), 2, 1, 4);
      if (warn) g.ellipse(X(20), Y(12), 2, 2, 4);
    } else if (kind === 'bee') {
      const wing = frame ? -2 : 0;
      g.ellipse(X(8), Y(5 + wing), 4.4, 3, 4, 0, true);
      g.ellipse(X(15), Y(5 + wing), 4.4, 3, 4, 0, true);
      g.ellipse(X(12), Y(12), 8.4, 6, 0);
      g.pattern(0, (x) => (x - X(4)) % 5 < 2 && x < X(16), -3);
      for (let y = 0; y < 30; y += 1) for (let x = 0; x < 34; x += 1) { const i = y * 34 + x; if (g.mat[i] === 0 && (x - X(4)) % 5 < 2 && x < X(15)) g.mat[i] = 1; }
      eye(16.5, 10.6, 1.3);
      g.tri(X(3), Y(12), X(3), Y(14), X(-0.5), Y(13), 3, 2);
    }
    const surface = g.render(forestMats(kind));
    forestCache.set(key, surface);
    return surface;
  }

  // ---------- stan P3 ----------
  function p3ResetLevel(source) {
    game.vines = (source.vines || []).map((v) => ({ ...v }));
    game.cones = [];
    game.scatter = [];
    game.magnet = 0;
    game.chaseX = source.chase ? source.startX - 360 : -1e9;
    game.vineHintShown = false;
    if (HERO === 'C') game.guide.doubleDone = true;
  }

  function enemyBaseSpeed(spawn, levelIndex) {
    if (spawn.boss) return 1.16;
    switch (spawn.kind) {
      case 'hopper': return 0.72;
      case 'hedgehog': return 0.7;
      case 'squirrel': return 0.32;
      case 'bee': return 1.15;
      default: return 0.88 + levelIndex * 0.03;
    }
  }

  function updateBee(enemy) {
    if (enemy.baseY === undefined) { enemy.baseY = enemy.y; enemy.t = Math.random() * 100; }
    enemy.t += 1;
    enemy.walkTick += 1;
    if (enemy.walkTick >= 3) { enemy.walkTick = 0; enemy.walkFrame ^= 1; }
    if (enemy.hitPause > 0) { enemy.hitPause -= 1; return; }
    if (enemy.pooped) {
      enemy.poopTimer -= 1;
      enemy.y = Math.min(enemy.baseY + 40, enemy.y + 0.8);
      if (enemy.poopTimer <= 0) enemy.pooped = false;
      return;
    }
    enemy.x += enemy.facingLeft ? -enemy.vx : enemy.vx;
    if (enemy.x <= enemy.minX) { enemy.x = enemy.minX; enemy.facingLeft = false; }
    if (enemy.x + enemy.w >= enemy.maxX) { enemy.x = enemy.maxX - enemy.w; enemy.facingLeft = true; }
    const target = enemy.baseY + Math.sin(enemy.t * 0.06) * 26;
    enemy.y += (target - enemy.y) * 0.2;
  }

  function updateSquirrel(enemy, grounded) {
    if (enemy.throwTimer === undefined) enemy.throwTimer = 60 + Math.floor(Math.random() * 60);
    const p = game.player;
    const dx = p.x - enemy.x;
    const near = Math.abs(dx) < 380 && Math.abs(p.y - enemy.y) < 220;
    if (near) enemy.facingLeft = dx < 0;
    enemy.throwTimer -= 1;
    enemy.throwWarn = near && enemy.throwTimer < 18;
    if (enemy.throwTimer <= 0 && grounded) {
      enemy.throwTimer = 120 + Math.floor(Math.random() * 40);
      if (near) {
        const sx = enemy.x + enemy.w / 2;
        const sy = enemy.y + 6;
        const tx = p.x + PLAYER_W / 2 + p.vx * 24;
        const vx = clamp((tx - sx) / 48, -5.2, 5.2);
        game.cones.push({ x: sx, y: sy, vx, vy: -7.6, rot: 0, life: 260 });
        audio.tone(520, 0.08, 'triangle', 0.06, 760, 0);
      }
    }
  }

  function p3Disenchant(enemy) {
    const cx = enemy.x + enemy.w / 2;
    const cy = enemy.y + enemy.h / 2;
    for (let k = 0; k < (enemy.boss ? 40 : 16); k += 1) {
      const a = Math.random() * Math.PI * 2;
      const v = 1 + Math.random() * 3;
      game.particles.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.5, color: ['#FFF6A8', '#9AF0FF', '#FFB8F0', '#FFFFFF'][k % 4], life: 34 + Math.random() * 20, size: 3 });
    }
    if (!enemy.boss) popup(cx - game.cameraX, enemy.y - 26, 'ODCZAROWANY!', '#B8F4FF');
    audio.tone(880, 0.1, 'sine', 0.06, 1320, 0.05);
    audio.tone(1320, 0.14, 'sine', 0.05, 1760, 0.12);
  }

  function scatterAcorns(player) {
    const n = 6;
    for (let k = 0; k < n; k += 1) {
      const a = -Math.PI / 2 + (k - (n - 1) / 2) * 0.42;
      game.scatter.push({ x: player.x + PLAYER_W / 2 - 12, y: player.y + 6, vx: Math.cos(a) * 3.4, vy: Math.sin(a) * 5.2 - 2, t: 0 });
    }
  }

  function startDash(player) {
    if ((player.dashCool || 0) > 0 || player.dash > 0) return false;
    player.dash = 13;
    player.dashCool = 40;
    player.dashDir = player.facingLeft ? -1 : 1;
    player.pounding = false;
    audio.noise(0.18, 0.1, 'bandpass', 700, 3200, 0, 1);
    audio.tone(520, 0.12, 'triangle', 0.07, 1100, 0);
    game.guide.shootDone = true;
    return true;
  }

  function p3PlayerMotion(player) {
    player.p3NoGravity = false;
    if (player.dashCool > 0) player.dashCool -= 1;
    if (player.dash > 0) {
      player.dash -= 1;
      player.vx = player.dashDir * 8.4;
      player.vy = 0;
      player.p3NoGravity = true;
      player.facingLeft = player.dashDir < 0;
      if (game.frame % 2 === 0) game.particles.push({ x: player.x + PLAYER_W / 2 - player.dashDir * 14, y: player.y + 18 + Math.random() * 16, vx: -player.dashDir * 1.2, vy: 0, color: 'rgba(255,240,200,0.9)', life: 14, size: 4 });
      if (player.dash === 0) player.vx = player.dashDir * 3;
      return;
    }
    player.climbing = false;
    if (HERO !== 'C' || !game.vines || !game.vines.length) return;
    const cx = player.x + PLAYER_W / 2;
    const feet = player.y + PLAYER_H;
    const v = game.vines.find((vv) => Math.abs(cx - vv.x) < 20 && feet > vv.top - 4 && player.y < vv.bottom);
    if (!v || player.onGround) return;
    if (input.jumpHeld && feet > v.top + 2) {
      player.vy = -3.6;
      player.p3NoGravity = true;
      player.climbing = true;
      player.x += (v.x - cx) * 0.2;
      player.airJumps = 0;
      if (game.frame % 10 === 0) audio.tone(300 + (game.frame % 20) * 10, 0.04, 'triangle', 0.03, 0, 0);
    } else if (input.jumpHeld && feet <= v.top + 2) {
      player.vy = Math.min(player.vy, -6.5);
    }
  }

  function updateP3() {
    const player = game.player;
    if (game.magnet > 0) game.magnet -= 1;
    if (player.bubble > 0) player.bubble -= 1;
    // pnącza – podpowiedź
    if (!game.vineHintShown && game.vines.some((v) => v.x - game.cameraX > 120 && v.x - game.cameraX < BASE_W - 120)) {
      game.vineHintShown = true;
      setNotice(HERO === 'C' ? 'Pnącze! Podskocz i trzymaj skok – Persi się wspina.' : 'Pnącza są dla Persiego. Puszek ma za to podwójny skok!', '#C8F0A8', 220, 2, 'PNĄCZE');
    }
    // szyszki
    game.cones = game.cones.filter((c) => {
      c.vy = Math.min(10, c.vy + 0.32);
      c.x += c.vx;
      c.y += c.vy;
      c.rot += c.vx * 0.12;
      c.life -= 1;
      for (const p of game.platforms) {
        if (p.gone) continue;
        if (c.x > p.x && c.x < p.x + p.w && c.y + 6 >= p.y && c.y + 6 <= p.y + 16 && c.vy > 0) {
          emitDust(c.x, p.y - 2, 5);
          audio.noise(0.06, 0.05, 'bandpass', 1200, 0, 0, 2);
          return false;
        }
      }
      if (c.life <= 0 || c.y > BASE_H + 40) return false;
      if (overlap(player.x + 8, player.y + 6, PLAYER_W - 16, PLAYER_H - 10, c.x - 7, c.y - 7, 14, 14)) {
        if (player.dash > 0) { emitSpark(c.x, c.y, '#C88A4A', 8); return false; }
        if (player.invul <= 0) damagePlayer('szyszka');
        return false;
      }
      return true;
    });
    // rozsypane żołędzie
    game.scatter = game.scatter.filter((a) => {
      a.t += 1;
      a.vy = Math.min(9, a.vy + 0.36);
      a.x += a.vx;
      a.y += a.vy;
      a.vx *= 0.99;
      for (const p of game.platforms) {
        if (p.gone) continue;
        if (a.x + 18 > p.x && a.x + 6 < p.x + p.w && a.vy > 0 && a.y + 28 >= p.y && a.y + 28 - a.vy <= p.y + 4) {
          a.y = p.y - 28;
          a.vy = -a.vy * 0.45;
          a.vx *= 0.8;
          if (Math.abs(a.vy) < 1) a.vy = 0;
        }
      }
      if (a.y > BASE_H + 40 || a.t > 420) return false;
      if (a.t > 22 && overlap(player.x, player.y, PLAYER_W, PLAYER_H, a.x, a.y, 24, 28)) {
        game.score += 10;
        audio.cue('collect', { streak: 1 });
        emitSpark(a.x + 12, a.y + 12, '#E8C890', 6);
        return false;
      }
      return true;
    });
    // pościg
    if (game.level.chase && !game.celebrate) {
      const ch = game.level.chase;
      if (game.levelFrames > (ch.delay || 150) && player.x < game.level.exitX - 160) game.chaseX += ch.speed;
      if (game.levelFrames % 50 === 0 && game.chaseX > game.cameraX - 200) triggerShake(2, 6);
      if (player.x < game.chaseX + 30) {
        if (player.invul <= 0) damagePlayer('wiatrolom');
        if (game.scene === 'PLAYING') {
          player.x = Math.max(player.x, game.chaseX + 120);
          player.vy = Math.min(player.vy, -7);
        }
      }
    }
  }

  function drawP3Back() {
    for (const v of game.vines || []) {
      const x = snap(v.x - game.cameraX);
      if (x < -30 || x > BASE_W + 30) continue;
      for (let y = v.top; y < v.bottom; y += 12) {
        const sway = Math.round(Math.sin(y * 0.05 + game.frame * 0.03) * 2);
        ctx.fillStyle = '#2E6A2A';
        ctx.fillRect(x - 2 + sway, y, 5, 12);
        ctx.fillStyle = '#5AAE46';
        ctx.fillRect(x - 1 + sway, y, 2, 12);
        if ((y / 12) % 2 === 0) {
          ctx.fillStyle = '#6CC456';
          ctx.fillRect(x + 3 + sway, y + 2, 7, 4);
          ctx.fillStyle = '#3E8A32';
          ctx.fillRect(x + 3 + sway, y + 5, 7, 1);
        } else {
          ctx.fillStyle = '#6CC456';
          ctx.fillRect(x - 10 + sway, y + 4, 7, 4);
        }
      }
    }
  }

  const CONE_ART = (() => {
    const g = new PixelGrid(14, 16);
    const mats = [makeMat('#9A6A3A', '#2A160A'), makeMat('#C8925A', '#3A200C')];
    g.ellipse(7, 8.5, 5, 6.5, 0);
    for (let y = 3; y < 15; y += 3) for (let x = 3; x < 12; x += 3) g.put(x + (y % 2), y, 1, 3);
    return g.render(mats);
  })();

  function drawP3Front() {
    for (const c of game.cones) {
      ctx.save();
      ctx.translate(snap(c.x - game.cameraX), snap(c.y));
      ctx.rotate(c.rot);
      ctx.drawImage(CONE_ART, -14, -16, 28, 32);
      ctx.restore();
    }
    for (const a of game.scatter) {
      if (a.t > 360 && Math.floor(a.t / 4) % 2) continue;
      drawItemArt('carrot', snap(a.x - game.cameraX), snap(a.y), ART);
    }
    const player = game.player;
    if (player.bubble > 0) {
      const cx = snap(player.x - game.cameraX + PLAYER_W / 2);
      const cy = snap(player.y + PLAYER_H / 2);
      const blink = player.bubble < 90 && Math.floor(player.bubble / 6) % 2;
      if (!blink) {
        ctx.strokeStyle = 'rgba(160,220,255,0.85)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy, 36 + Math.sin(game.frame * 0.15) * 2, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(160,220,255,0.12)';
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fillRect(cx - 20, cy - 22, 6, 6);
      }
    }
    if (game.magnet > 0) {
      const cx = player.x - game.cameraX + PLAYER_W / 2;
      const cy = player.y + PLAYER_H / 2;
      for (let k = 0; k < 6; k += 1) {
        const a = game.frame * 0.08 + k * Math.PI / 3;
        const r = 50 + (game.frame * 2 + k * 20) % 60;
        ctx.fillStyle = k % 2 ? 'rgba(255,120,130,0.7)' : 'rgba(220,230,255,0.7)';
        ctx.fillRect(snap(cx + Math.cos(a) * r), snap(cy + Math.sin(a) * r * 0.6), 3, 3);
      }
    }
    // pościg: wiatrołom – toczący się pień i burza liści
    if (game.level.chase) {
      const sx = game.chaseX - game.cameraX;
      if (sx > -260) {
        const ground = BASE_H - TILE;
        ctx.save();
        const grad = ctx.createLinearGradient(sx - 300, 0, sx + 40, 0);
        grad.addColorStop(0, 'rgba(40,60,40,0.85)');
        grad.addColorStop(1, 'rgba(40,60,40,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(sx - 300, 0, 340, BASE_H);
        for (let k = 0; k < 26; k += 1) {
          const t = game.frame * 0.05 + k * 1.7;
          const lx = sx - 40 + Math.sin(t * 1.3 + k) * 60 - (k % 5) * 20;
          const ly = ((k * 53 + game.frame * (2 + (k % 3))) % (BASE_H - 40));
          ctx.fillStyle = ['#C86A2A', '#E8A43A', '#7AA84A', '#A04A1E'][k % 4];
          ctx.fillRect(snap(lx), snap(ly), 8, 5);
        }
        const r = 70;
        const cx = sx - 20;
        const cy = ground - r;
        ctx.translate(snap(cx), snap(cy));
        ctx.rotate(game.chaseX * 0.03);
        ctx.fillStyle = '#5A3A1E';
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#C8955A';
        ctx.beginPath(); ctx.arc(0, 0, r - 10, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#8A5A2E';
        ctx.lineWidth = 4;
        for (let rr = 14; rr < r - 10; rr += 14) { ctx.beginPath(); ctx.arc(0, 0, rr, 0, Math.PI * 2); ctx.stroke(); }
        ctx.fillStyle = '#5A3A1E';
        ctx.fillRect(-4, -r + 12, 8, r - 12);
        ctx.restore();
      }
    }
  }

  function drawPersiHero(player, drawX, drawY, ghost) {
    let surface;
    if (player.dash > 0) surface = buildCat('walker', 0, 'air');
    else if (player.climbing) surface = buildCat('walker', Math.floor(game.frame / 8) % 2, 'walk');
    else if (!player.onGround) surface = buildCat('walker', 0, 'air');
    else if (Math.abs(player.vx) > 0.3) surface = buildCat('walker', player.walkFrame, 'walk');
    else surface = buildCatPose('walker', Math.floor(game.levelFrames / 240) % 4 === 3 ? 'yawn' : 'sit');
    ctx.save();
    if (ghost) ctx.globalAlpha = 0.4;
    drawArtFootprint({ c: surface, ox: CAT_CANVAS.ox, oy: CAT_CANVAS.oy, fw: 24, fh: 21 }, drawX, drawY + 6, PLAYER_W, PLAYER_H, player.facingLeft);
    ctx.restore();
    if (player.dash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      for (let k = 0; k < 3; k += 1) ctx.fillRect(snap(drawX + (player.dashDir > 0 ? -16 - k * 14 : PLAYER_W + 6 + k * 14)), snap(drawY + 14 + k * 10), 12, 3);
    }
  }


  // ===================================================================
  // v5: cat poses, weather, drums, world map
  // ===================================================================
  function catHead(g, X, Y, hx, hy, eyes, droop = 0) {
    g.tri(X(hx - 6.2), Y(hy - 2.4 + droop), X(hx - 4.8 - droop), Y(hy - 9 + droop * 2), X(hx - 1.2), Y(hy - 4.4), 0, 2);
    g.tri(X(hx + 1.2), Y(hy - 4.6), X(hx + 5 + droop), Y(hy - 8.8 + droop * 2), X(hx + 6.2), Y(hy - 1.8 + droop), 0, 3);
    g.tri(X(hx - 4.8), Y(hy - 3.6), X(hx - 4.4 - droop), Y(hy - 7 + droop * 2), X(hx - 2.2), Y(hy - 4.4), 3);
    g.tri(X(hx + 2.4), Y(hy - 4.4), X(hx + 4.6 + droop), Y(hy - 7 + droop * 2), X(hx + 5), Y(hy - 2.8), 3);
    g.ellipse(X(hx), Y(hy), 7.2, 6.2, 0);
    g.ellipse(X(hx - 4.6), Y(hy + 2.4), 3.2, 3, 0);
    g.ellipse(X(hx + 4.4), Y(hy + 2.4), 3, 2.8, 0);
    for (const fx of [-2, 0, 2]) {
      g.put(X(hx + fx + 0.5), Y(hy - 5), 9, 1);
      g.put(X(hx + fx + 0.5), Y(hy - 4), 9, 1);
    }
    g.put(X(hx - 1.5), Y(hy - 3), 9, 1);
    g.put(X(hx + 1.5), Y(hy - 3), 9, 1);
    g.put(X(hx - 5), Y(hy + 1), 9, 1);
    g.put(X(hx - 4), Y(hy + 1), 9, 1);
    g.ellipse(X(hx + 1.6), Y(hy + 3.6), 3.2, 2.2, 2, 0);
    g.ellipse(X(hx + 2.6), Y(hy + 1.6), 2.2, 1.6, 2, 1);
    const eyeY = hy - 0.4;
    for (const ex of [hx - 1.6, hx + 3]) {
      if (eyes === 'closed') {
        g.rect(X(ex - 1), Y(eyeY), 2, 1, 8);
        g.put(X(ex - 1.5), Y(eyeY - 1), 8);
      } else {
        g.rect(X(ex - 1), Y(eyeY - 1), 3, 1, 8);
        g.rect(X(ex - 1), Y(eyeY), 2, 1, 4);
        g.put(X(ex), Y(eyeY), 5);
      }
    }
    g.put(X(hx + 2.4), Y(hy + 1.4), 6);
    g.put(X(hx + 3.4), Y(hy + 1.4), 6);
  }

  function buildCatPose(kind, state, frame = 0) {
    const key = `pose|${kind}|${state}|${frame}`;
    const cached = catCache.get(key);
    if (cached) return cached;
    const mats = catMats(kind);
    const { w, h, ox, oy } = CAT_CANVAS;
    const g = new PixelGrid(w, h);
    const X = (v) => ox + v;
    const Y = (v) => oy + v;
    if (state === 'sleep') {
      const breath = frame ? 0.5 : 0;
      g.ellipse(X(10), Y(16.6 - breath * 0.5), 10.2, 4.6 + breath, 0);
      g.pattern(0, (x, y) => y < Y(16) && ((x + Math.floor((y - Y(10)) * 0.35)) % 4 === 0), -2);
      g.ellipse(X(19.6), Y(20.2), 2.8, 1.3, 2);
      catHead(g, X, Y, 18.4, 14.4 - breath * 0.4, 'closed', 0.6);
      g.capsule(X(1.2), Y(20.4), X(15), Y(21), 1.7, 1.5, 0);
      g.pattern(0, (x, y) => y >= Y(19.6) && y <= Y(21.6) && x < X(15) && x % 3 === 0, -2);
    } else {
      const yawn = state === 'yawn';
      g.capsule(X(1.6), Y(20.6), X(10), Y(20.8), 1.6, 1.6, 1);
      g.capsule(X(1.6), Y(20.6), X(0.6), Y(16.6), 1.6, 1.4, 1);
      g.pattern(1, (x, y) => x % 3 === 0, -2);
      g.ellipse(X(8.6), Y(16.4), 6.4, 4.8, 0);
      g.ellipse(X(12.6), Y(12.4), 5.2, 7, 0);
      g.pattern(0, (x, y) => y < Y(16) && x < X(13) && ((x + Math.floor((y - Y(6)) * 0.35)) % 4 === 0), -2);
      g.capsule(X(16.6), Y(14), X(16.6), Y(20.4), 1.7, 1.6, 1);
      g.ellipse(X(15.4), Y(13.4), 2.6, 4.4, 2);
      g.capsule(X(14.4), Y(14), X(14.4), Y(20.6), 1.8, 1.6, 0);
      g.ellipse(X(14.6), Y(20.8), 2, 1.1, 2);
      catHead(g, X, Y, 16.8, 5.8 - (yawn ? 0.8 : 0), yawn ? 'closed' : 'sleepy');
      if (yawn) {
        g.ellipse(X(19.4), Y(9.4), 1.7, 2.1, 8, 0, true);
        g.put(X(19.4), Y(10), 6);
      }
    }
    const surface = g.render(mats);
    catCache.set(key, surface);
    return surface;
  }

  function drawZ(x, y, s) {
    const u = s;
    ctx.fillRect(snap(x), snap(y), 4 * u, u);
    ctx.fillRect(snap(x + 2 * u), snap(y + u), u, u);
    ctx.fillRect(snap(x + u), snap(y + 2 * u), u, u);
    ctx.fillRect(snap(x), snap(y + 3 * u), 4 * u, u);
  }

  // ---------------- weather ----------------
  function updateWeather(th) {
    if (!game.weather || game.weather.theme !== th) game.weather = { theme: th, rain: [], splash: [], blobs: [], mist: [] };
    const w = game.weather;
    const camDelta = game.cameraX - (w.cam === undefined ? game.cameraX : w.cam);
    w.cam = game.cameraX;
    if (th.rain) {
      while (w.rain.length < 110) w.rain.push({ x: Math.random() * (BASE_W + 100), y: Math.random() * BASE_H - BASE_H, v: 9 + Math.random() * 4 });
      for (const d of w.rain) {
        d.y += d.v;
        d.x -= 2.4 + camDelta * 0.9;
        const ground = BASE_H - TILE;
        if (d.y > ground) {
          if (Math.random() < 0.5) w.splash.push({ x: d.x, y: ground - 2, life: 7 });
          d.y = -20 - Math.random() * 100;
          d.x = Math.random() * (BASE_W + 140);
        }
        if (d.x < -30) d.x += BASE_W + 60;
      }
      w.splash = w.splash.filter((s) => {
        s.life -= 1;
        s.x -= camDelta;
        return s.life > 0;
      });
    }
    if (th.mist) {
      while (w.mist.length < 4) w.mist.push({ x: Math.random() * BASE_W, y: BASE_H - 40 - Math.random() * 70, r: 120 + Math.random() * 100, v: 0.15 + Math.random() * 0.2 });
      for (const m of w.mist) {
        m.x += m.v - camDelta * 0.7;
        if (m.x - m.r > BASE_W) m.x = -m.r;
        if (m.x + m.r < -10) m.x = BASE_W + m.r;
      }
    }
    if (th.blobs) {
      if (w.blobs.length < 2 && Math.random() < 0.006) {
        w.blobs.push({ x: BASE_W + 80, y: 60 + Math.random() * 300, vx: -3 - Math.random() * 2, vy: 0.4 + Math.random() * 0.6, seed: Math.random(), spin: Math.random() * 6 });
      }
      w.blobs = w.blobs.filter((b) => {
        b.x += b.vx - camDelta * 1.5;
        b.y += b.vy + Math.sin(b.spin) * 0.6;
        b.spin += 0.04;
        return b.x > -140 && b.y < BASE_H + 80;
      });
    }
  }

  function drawWeatherBack(th) {
    const w = game.weather;
    if (!w || w.theme !== th) return;
    if (th.mist) {
      for (const m of w.mist) {
        const grad = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r);
        grad.addColorStop(0, 'rgba(235,248,255,0.28)');
        grad.addColorStop(1, 'rgba(235,248,255,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(m.x - m.r, m.y - m.r * 0.4, m.r * 2, m.r * 0.8);
      }
    }
  }

  function drawWeatherFront(th) {
    const w = game.weather;
    if (!w || w.theme !== th) return;
    if (th.rain) {
      ctx.fillStyle = 'rgba(28,38,60,0.12)';
      ctx.fillRect(0, 0, BASE_W, BASE_H);
      ctx.fillStyle = 'rgba(190,215,255,0.55)';
      for (const d of w.rain) {
        const x = snap(d.x);
        const y = snap(d.y);
        ctx.fillRect(x, y, 2, 6);
        ctx.fillRect(x - 2, y + 6, 2, 4);
      }
      ctx.fillStyle = 'rgba(210,230,255,0.7)';
      for (const s of w.splash) {
        const spread = (7 - s.life) * 2;
        ctx.fillRect(snap(s.x - spread), snap(s.y - 2), 2, 2);
        ctx.fillRect(snap(s.x + spread), snap(s.y - 2), 2, 2);
      }
    }
    if (th.blobs) {
      for (const b of w.blobs) {
        ctx.save();
        ctx.globalAlpha = 0.42;
        const name = th.blobs === 'petal' ? '#F6A6C8' : th.blobs === 'flower' ? '#FFE48A' : '#2E6A3A';
        const shade = th.blobs === 'petal' ? '#D77AA2' : th.blobs === 'flower' ? '#E0B84A' : '#1E4A28';
        const u = 10;
        const x = snap(b.x);
        const y = snap(b.y);
        const flip = Math.sin(b.spin * 1.5) > 0 ? 1 : -1;
        ctx.fillStyle = name;
        ctx.fillRect(x, y, u * 4, u * 2);
        ctx.fillRect(x + u * flip, y - u, u * 2, u);
        ctx.fillRect(x + u, y + u * 2, u * 2, u);
        ctx.fillStyle = shade;
        ctx.fillRect(x + u * 2, y + u, u * 2, u);
        ctx.restore();
      }
    }
  }

  // ---------------- shockwaves ----------------
  function updateShockwaves() {
    if (!game.shockwaves) game.shockwaves = [];
    game.shockwaves = game.shockwaves.filter((s) => {
      s.r += 9;
      s.life -= 1;
      return s.life > 0;
    });
  }

  function drawShockwaves() {
    if (!game.shockwaves) return;
    for (const s of game.shockwaves) {
      ctx.globalAlpha = clamp(s.life / 14, 0, 1);
      ctx.fillStyle = '#FFFFFF';
      for (let a = 0; a < Math.PI * 2; a += 0.09) {
        const x = s.x - game.cameraX + Math.cos(a) * s.r;
        const y = s.y + Math.sin(a) * s.r * 0.22;
        if (y > s.y + 2) continue;
        ctx.fillRect(snap(x) - 2, snap(y) - 2, 4, 4);
      }
      ctx.fillStyle = '#FFE9A8';
      ctx.fillRect(snap(s.x - game.cameraX - s.r), snap(s.y) - 2, snap(s.r * 2), 2);
    }
    ctx.globalAlpha = 1;
  }

  function doThump(player) {
    const cx = player.x + PLAYER_W / 2;
    const by = player.y + PLAYER_H;
    triggerShake(7, 16);
    game.hitStop = 5;
    game.guide.poundDone = true;
    audio.cue('thump');
    if (!game.shockwaves) game.shockwaves = [];
    game.shockwaves.push({ x: cx, y: by, r: 8, life: 18 });
    for (let index = 0; index < 18; index += 1) {
      const dir = index % 2 ? 1 : -1;
      game.particles.push({ x: cx + dir * 10, y: by - 4, vx: dir * (2 + Math.random() * 4), vy: -Math.random() * 2.4, color: index % 3 ? '#C49A62' : '#FFF2D0', life: 22 + Math.random() * 10, size: 4 });
    }
    let stunned = 0;
    for (const enemy of game.enemies) {
      if (enemy.hp <= 0) continue;
      const ex = enemy.x + enemy.w / 2;
      if (Math.abs(ex - cx) > 140 || Math.abs((enemy.y + enemy.h) - by) > 40 || enemy.standingPlatform < 0) continue;
      if (enemy.boss) {
        enemy.vy = -4;
        enemy.airborne = true;
        if (!game.guide.bossThumpShown) {
          game.guide.bossThumpShown = true;
          setNotice('Grzybowy Król jest za ciężki na tupnięcie. Wskocz mu na kapelusz!', '#FFB5B5', 180, 3, 'HMM');
        }
        continue;
      }
      enemy.pooped = true;
      enemy.poopTimer = 170;
      enemy.hitPause = 12;
      enemy.vy = -5;
      enemy.airborne = true;
      stunned += 1;
      popup(ex - game.cameraX, enemy.y - 10, 'TUP!', '#FFF2A8');
    }
    if (stunned > 1) popup(cx - game.cameraX, by - 70, `${stunned}x OGŁUSZENIE!`, '#FFE082');
    game.rollers = game.rollers.filter((r) => {
      if (Math.abs(r.x + 14 - cx) < 140 && Math.abs(r.y + 28 - by) < 40) {
        emitSpark(r.x + 14, r.y + 14, '#7CC855', 10);
        game.score += 30;
        return false;
      }
      return true;
    });
  }

  function updateDownAction() {
    const p = game.player;
    if (p.prevGround === undefined) p.prevGround = true;
    if (p.onGround && !p.prevGround) p.landedFrame = game.frame;
    p.prevGround = p.onGround;
    const down = input.down;
    p.sneaking = false;
    if (p.pounding) {
      if (p.onGround) {
        p.pounding = false;
        doThump(p);
      } else {
        p.vx *= 0.7;
        p.vy = Math.max(p.vy, 12);
        if (game.frame % 2 === 0) game.particles.push({ x: p.x + 10 + Math.random() * 28, y: p.y - 6, vx: 0, vy: -2, color: '#FFFFFF', life: 10, size: 2 });
      }
      return;
    }
    if (down && !p.onGround && !p.downLatch && !p.rolling) {
      p.pounding = true;
      p.downLatch = true;
      p.vy = 12;
      p.vx = 0;
      game.hitStop = 2;
      audio.cue('dive');
      return;
    }
    if (down && p.onGround) {
      p.sneaking = true;
      p.vx = clamp(p.vx, -1.15, 1.15);
    }
    if (!down) p.downLatch = false;
  }

  function wakeSleeper(enemy) {
    if (enemy.sleepState !== 'asleep' && enemy.sleepState !== 'yawn') return;
    enemy.sleepState = 'alert';
    enemy.stateTimer = 26;
    audio.cue('meow');
    popup(enemy.x - game.cameraX + enemy.w / 2, enemy.y - 16, '!?', '#FFB0A0');
    if (!game.guide.wokeShown) {
      game.guide.wokeShown = true;
      setNotice('Obudziłeś Persiego! Przy śpiącym trzymaj ↓ (S) i skradaj się.', '#FFC8B8', 220, 3, 'UPS');
    }
  }

  function updateSleeper(enemy) {
    const p = game.player;
    const pc = p.x + PLAYER_W / 2;
    const ec = enemy.x + enemy.w / 2;
    const dx = Math.abs(pc - ec);
    const dy = Math.abs((p.y + PLAYER_H) - (enemy.y + enemy.h));
    switch (enemy.sleepState) {
      case 'asleep': {
        const running = p.onGround && !p.sneaking && Math.abs(p.vx) > 1.25 && dx < 150;
        const landed = !p.sneaking && game.frame - (p.landedFrame || -99) < 2 && dx < 170;
        const close = p.onGround && !p.sneaking && Math.abs(p.vx) > 0.2 && dx < 60;
        if ((running || landed || close) && dy < 90) wakeSleeper(enemy);
        break;
      }
      case 'alert':
        enemy.stateTimer -= 1;
        enemy.facingLeft = pc < ec;
        if (enemy.stateTimer <= 0) {
          enemy.sleepState = 'chase';
          enemy.stateTimer = 260;
        }
        break;
      case 'chase': {
        enemy.stateTimer -= 1;
        const dir = pc < ec ? -1 : 1;
        enemy.facingLeft = dir < 0;
        if (dx > 6) enemy.x += dir * 2.25;
        if (enemy.x <= enemy.minX) enemy.x = enemy.minX;
        if (enemy.x + enemy.w >= enemy.maxX) enemy.x = enemy.maxX - enemy.w;
        if (enemy.stateTimer <= 0) {
          enemy.sleepState = 'yawn';
          enemy.stateTimer = 70;
        }
        break;
      }
      default:
        enemy.stateTimer -= 1;
        if (enemy.stateTimer <= 0) enemy.sleepState = 'asleep';
        break;
    }
  }

  // ---------------- world map ----------------
  const MAP_NODES = [[110, 392], [250, 330], [400, 388], [550, 312], [700, 230]];
  const MAP_COLORS = ['#7BD45A', '#F2A65A', '#3E9A5A', '#8FC8FF', '#4AA0E0', '#F28AB8', '#A39AB2', '#9A6CF0'];
  let mapArt = null;

  function mapPathPoints() {
    const pts = [];
    for (let i = 0; i < MAP_NODES.length - 1; i += 1) {
      const [x0, y0] = MAP_NODES[i];
      const [x1, y1] = MAP_NODES[i + 1];
      const cx = (x0 + x1) / 2 + (i % 2 ? 26 : -26);
      const cy = (y0 + y1) / 2 + (i % 2 ? -20 : 24);
      for (let t = 0; t <= 1; t += 0.02) {
        const a = (1 - t) * (1 - t);
        const b = 2 * (1 - t) * t;
        const c = t * t;
        pts.push([a * x0 + b * cx + c * x1, a * y0 + b * cy + c * y1, i]);
      }
    }
    return pts;
  }

  function buildMapArt() {
    const W = 400;
    const H = 240;
    const greens = ['#5AA44C', '#69B655', '#7CC860', '#93D86E'].map(hexRgb);
    const water = ['#3E86C8', '#4E9AD8', '#6CB4E8'].map(hexRgb);
    const sand = hexRgb('#E9D59A');
    const rock = ['#8C8496', '#A39CAC', '#C2BCC8', '#F2F2F8'].map(hexRgb);
    const lake = (x, y) => ((x - 52) / 56) ** 2 + ((y - 44) / 30) ** 2;
    const riverX = (y) => 140 + (y - 60) * 0.62 + Math.sin(y * 0.05) * 12;
    const mountainTop = (x) => 128 - (x - 250) * 0.42 + periodicNoise(x / 9, 999, 3) * 14;
    const base = imageCanvas(W, H, (set) => {
      for (let y = 0; y < H; y += 1) {
        for (let x = 0; x < W; x += 1) {
          const n = noise2(x * 0.06, y * 0.06, 11) * 0.7 + noise2(x * 0.22, y * 0.22, 12) * 0.3 + (bayer(x, y) - 0.5) * 0.14;
          let rgb = greens[n < 0.36 ? 0 : n < 0.58 ? 1 : n < 0.78 ? 2 : 3];
          const l = lake(x, y);
          const rd = y > 56 ? Math.abs(x - riverX(y)) : 99;
          if (l < 1 || rd < 4) {
            const w = (x * 3 + y * 7) % 11 === 0 ? 2 : (l < 0.5 || rd < 2 ? 0 : 1);
            rgb = water[w];
          } else if (l < 1.25 || rd < 6) {
            rgb = sand;
          }
          if (x > 250) {
            const peak = Math.abs(((x - 250) % 34) - 17) * 1.6;
            const ridge = mountainTop(x) - 58 + peak + noise2(x * 0.2, 2, 4) * 8;
            if (y < mountainTop(x) && y > ridge) {
              const fromTop = y - ridge;
              const leftLit = ((x - 250) % 34) < 17;
              let tone = leftLit ? 2 : 1;
              if (noise2(x * 0.18, y * 0.18, 7) > 0.66) tone -= 1;
              rgb = fromTop < 7 + noise2(x * 0.4, 3, 5) * 4 ? rock[3] : rock[Math.max(0, tone)];
            }
          }
          set(x, y, rgb);
        }
      }
    });
    const g = base.getContext('2d');
    // path (dotted sand) with shadow
    const pts = mapPathPoints();
    pts.forEach(([px, py], index) => {
      if (index % 3 === 2) return;
      const x = Math.round(px / 2);
      const y = Math.round(py / 2);
      g.fillStyle = '#9C7E44';
      g.fillRect(x - 1, y, 3, 2);
      g.fillStyle = '#F2E2AA';
      g.fillRect(x - 1, y - 1, 3, 2);
    });
    // decor via pixel grids
    const decor = new PixelGrid(W, H);
    const mats = [
      makeMat('#3E8A52', null, { strength: 0.8 }),
      makeMat('#5E3E26', null, { strength: 0.6 }),
      makeMat('#F4F8FF', null, { tones: ['#B8C8E4', '#DCE6F6', '#F4F8FF', '#FFFFFF'] }),
      makeMat('#F2862E', null, { flat: true }),
      makeMat('#F49AC4', null, { flat: true }),
      makeMat('#F3E6CC', null, { strength: 0.4 }),
      makeMat('#7E7890', null, { strength: 0.7 }),
      makeMat('#6E4A9A', null, { strength: 0.7 }),
      makeMat('#FFE07A', null, { flat: true }),
      makeMat('#4F9A4A', null, { strength: 0.8 })
    ];
    const pine = (x, y, s) => {
      decor.rect(x, y - 1, 1, 3, 1, 1);
      for (let k = 0; k < 3; k += 1) decor.tri(x - (5 - k) * s, y - k * 3 * s, x + (5 - k) * s + 1, y - k * 3 * s, x + 0.5, y - (k * 3 + 6) * s, 0, (a, b, c, px) => (px < x ? 3 : 1));
    };
    const tree = (x, y, s) => {
      decor.rect(x, y - 3, 1, 4, 1, 1);
      decor.ellipse(x + 0.5, y - 6 * s, 4.4 * s, 4 * s, 9);
    };
    for (let i = 0; i < 26; i += 1) {
      const x = 118 + hash01(i * 3.1) * 60;
      const y = 166 + hash01(i * 7.7) * 40;
      if (Math.hypot(x - 159, y - 197) < 12) continue;
      pine(Math.round(x), Math.round(y), 0.8 + hash01(i) * 0.4);
    }
    for (const [x, y] of [[22, 150], [36, 172], [18, 200], [60, 222], [150, 120], [176, 228], [240, 228], [290, 230], [380, 226], [212, 214], [330, 124]]) tree(x, y, 1);
    for (let r = 0; r < 4; r += 1) for (let c = 0; c < 7; c += 1) decor.put(78 + c * 6 + (r % 2) * 3, 136 + r * 5, 3);
    for (let k = 0; k < 4; k += 1) {
      const cx = 192 + k * 11;
      decor.ellipse(cx, 122 + (k % 2) * 3, 7, 5, 2);
    }
    for (let x = 286; x < 330; x += 4) {
      decor.rect(x, 158, 1, 5, 5, 2);
    }
    decor.rect(286, 160, 44, 1, 5, 1);
    for (let k = 0; k < 10; k += 1) decor.put(288 + k * 4, 166 + (k % 2) * 2, 4);
    // castle on the mountain
    const cx0 = 352;
    const cy0 = 82;
    decor.rect(cx0, cy0 - 10, 22, 14, 6, 2);
    for (const [tx, th] of [[cx0 - 3, 22], [cx0 + 21, 22], [cx0 + 9, 30]]) {
      decor.rect(tx, cy0 - th + 4, 5, th, 6, 1);
      decor.tri(tx - 1, cy0 - th + 4, tx + 6, cy0 - th + 4, tx + 2.5, cy0 - th - 4, 7, (a, b, c, px) => (px < tx + 2 ? 3 : 1));
      decor.put(tx + 2, cy0 - th + 9, 8);
    }
    decor.rect(cx0 + 8, cy0 - 3, 5, 7, 1, 0);
    g.drawImage(decor.render(mats, false), 0, 0);
    return base;
  }

  function mapUnlocked() {
    const stored = Number(game.progress.u) || 0;
    let fromStars = 0;
    for (const key of Object.keys(game.progress.s)) fromStars = Math.max(fromStars, Number(key) + 1);
    return clamp(Math.max(stored, fromStars), 0, LEVELS.length - 1);
  }

  function openMap(select) {
    input.resetAll();
    game.notice = null;
    if (!game.map) game.map = { sel: 0, from: 0, t: 1 };
    const unlocked = mapUnlocked();
    const sel = clamp(select == null ? unlocked : select, 0, unlocked);
    game.map.sel = sel;
    game.map.from = sel;
    game.map.t = 1;
    setScene('MAP');
    const [nx, ny] = MAP_NODES[sel];
    openWipe(nx, ny - 20);
  }

  function selectMapNode(index) {
    const unlocked = mapUnlocked();
    if (index < 0 || index > unlocked) {
      if (index > unlocked && index < LEVELS.length) {
        audio.tone(200, 0.1, 'square', 0.06, 150, 0);
        game.map.locked = 30;
      }
      return;
    }
    if (index === game.map.sel) {
      startWipe(() => startFromMap(index), MAP_NODES[index][0], MAP_NODES[index][1] - 20);
      return;
    }
    game.map.from = game.map.sel;
    game.map.sel = index;
    game.map.t = 0;
    audio.tone(520 + index * 30, 0.08, 'triangle', 0.08, 700, 0);
  }

  function startFromMap(index) {
    audio.resume();
    game.score = 0;
    game.lives = START_LIVES;
    game.ammo = 0;
    game.winTimer = 0;
    game.guide = createGuideState();
    game.notice = null;
    game.flashAlpha = 0;
    game.scoreSyncText = '';
    game.displayScore = 0;
    game.runId += 1;
    game.submittedRunId = -1;
    game.runFromStart = index === 0;
    loadLevel(index);
    if (index === 0 && !game.progress.intro) {
      game.progress.intro = 1;
      saveProgress();
      setScene('ONBOARDING');
    } else {
      setScene('PLAYING');
    }
  }

  function updateMap() {
    const m = game.map;
    if (m.t < 1) m.t = Math.min(1, m.t + 1 / 22);
    if (m.locked > 0) m.locked -= 1;
    if (input.leftPressed) selectMapNode(m.sel - 1);
    if (input.rightPressed) selectMapNode(m.sel + 1);
    if (input.confirmPressed || input.jumpPressed) selectMapNode(m.sel);
    if (input.menuPressed || input.pausePressed) goMenu();
  }

  function drawMap() {
    if (!mapArt) mapArt = buildMapArt();
    ctx.drawImage(mapArt, 0, 0, BASE_W, BASE_H);
    const t = game.frame;
    // water glints
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    for (let k = 0; k < 14; k += 1) {
      if (Math.sin(t * 0.07 + k * 2.1) < 0.6) continue;
      const y = 70 + hash01(k) * 160;
      const x = 2 * (140 + (y / 2 - 60) * 0.62 + Math.sin(y / 2 * 0.05) * 12);
      ctx.fillRect(snap(k < 6 ? 40 + hash01(k + 9) * 140 : x - 2), snap(k < 6 ? 70 + hash01(k + 4) * 40 : y), 4, 2);
    }
    // drifting cloud shadows
    ctx.fillStyle = 'rgba(20,30,60,0.10)';
    for (let k = 0; k < 3; k += 1) {
      const x = ((t * 0.3 + k * 300) % 1100) - 150;
      const y = 80 + k * 120;
      ctx.beginPath();
      ctx.ellipse(x, y, 90, 26, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    const unlocked = mapUnlocked();
    const m = game.map;
    // nodes
    MAP_NODES.forEach(([nx, ny], index) => {
      const open = index <= unlocked;
      const selected = index === m.sel;
      const x = snap(nx);
      const y = snap(ny);
      if (selected) {
        const pulse = 18 + (Math.floor(t / 8) % 2) * 2;
        ctx.fillStyle = 'rgba(255,240,170,0.55)';
        ctx.fillRect(x - pulse, y - 2, pulse * 2, 4);
        ctx.fillRect(x - 2, y - pulse * 0.6, 4, pulse * 1.2);
      }
      ctx.fillStyle = '#1A1230';
      ctx.fillRect(x - 14, y - 8, 28, 18);
      ctx.fillRect(x - 10, y - 12, 20, 26);
      ctx.fillStyle = open ? MAP_COLORS[index] : '#6A6478';
      ctx.fillRect(x - 12, y - 8, 24, 16);
      ctx.fillRect(x - 8, y - 10, 16, 20);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(x - 8, y - 10, 16, 4);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(x - 8, y + 6, 16, 4);
      if (open) {
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 13px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(LEVELS[index].isBoss ? '★' : String(index + 1), x, y + 5);
        ctx.textAlign = 'left';
        const stars = Number(game.progress.s[String(index)]) || 0;
        for (let k = 0; k < 3; k += 1) drawStarShape(x - 14 + k * 14, y - 22, 5, k < stars ? '#FFD94A' : 'rgba(20,14,40,0.55)', '#2A1A08');
      } else {
        ctx.fillStyle = '#2A2238';
        ctx.fillRect(x - 6, y - 2, 12, 8);
        ctx.fillRect(x - 4, y - 8, 2, 6);
        ctx.fillRect(x + 2, y - 8, 2, 6);
        ctx.fillRect(x - 4, y - 8, 8, 2);
        ctx.fillStyle = '#C9B26A';
        ctx.fillRect(x - 4, y, 8, 4);
      }
    });
    // sleeping Persi at the castle
    const [bx, by] = MAP_NODES[MAP_NODES.length - 1];
    const sleeper = buildForestEnemy('boss', Math.floor(t / 40) % 2, 'walk');
    drawArtFootprint({ c: sleeper, ox: 5, oy: 7, fw: 24, fh: 21 }, bx + 22, by - 30, 36, 31.5, true);
    ctx.fillStyle = '#FFFFFF';
    drawZ(bx + 44, by - 44 - (t % 60) * 0.3, 2);
    drawZ(bx + 56, by - 58 - (t % 60) * 0.3, 2);
    // Puszek hops between nodes
    const [fx, fy] = MAP_NODES[m.from];
    const [tx, ty] = MAP_NODES[m.sel];
    const k = m.t;
    const px = fx + (tx - fx) * k;
    const py = fy + (ty - fy) * k - Math.sin(k * Math.PI) * 26;
    const moving = k < 1;
    const rabbit = buildRabbit({ state: moving ? (k < 0.5 ? 'jump' : 'fall') : 'idle', phase: 0, ear: moving ? -0.7 : -0.1 + Math.sin(t * 0.08) * 0.08, blink: !moving && Math.floor(t / 70) % 5 === 0, sx: 1, sy: moving ? 1 : 1 + Math.sin(t * 0.1) * 0.03 });
    if (HERO === 'C') {
      const cat = moving ? buildCat('walker', 0, 'air') : buildCatPose('walker', 'sit');
      drawArtFootprint({ c: cat, ox: CAT_CANVAS.ox, oy: CAT_CANVAS.oy, fw: 24, fh: 21 }, snap(px - 18), snap(py - 34), 36, 32, tx < fx);
    } else {
      drawArtFootprint({ c: rabbit, ox: RABBIT_CANVAS.ox, oy: RABBIT_CANVAS.oy, fw: 24, fh: 24 }, snap(px - 18), snap(py - 40), 36, 36, tx < fx);
    }

    // title + info
    ctx.textAlign = 'center';
    drawPixelText('MAPA PRZYGODY', BASE_W / 2, 40, 8, '#FFD23A', '#3A1406', 3, 'center');
    const sel = m.sel;
    const level = LEVELS[sel];
    drawPanel(196, 56, 408, 98, 'rgba(16,12,34,0.86)', 'rgba(255,224,130,0.45)', 8);
    ctx.fillStyle = MAP_COLORS[sel];
    ctx.fillRect(196 + 6, 62, 6, 86);
    ctx.fillStyle = '#FFE082';
    ctx.font = 'bold 12px monospace';
    ctx.fillText(levelBadge(sel), BASE_W / 2, 78);
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 20px monospace';
    ctx.fillText(levelName(level), BASE_W / 2, 102);
    const best = Number(game.progress.s[String(sel)]) || 0;
    for (let k2 = 0; k2 < 3; k2 += 1) drawStarShape(BASE_W / 2 - 24 + k2 * 24, 120, 9, k2 < best ? '#FFD94A' : 'rgba(255,255,255,0.12)', k2 < best ? '#8A5A00' : 'rgba(255,255,255,0.3)');
    const time = Number(game.progress.t[String(sel)]) || 0;
    ctx.fillStyle = '#B9CDE0';
    ctx.font = '12px monospace';
    ctx.fillText(time ? `Najlepszy czas ${formatTime(time)}` : 'Jeszcze nieprzebyty', BASE_W / 2, 145);
    if (m.locked > 0) {
      drawPanel(BASE_W / 2 - 150, 162, 300, 26, 'rgba(60,16,24,0.9)', 'rgba(255,140,140,0.5)', 4);
      ctx.fillStyle = '#FFD0D0';
      ctx.font = 'bold 12px monospace';
      ctx.fillText('Najpierw przejdź poprzednią krainę', BASE_W / 2, 180);
    }
    drawPanel(14, 14, 126, 32, 'rgba(16,12,34,0.78)', 'rgba(255,215,90,0.4)', 8);
    drawStarShape(36, 30, 9, '#FFD94A', '#8A5A00');
    ctx.textAlign = 'left';
    ctx.fillStyle = '#FFE082';
    ctx.font = 'bold 15px monospace';
    ctx.fillText(`${totalStars()} / ${LEVELS.length * 3}`, 52, 36);
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '12px monospace';
    ctx.fillText(SHOW_TOUCH_UI ? 'Dotknij krainy, potem GRAJ' : '← → wybór · Enter graj · Esc menu', BASE_W / 2, 422);
    drawSceneButtons(overlayButtonsForScene());
    ctx.textAlign = 'left';
  }


  function createPlayer(x, y) {
    return {
      x,
      y,
      vx: 0,
      vy: 0,
      onGround: false,
      airJumps: 1,
      coyote: 0,
      facingLeft: false,
      walking: false,
      walkFrame: 0,
      walkTick: 0,
      invul: 0,
      blinkUntil: 0,
      nextBlink: 120 + Math.random() * 140,
      squash: 0,
      powerFrames: 0,
      rolling: false,
      standingPlatform: -1,
      fallStartY: y,
      stompChain: 0,
      jumpBuffer: 0
    };
  }

  function createEnemy(spawn, levelIndex) {
    const scale = spawn.boss ? 2 : 1;
    const hopper = spawn.kind === 'hopper';
    const baseSpeed = enemyBaseSpeed(spawn, levelIndex);
    const hp = spawn.boss ? 3 : 1;
    return {
      x: spawn.x,
      y: spawn.y,
      vx: baseSpeed,
      vy: 0,
      minX: spawn.minX,
      maxX: spawn.maxX,
      facingLeft: false,
      walkFrame: 0,
      walkTick: 0,
      boss: spawn.boss,
      kind: spawn.boss ? 'boss' : (spawn.kind || 'walker'),
      hp,
      maxHp: hp,
      hitPause: 0,
      pooped: false,
      poopTimer: 0,
      w: CAT_W * scale,
      h: CAT_H * scale,
      scale,
      standingPlatform: -1,
      ai: 'patrol',
      aiTimer: 150,
      chargeDir: 1,
      leapVx: 0,
      hopTimer: 50 + Math.floor(Math.random() * 60),
      airborne: false,
      wasGrounded: false,
      sleepState: 'asleep',
      stateTimer: 0,
      sitTimer: 0
    };
  }

  function createPickup(item) {
    return {
      x: item.x,
      y: item.y,
      kind: item.kind,
      taken: false,
      bobPhase: Math.random() * Math.PI * 2

  async function refreshLeaderboard() {
    if (game.leaderboardLoading) return;
    game.leaderboardLoading = true;
    game.leaderboardError = '';
    try {
      if (!EKIPA) { game.leaderboard = []; game.leaderboardLoaded = true; return; }
      const url = `${SUPABASE_URL}/rest/v1/scores?select=player_name,score,level_label,created_at&level_label=like.${encodeURIComponent(`[${EKIPA}] P3*`)}&order=score.desc,created_at.asc&limit=${LEADERBOARD_LIMIT}`;
      const response = await fetch(url, {
        method: 'GET',
        headers: leaderboardHeaders()
      });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      const rows = await response.json();
      game.leaderboard = Array.isArray(rows) ? rows : [];
      game.leaderboardLoaded = true;
    } catch (error) {
      game.leaderboardError = 'Ranking chwilowo nie odpowiada.';
    } finally {
      game.leaderboardLoading = false;
    }

    if (!game.runFromStart || !EKIPA) return;

    if (game.score < 0) return;
    game.submittedRunId = game.runId;
    game.scoreSyncText = 'Wysyłam wynik do rankingu…';
    updateMenuHint();
    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/scores`, {
        method: 'POST',
        headers: {
          ...leaderboardHeaders(),
          Prefer: 'return=minimal'
        },
        body: JSON.stringify([{
          player_name: game.playerName,
          score: game.score,
          level_label: EKIPA_TAG + 'P3 ' + (sceneLabel || (game.level ? game.level.label : ''))

      });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      game.scoreSyncText = 'Wynik zapisany w rankingu.';
      await refreshLeaderboard();
    } catch (error) {

  function requestFullscreenGame() {
    const target = document.documentElement;
    const request = target.requestFullscreen || target.webkitRequestFullscreen;
    if (!request || fullscreenElement()) return Promise.resolve(false);
    try {
      const result = request.call(target, { navigationUI: 'hide' });
      return Promise.resolve(result).catch(() => request.call(target)).then(() => true).catch(() => false);
    } catch (error) {
      try {
        const fallback = request.call(target);
        return Promise.resolve(fallback).then(() => true).catch(() => false);
      } catch (secondError) {
        return Promise.resolve(false);
      }
    }
  }

  function exitFullscreenGame() {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (!exit || !fullscreenElement()) return Promise.resolve(false);

  function hudButtons() {
    return {
      pause: { x: BASE_W - 76, y: 46, w: 32, h: 28 },

  function pointInRect(x, y, rect) {
    return x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h;
  }

  function controlRoleAt(x, y) {
    if (SHOW_TOUCH_UI) return null;
    const buttons = hudButtons();
    if (pointInRect(x, y, buttons.pause)) return 'pause';
    if (pointInRect(x, y, buttons.mute)) return 'mute';
    return null;
  }

  function pointerToCanvas(event) {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    return {
      x: (event.clientX - rect.left) * BASE_W / rect.width,
      y: (event.clientY - rect.top) * BASE_H / rect.height
    };
  }

  function onPointerDown(event) {
    const point = pointerToCanvas(event);
    if (!point) return;
    audio.resume();
    if (canvas.setPointerCapture) {
      try {
        canvas.setPointerCapture(event.pointerId);
      } catch (error) {
      }
    }
    if (game.scene === 'MENU') {
      return;
    }
    if (game.scene !== 'PLAYING') {
      const action = overlayActionAt(point.x, point.y);
      if (action) {
        runSceneAction(action);
      }
      return;
    }
    const role = controlRoleAt(point.x, point.y);
    if (role === 'pause') {
      input.pausePressed = true;
      return;
    }
    if (role === 'mute') {
      input.mutePressed = true;
      return;
    }
    if (!role) return;
    input.pointers.set(event.pointerId, role);
    if (role === 'jump') input.jumpPressed = true;
    if (role === 'shoot') input.shootPressed = true;
    input.syncHolds();
  }

  function onPointerMove(event) {
    if (!input.pointers.has(event.pointerId)) return;
    const point = pointerToCanvas(event);
    if (!point) return;
    const previousRole = input.pointers.get(event.pointerId);
    const nextRole = controlRoleAt(point.x, point.y);
    input.pointers.set(event.pointerId, nextRole);
    if (nextRole === 'jump' && previousRole !== 'jump') input.jumpPressed = true;
    if (nextRole === 'shoot' && previousRole !== 'shoot') input.shootPressed = true;
    input.syncHolds();
  }

  function onPointerUp(event) {
    if (!input.pointers.has(event.pointerId)) return;
    input.pointers.delete(event.pointerId);
    input.syncHolds();
  }

  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);

  canvas.addEventListener('mousemove', (event) => {

        ? !!controlRoleAt(point.x, point.y)

      }

    input.pointers.set(key, role);

    button.classList.add('active');
    button.dataset.pointerKey = key;

  function releaseMobileHold(event, button) {

    input.pointers.delete(key);
    input.syncHolds();
    button.classList.remove('active');
    delete button.dataset.pointerKey;
  }

  function bindMobileHold(button, role) {
    button.addEventListener('pointerdown', (event) => pressMobileHold(role, event, button));
    button.addEventListener('pointerup', (event) => releaseMobileHold(event, button));

  document.addEventListener('keydown', (event) => {
    if (game.scene === 'MENU' && document.activeElement === nameInput && event.code !== 'Enter' && event.code !== 'Escape') {
      return;
    }
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Backspace'].includes(event.code)) {
      event.preventDefault();
    }
    if (event.code === 'KeyM') {
      input.mutePressed = true;
      return;
    }
    if (event.code === 'Escape') {
      input.pausePressed = true;
      return;
    }
    if (event.code === 'Enter') {
      input.confirmPressed = true;
      return;
    }
    if (!event.repeat && event.code === 'KeyR') {
      input.retryPressed = true;
      return;
    }
    if (!event.repeat && (event.code === 'KeyQ' || event.code === 'Backspace')) {
      input.menuPressed = true;
      return;
    }
    if (['Space', 'ArrowUp', 'KeyW'].includes(event.code)) {
      if (!event.repeat) input.jumpPressed = true;
      input.keys[event.code] = true;
      input.syncHolds();
      return;
    }
    if (['ArrowLeft', 'KeyA', 'ArrowRight', 'KeyD'].includes(event.code)) {
      if (!event.repeat) {
        if (event.code === 'ArrowLeft' || event.code === 'KeyA') input.leftPressed = true;
        else input.rightPressed = true;
      }
      input.keys[event.code] = true;
      input.syncHolds();
      return;
    }
    if (['ArrowDown', 'KeyS'].includes(event.code)) {
      input.keys[event.code] = true;
      input.syncHolds();
      return;
    }
    if (!event.repeat && ['KeyX', 'ShiftLeft', 'ShiftRight'].includes(event.code)) {
      input.shootPressed = true;
    }
    if (['KeyX', 'ShiftLeft', 'ShiftRight'].includes(event.code)) {
      input.keys[event.code] = true;
      input.syncHolds();
    }
  });

  const TOUCH_LABELS = {

    land: { mobileLeftBtn: '◀', mobileRightBtn: '▶', mobileShootBtn: 'BOBEK', mobileDownBtn: '▼<br>TUP', mobileJumpBtn: '▲<br>SKOK' }
  };
  let touchLandscapeMode = null;
  function fitCanvas() {
    const landscapeTouch = SHOW_TOUCH_UI && window.innerWidth > window.innerHeight;
    if (landscapeTouch !== touchLandscapeMode) {
      touchLandscapeMode = landscapeTouch;
      document.body.classList.toggle('touchLandscape', landscapeTouch);
      const labels = landscapeTouch ? TOUCH_LABELS.land : TOUCH_LABELS.normal;
      for (const id in labels) { const el = document.getElementById(id); if (el) el.innerHTML = (id === 'mobileShootBtn' && HERO === 'C') ? 'ZRYW' : labels[id]; }
    }
    const margin = landscapeTouch ? 2 : 12;
    const touchExtra = SHOW_TOUCH_UI && !landscapeTouch ? MOBILE_UI_H : 0;
    const scale = Math.min(
      landscapeTouch ? 4 : 2.25,
      (window.innerWidth - margin * 2) / BASE_W,
      (window.innerHeight - margin * 2) / (BASE_H + touchExtra)
    );
    const finalScale = Math.max(0.42, scale);
    game.orientationRecommended = SHOW_TOUCH_UI && window.innerHeight > window.innerWidth && window.innerWidth < 720;
    game.compactHud = SHOW_TOUCH_UI || window.innerWidth < 960;
    const width = Math.floor(BASE_W * finalScale);
    const height = Math.floor(BASE_H * finalScale);
    gameSurface.style.width = `${width}px`;
    gameSurface.style.height = `${height}px`;
    shell.style.width = `${width}px`;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const renderScale = Math.min(4, Math.max(1, finalScale * dpr));
    const backingW = Math.round(BASE_W * renderScale);
    const backingH = Math.round(BASE_H * renderScale);
    if (canvas.width !== backingW || canvas.height !== backingH) {
      canvas.width = backingW;
      canvas.height = backingH;
      spriteCache.clear();
    }
    game.renderScale = backingW / BASE_W;
    const menuScale = clamp(finalScale, SHOW_TOUCH_UI ? 0.7 : 0.8, 1.7);
    menuPanel.style.transform = `translateX(-50%) scale(${menuScale.toFixed(3)})`;
    shell.style.setProperty('--touch-main-h', `${Math.max(34, Math.round(66 * finalScale))}px`);
    shell.style.setProperty('--touch-util-h', `${Math.max(24, Math.round(32 * finalScale))}px`);
    shell.style.setProperty('--touch-gap', `${Math.max(6, Math.round(10 * finalScale))}px`);
    shell.style.setProperty('--touch-pad', `${Math.max(6, Math.round(10 * finalScale))}px`);
    shell.style.setProperty('--touch-font', `${Math.max(12, Math.round(16 * finalScale))}px`);
    shell.style.setProperty('--touch-small-font', `${Math.max(10, Math.round(12 * finalScale))}px`);
    updateMenuHint();
    updateFullscreenUi();
  }
