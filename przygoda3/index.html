<style>
* { box-sizing:border-box; margin:0; padding:0; }
html, body {
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(255, 190, 120, 0.16), transparent 55%),
    radial-gradient(circle at 15% 90%, rgba(90, 170, 110, 0.18), transparent 45%),
    linear-gradient(180deg, #0b1430 0%, #15284a 55%, #10261c 100%);
}
body {
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Fredoka", "Trebuchet MS", sans-serif;
  color:#fff;
  touch-action:none;
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
}
#shell {
  position:relative;
  width:800px;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:8px;
  --touch-main-h:54px;
  --touch-util-h:28px;
  --touch-gap:8px;
  --touch-pad:8px;
  --touch-font:14px;
  --touch-small-font:11px;
}
#gameSurface {
  position:relative;
  width:800px;
  height:480px;
}
canvas {
  display:block;
  width:100%;
  height:100%;
  border-radius:18px;
  border:2px solid rgba(255,255,255,0.18);
  box-shadow:0 0 0 6px rgba(0,0,0,0.18), 0 28px 70px rgba(0,0,0,0.45);
  background:#10233b;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  touch-action:none;
  -webkit-tap-highlight-color:transparent;
}
#menuUi {
  position:absolute;
  inset:0;
  pointer-events:none;
}
#menuPanel {
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  transform-origin:50% 100%;
  width:292px;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:12px 14px 10px;
  border-radius:16px;
  border:2px solid rgba(255,255,255,0.16);
  background:linear-gradient(180deg, rgba(7,12,22,0.86) 0%, rgba(9,20,27,0.90) 100%);
  box-shadow:0 16px 28px rgba(0,0,0,0.28);
  pointer-events:auto;
}
#menuPanel label {
  display:none;
}
#menuActionRow {
  display:flex;
  gap:10px;
}
#nameInput,
#startBtn,
#menuFullscreenBtn {
  width:100%;
  border-radius:12px;
  outline:none;
  letter-spacing:1px;
}
#nameInput,
#startBtn {
  border:2px solid rgba(255,215,90,0.72);
  font:700 18px "Fredoka", "Trebuchet MS", sans-serif;
}
#nameInput {
  height:46px;
  text-align:center;
  background:rgba(6, 10, 20, 0.78);
  color:#fff6d3;
}
#nameInput::placeholder { color:#b9a77f; }
#startBtn {
  height:48px;
  background:linear-gradient(180deg, #7be36c 0%, #43a43c 100%);
  color:#11220d;
  cursor:pointer;
  box-shadow:0 10px 20px rgba(0,0,0,0.24);
}
#startBtn:disabled {
  cursor:not-allowed;
  filter:saturate(0.55) brightness(0.84);
  box-shadow:none;
}
#menuFullscreenBtn {
  flex:0.95;
  height:48px;
  border:2px solid rgba(180,220,255,0.55);
  background:linear-gradient(180deg, rgba(36,70,98,0.96) 0%, rgba(18,38,58,0.96) 100%);
  color:#e7f5ff;
  font:700 15px "Fredoka", "Trebuchet MS", sans-serif;
  letter-spacing:1px;
  cursor:pointer;
}
#startBtn {
  flex:1.35;
  font-family:"Press Start 2P", "Courier New", monospace;
  font-size:14px;
  line-height:1.4;
  white-space:nowrap;
}
#startBtn:active {
  transform:translateY(1px);
}
#menuFullscreenBtn:active {
  transform:translateY(1px);
}
#menuHint {
  display:block;
  min-height:28px;
  text-align:center;
  color:#d7f6ff;
  font:700 12px "Fredoka", "Trebuchet MS", sans-serif;
  line-height:1.25;
  letter-spacing:0.5px;
  text-shadow:0 1px 0 rgba(0,0,0,0.4);
}
#mobileControls {
  display:none;
  width:100%;
  padding:var(--touch-pad);
  padding-bottom:calc(var(--touch-pad) + env(safe-area-inset-bottom));
  border-radius:18px;
  border:2px solid rgba(255,255,255,0.12);
  background:rgba(5,10,18,0.82);
  box-shadow:0 14px 36px rgba(0,0,0,0.28);
  gap:var(--touch-gap);
}
#mobileControls:not(.hidden) {
  display:flex;
  flex-direction:column;
}
#mobileUtilityRow,
#mobilePadRow {
  display:grid;
  gap:var(--touch-gap);
}
#mobileUtilityRow {
  grid-template-columns:1fr 1.35fr 1fr;
}
#mobilePadRow {
  grid-template-columns:1fr 1fr 0.9fr 0.9fr 1.18fr;
}
.mobileBtn {
  border:none;
  border-radius:14px;
  color:#f2f7ff;
  font:700 var(--touch-font) "Fredoka", "Trebuchet MS", sans-serif;
  letter-spacing:0.6px;
  touch-action:none;
  -webkit-tap-highlight-color:transparent;
}
.mobileBtn.main {
  height:var(--touch-main-h);
  background:rgba(255,255,255,0.12);
  border:2px solid rgba(255,255,255,0.18);
}
.mobileBtn.util {
  height:var(--touch-util-h);
  font-size:var(--touch-small-font);
  background:rgba(255,255,255,0.10);
  border:2px solid rgba(255,255,255,0.16);
}
.mobileBtn.primary {
  background:rgba(255,215,90,0.20);
  border-color:rgba(255,215,90,0.42);
}
.mobileBtn.jump {
  background:rgba(112,203,98,0.22);
  border-color:rgba(112,203,98,0.46);
}
.mobileBtn.active {
  transform:translateY(1px);
  box-shadow:inset 0 0 0 999px rgba(255,255,255,0.08);
}
/* Telefon poziomo: plansza na całą wysokość, przyciski nałożone na rogi */
body.touchLandscape #shell { gap:0; }
body.touchLandscape #mobileControls {
  position:fixed; inset:0; display:block; width:auto; padding:0;
  background:none; border:none; box-shadow:none; border-radius:0; pointer-events:none;
  --b:clamp(54px, 19vh, 92px); --m:10px;
}
body.touchLandscape #mobileControls.hidden { display:none !important; }
body.touchLandscape #mobilePadRow, body.touchLandscape #mobileUtilityRow { display:block; }
body.touchLandscape .mobileBtn {
  position:absolute; pointer-events:auto; border-radius:50%;
  background:rgba(8,14,26,0.30); border:2px solid rgba(255,255,255,0.28);
  color:rgba(255,255,255,0.92); font-size:clamp(13px, 3.4vh, 18px); line-height:1.05;
  box-shadow:0 4px 14px rgba(0,0,0,0.25); backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
}
body.touchLandscape .mobileBtn.main { width:var(--b); height:var(--b); }
body.touchLandscape #mobileLeftBtn { left:calc(var(--m) + env(safe-area-inset-left)); bottom:calc(var(--m) + env(safe-area-inset-bottom)); font-size:clamp(20px, 6vh, 30px); }

  function lerp(a, b, t) {

  function overlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  function distance(ax, ay, bx, by) {
    const dx = ax - bx;
    const dy = ay - by;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function roundRectPath(x, y, w, h, r) {
    const radius = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }

  function pixelPanelPath(x, y, w, h, step, begin = true) {
    x = snap(x);
    y = snap(y);
    w = Math.max(4, snap(w));
    h = Math.max(4, snap(h));
    if (begin) ctx.beginPath();
    if (step >= 4 && w >= 12 && h >= 12) {
      ctx.moveTo(x + 4, y);
      ctx.lineTo(x + w - 4, y);
      ctx.lineTo(x + w - 4, y + 2);
      ctx.lineTo(x + w - 2, y + 2);
      ctx.lineTo(x + w - 2, y + 4);
      ctx.lineTo(x + w, y + 4);
      ctx.lineTo(x + w, y + h - 4);
      ctx.lineTo(x + w - 2, y + h - 4);
      ctx.lineTo(x + w - 2, y + h - 2);
      ctx.lineTo(x + w - 4, y + h - 2);
      ctx.lineTo(x + w - 4, y + h);
      ctx.lineTo(x + 4, y + h);
      ctx.lineTo(x + 4, y + h - 2);
      ctx.lineTo(x + 2, y + h - 2);
      ctx.lineTo(x + 2, y + h - 4);
      ctx.lineTo(x, y + h - 4);
      ctx.lineTo(x, y + 4);
      ctx.lineTo(x + 2, y + 4);
      ctx.lineTo(x + 2, y + 2);
      ctx.lineTo(x + 4, y + 2);
    } else {
      ctx.moveTo(x + 2, y);
      ctx.lineTo(x + w - 2, y);
      ctx.lineTo(x + w - 2, y + 2);
      ctx.lineTo(x + w, y + 2);
      ctx.lineTo(x + w, y + h - 2);
      ctx.lineTo(x + w - 2, y + h - 2);
      ctx.lineTo(x + w - 2, y + h);
      ctx.lineTo(x + 2, y + h);
      ctx.lineTo(x + 2, y + h - 2);
      ctx.lineTo(x, y + h - 2);
      ctx.lineTo(x, y + 2);
      ctx.lineTo(x + 2, y + 2);
    }
    ctx.closePath();
  }

  function drawPanel(x, y, w, h, fill = 'rgba(0,0,0,0.48)', stroke = 'rgba(255,255,255,0.14)', radius = 8) {
    if (h < 8 || w < 8) {
      if (fill) {
        ctx.fillStyle = fill;
        ctx.fillRect(snap(x), snap(y), Math.max(2, snap(w)), Math.max(2, snap(h)));
      }
      return;
    }
    const step = radius >= 6 && h >= 16 ? 4 : 2;
    if (stroke) {
      ctx.beginPath();
      pixelPanelPath(x - 2, y - 2, w + 4, h + 4, step, false);
      pixelPanelPath(x, y, w, h, step, false);
      ctx.fillStyle = 'rgba(16,10,32,0.92)';
      ctx.fill('evenodd');
    }
    pixelPanelPath(x, y, w, h, step);
    if (fill) {
      ctx.fillStyle = fill;
      ctx.fill();
    }
    if (stroke) {
      const sx = snap(x);
      const sy = snap(y);
      const sw = snap(w);
      const sh = snap(h);
      ctx.fillStyle = stroke;
      ctx.fillRect(sx + step, sy, sw - step * 2, 2);
      ctx.fillRect(sx, sy + step, 2, sh - step * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.fillRect(sx + step, sy + sh - 2, sw - step * 2, 2);
      ctx.fillRect(sx + sw - 2, sy + step, 2, sh - step * 2);
    }
  }

  function hash01(n) {
    const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return s - Math.floor(s);
  }

  function fillCircle(x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, Math.max(0.5, r), 0, Math.PI * 2);
    ctx.fill();
  }

  function formatTime(seconds) {
    const total = Math.max(0, Math.floor(seconds));
    const minutes = Math.floor(total / 60);
    const rest = total % 60;
    return `${minutes}:${rest < 10 ? '0' : ''}${rest}`;
  }

  function drawOutlinedText(text, x, y, font, fill, outline, width = 4) {
    const match = String(font).match(/(\d+(?:\.\d+)?)px/);
    const size = match ? Number(match[1]) : 16;
    if (size >= 26) {
      const scale = size >= 40 ? 4 : (String(text).length > 17 ? 2 : 3);
      drawPixelText(text, x, y, 8, fill, outline, scale, ctx.textAlign === 'center' ? 'center' : 'left');
      return;
    }
    ctx.font = font;
    ctx.lineJoin = 'round';
    ctx.lineWidth = width;
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.strokeText(text, x, y + 3);
    ctx.strokeStyle = outline;
    ctx.strokeText(text, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(text, x, y);
  }

  function drawStarShape(cx, cy, r, fill, stroke) {
    ctx.beginPath();
    for (let index = 0; index < 10; index += 1) {
      const angle = -Math.PI / 2 + index * Math.PI / 5;
      const radius = index % 2 === 0 ? r : r * 0.46;
      ctx.lineTo(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
    }
    ctx.closePath();
    if (fill) {
      ctx.fillStyle = fill;
      ctx.fill();
    }
    if (stroke) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = Math.max(1.5, r * 0.12);
      ctx.lineJoin = 'round';
      ctx.stroke();
    }
  }

  function safeLoadJson(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return fallback;
      const value = JSON.parse(raw);
      return value && typeof value === 'object' ? value : fallback;
    } catch (error) {
      return fallback;
    }
  }

  function midiFreq(note) {
    return 440 * Math.pow(2, (note - 69) / 12);
  }

  const SONGS = {
    a: {
      step: 8,
      lead: [72, 0, 76, 0, 79, 0, 76, 0, 74, 0, 77, 0, 81, 0, 77, 0, 72, 0, 76, 79, 84, 0, 79, 0, 77, 76, 74, 0, 72, 0, 0, 0],
      bass: [48, 0, 0, 0, 55, 0, 0, 0, 50, 0, 0, 0, 57, 0, 0, 0, 53, 0, 0, 0, 48, 0, 0, 0, 55, 0, 0, 0, 43, 0, 0, 0]

      bass: [41, 0, 0, 0, 48, 0, 0, 0, 45, 0, 0, 0, 52, 0, 0, 0, 43, 0, 0, 0, 50, 0, 0, 0, 48, 0, 0, 0, 36, 0, 0, 0]

      bass: [45, 0, 45, 0, 45, 0, 45, 0, 43, 0, 43, 0, 43, 0, 43, 0, 41, 0, 41, 0, 41, 0, 41, 0, 40, 0, 40, 0, 44, 0, 44, 0]

  SONGS.a.drums = 'k...h...s...h...k.k.h...s...h.h.';

  SONGS.c = {

  };
  const SONG_FOR = [['a', 2], ['b', 0], ['c', -2], ['b', 7], ['boss', 0]];

  const MUSIC_LEVEL = 0.26;
  const audio = {
    enabled: safeLoadBool(STORAGE.music, true), // muzyka wł./wył.; efekty grają zawsze
    ctx: null,
    musicIndex: 0,
    musicFrames: 0,
    last: Object.create(null),
    tune: [262, 330, 392, 330, 262, 330, 392, 494, 523, 494, 392, 330, 262, 262],
    ensure() {
      if (this.ctx) return this.ctx;
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return null;
      try {
        this.ctx = new AudioCtor();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.8;
        const compressor = this.ctx.createDynamicsCompressor();
        this.master.connect(compressor);
        compressor.connect(this.ctx.destination);
        this.musicBus = this.ctx.createGain();
        this.musicBus.gain.value = this.enabled ? MUSIC_LEVEL : 0;
        this.musicBus.connect(this.master);
        this.sfxBus = this.ctx.createGain();
        this.sfxBus.gain.value = 1;
        this.sfxBus.connect(this.master);
      } catch (error) {
        this.ctx = null;
        this.master = null;
      }
      return this.ctx;
    },
    resume() {
      const context = this.ensure();
      if (!context) return;
      if (context.state === 'suspended') {
        context.resume().catch(() => {});
      }
    },
    out(bus) {
      if (bus === 'music') return this.musicBus || this.master;
      return this.sfxBus || this.master;
    },
    tone(freq, dur, type = 'square', vol = 0.14, slide = 0, startOffset = 0, bus = 'sfx') {
      if (bus === 'music' && !this.enabled) return;
      const context = this.ensure();
      if (!context) return;
      const osc = context.createOscillator();
      const gain = context.createGain();
      const now = context.currentTime + startOffset;
      osc.type = type;
      osc.connect(gain);
      gain.connect(this.out(bus) || context.destination);
      osc.frequency.setValueAtTime(freq, now);
      if (slide) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(24, slide), now + dur);
      }
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), now + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    },
    noise(dur, vol, type = 'bandpass', f0 = 1000, f1 = 0, startOffset = 0, q = 1, bus = 'sfx') {
      if (bus === 'music' && !this.enabled) return;
      const context = this.ensure();
      if (!context) return;
      if (!this.noiseBuf) {
        const length = Math.floor(context.sampleRate * 1.0);
        this.noiseBuf = context.createBuffer(1, length, context.sampleRate);
        const data = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < length; i += 1) data[i] = Math.random() * 2 - 1;
      }
      const now = context.currentTime + startOffset;
      const src = context.createBufferSource();
      src.buffer = this.noiseBuf;
      const filter = context.createBiquadFilter();
      filter.type = type;
      filter.Q.value = q;
      filter.frequency.setValueAtTime(f0, now);
      if (f1) filter.frequency.exponentialRampToValueAtTime(Math.max(30, f1), now + dur);
      const gain = context.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), now + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(this.out(bus) || context.destination);
      src.start(now, Math.random() * 0.4);
      src.stop(now + dur + 0.02);
    },
    // ściszenie muzyki na chwilę, żeby efekt był wyraźny
    duck(depth = 0.45, hold = 0.22) {
      if (!this.musicBus || !this.enabled) return;
      const now = this.ctx.currentTime;
      const g = this.musicBus.gain;
      g.cancelScheduledValues(now);
      g.setValueAtTime(Math.max(0.0001, g.value), now);
      g.linearRampToValueAtTime(MUSIC_LEVEL * depth, now + 0.03);
      g.setTargetAtTime(MUSIC_LEVEL, now + hold, 0.18);
    },
    cue(name, opt = {}) {
      this.resume();
      if (!this.ctx) return;

    drum(kind) {
      const context = this.ensure();
      if (!context || !this.enabled) return;
      if (kind === 'k') {
        this.tone(150, 0.16, 'sine', 0.30, 42, 0, 'music');
        return;
      }
      if (kind === 'h') this.noise(0.04, 0.045, 'highpass', 7000, 0, 0, 0.7, 'music');
      else this.noise(0.13, 0.11, 'bandpass', 1800, 0, 0, 1, 'music');
    },
    resetMusic() {
      this.musicIndex = 0;
      this.musicFrames = 0;
    },
    updateMusic(scene) {
      if (!this.enabled || (scene !== 'PLAYING' && scene !== 'MAP')) return;
      if (!this.ensure()) return;
      const pick = scene === 'MAP' ? ['a', 5] : (SONG_FOR[game.levelIndex] || ['a', 0]);
      const song = SONGS[pick[0]];
      const transpose = pick[1];
      let step = song.step;
      if (pick[0] === 'boss') {
        const boss = game.enemies.find((enemy) => enemy.boss);
        if (boss) step = Math.max(4, step - (boss.maxHp - boss.hp));
      }
      this.musicFrames -= 1;
      if (this.musicFrames > 0) return;
      this.musicFrames = step;
      const index = this.musicIndex % song.lead.length;
      const lead = song.lead[index];
      const bass = song.bass[index];
      if (lead) {
        this.tone(midiFreq(lead + transpose), step / 60 * 0.95, 'square', 0.05, 0, 0, 'music');
        this.tone(midiFreq(lead + 12 + transpose), step / 60 * 0.5, 'sine', 0.024, 0, 0, 'music');
      }
      if (bass) this.tone(midiFreq(bass + transpose), step / 60 * 1.9, 'triangle', 0.15, 0, 0, 'music');
      if (song.drums) {
        const beat = song.drums[index % song.drums.length];
        if (beat !== '.') this.drum(beat);
      }
      this.musicIndex += 1;
    },
    toggle() {
      this.enabled = !this.enabled;
      safeSave(STORAGE.music, this.enabled ? '1' : '0');
      this.resume();
      if (this.musicBus) {
        const now = this.ctx.currentTime;
        this.musicBus.gain.cancelScheduledValues(now);
        this.musicBus.gain.setTargetAtTime(this.enabled ? MUSIC_LEVEL : 0, now, 0.05);
      }
      this.cue('collect');
      updateFullscreenUi();
    }
  };

  function spriteKeyId(sprite) {
    let id = spriteIds.get(sprite);
    if (!id) {
      spriteIdSeq += 1;
      id = spriteIdSeq;
      spriteIds.set(sprite, id);
    }
    return id;
  }

  function buildSpriteCanvas(sprite, scale, flipX, outline, rs) {
    const cols = sprite[0].length;
    const rows = sprite.length;
    const pad = outline ? OUTLINE_W : 0;
    const lw = cols * scale + pad * 2;
    const lh = rows * scale + pad * 2;
    const surface = document.createElement('canvas');
    surface.width = Math.max(1, Math.ceil(lw * rs));
    surface.height = Math.max(1, Math.ceil(lh * rs));
    const g = surface.getContext('2d');
    const paint = (ox, oy, override) => {
      for (let row = 0; row < rows; row += 1) {
        const line = sprite[row];
        for (let col = 0; col < line.length; col += 1) {
          const fill = line[col];
          if (!fill) continue;
          const lx = pad + ox + (flipX ? (cols - 1 - col) : col) * scale;
          const ly = pad + oy + row * scale;
          const x0 = Math.round(lx * rs);
          const y0 = Math.round(ly * rs);
          g.fillStyle = override || fill;
          g.fillRect(x0, y0, Math.round((lx + scale) * rs) - x0, Math.round((ly + scale) * rs) - y0);
        }
      }
    };
    if (outline) {
      paint(-pad, 0, outline);
      paint(pad, 0, outline);
      paint(0, -pad, outline);
      paint(0, pad, outline);
    }
    paint(0, 0, null);
    return { canvas: surface, w: lw, h: lh, pad };
  }

  function drawSprite(sprite, x, y, scale = PIXEL, flipX = false, outline = null) {
    const legacy = LEGACY_ART.get(sprite);
    if (legacy) {
      drawArtFootprint(legacy, x, y, sprite[0].length * scale, sprite.length * scale, flipX);
      return;
    }
    const rs = game.renderScale || 1;
    const key = `${spriteKeyId(sprite)}|${scale}|${flipX ? 1 : 0}|${outline || ''}|${rs}`;
    let entry = spriteCache.get(key);
    if (!entry) {
      if (spriteCache.size > 700) spriteCache.clear();
      entry = buildSpriteCanvas(sprite, scale, flipX, outline, rs);
      spriteCache.set(key, entry);
    }
    ctx.drawImage(entry.canvas, x - entry.pad, y - entry.pad, entry.w, entry.h);
  }

    for (let index = 0; index < ground.length - 1; index += 1) {
      const a = ground[index];
      const b = ground[index + 1];
      const gapStart = a.x + a.w;
      const gap = b.x - gapStart;
      if (gap < 40) continue;
      for (const t of [0.12, 0.5, 0.88]) {
        const px = Math.round(gapStart + gap * t - 12);
        const py = Math.round(BASE_H - TILE - 33 - Math.sin(t * Math.PI) * 58);

      }
    }
    return extra;

  const ART = 2;
  const BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

  function bayer(x, y) {

  function snap(value) {

    const c = (v) => clamp(Math.round(v), 0, 255);
    return '#' + ((1 << 24) | (c(r) << 16) | (c(g) << 8) | c(b)).toString(16).slice(1);
  }

  function mixHex(a, b, t) {
    const A = hexRgb(a);
    const B = hexRgb(b);
    return rgbHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
  }

  // hue-shifted ramp: shadows drift to cool violet, lights to warm cream
  function ramp(base, strength = 1) {
    return [
      mixHex(base, '#2A1B4A', 0.5 * strength),
      mixHex(base, '#3B2A5E', 0.26 * strength),
      base,
      mixHex(base, '#FFF7DE', 0.42 * strength)
    ];
  }

  function makeMat(base, outline, options = {}) {
    const tones = options.flat ? [base, base, base, base] : (options.tones || ramp(base, options.strength || 1));
    return {
      tones: tones.map(hexRgb),
      outline: outline ? hexRgb(outline) : null
    };
  }

  function periodicNoise(x, period, seed = 0) {
    const xi = Math.floor(x);
    const f = x - xi;
    const a = hash01(((xi % period) + period) % period + seed * 101.3);
    const b = hash01((((xi + 1) % period) + period) % period + seed * 101.3);
    const t = f * f * (3 - 2 * f);
    return a + (b - a) * t;
  }

  function noise2(x, y, seed = 0) {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    const fx = x - xi;
    const fy = y - yi;
    const h = (i, j) => hash01(i * 57.1 + j * 131.7 + seed * 17.9);
    const sx = fx * fx * (3 - 2 * fx);
    const sy = fy * fy * (3 - 2 * fy);
    const top = h(xi, yi) + (h(xi + 1, yi) - h(xi, yi)) * sx;
    const bottom = h(xi, yi + 1) + (h(xi + 1, yi + 1) - h(xi, yi + 1)) * sx;
    return top + (bottom - top) * sy;
  }

  function lightTone(nx, ny, r2) {
    const nz = Math.sqrt(Math.max(0, 1 - Math.min(1, r2)));
    const dot = -nx * 0.5 - ny * 0.72 + nz * 0.48;
    if (dot > 0.66) return 3;
    if (dot > 0.22) return 2;
    if (dot > -0.12) return 1;
    return 0;
  }

  class PixelGrid {
    constructor(w, h) {
      this.w = w;
      this.h = h;
      this.mat = new Int16Array(w * h).fill(-1);
      this.tone = new Int8Array(w * h);
    }

    put(x, y, m, t = 2) {
      x = Math.floor(x);
      y = Math.floor(y);
      if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
      const i = y * this.w + x;
      this.mat[i] = m;
      this.tone[i] = t;
    }

    at(x, y) {
      if (x < 0 || y < 0 || x >= this.w || y >= this.h) return -1;
      return this.mat[y * this.w + x];
    }

    ellipse(cx, cy, rx, ry, m, toneShift = 0, flat = false) {
      if (rx <= 0 || ry <= 0) return;
      for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y += 1) {
        for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx + 1); x += 1) {
          const dx = (x + 0.5 - cx) / rx;
          const dy = (y + 0.5 - cy) / ry;
          const r2 = dx * dx + dy * dy;
          if (r2 > 1) continue;
          const tone = flat ? 2 : clamp(lightTone(dx, dy, r2) + toneShift, 0, 3);
          this.put(x, y, m, tone);
        }
      }
    }

    capsule(x0, y0, x1, y1, r0, r1, m, toneShift = 0, flat = false) {
      const minX = Math.floor(Math.min(x0, x1) - Math.max(r0, r1) - 1);
      const maxX = Math.ceil(Math.max(x0, x1) + Math.max(r0, r1) + 1);
      const minY = Math.floor(Math.min(y0, y1) - Math.max(r0, r1) - 1);
      const maxY = Math.ceil(Math.max(y0, y1) + Math.max(r0, r1) + 1);
      const vx = x1 - x0;
      const vy = y1 - y0;
      const len2 = vx * vx + vy * vy || 1;
      for (let y = minY; y <= maxY; y += 1) {
        for (let x = minX; x <= maxX; x += 1) {
          const px = x + 0.5;
          const py = y + 0.5;
          const t = clamp(((px - x0) * vx + (py - y0) * vy) / len2, 0, 1);
          const cx = x0 + vx * t;
          const cy = y0 + vy * t;
          const r = r0 + (r1 - r0) * t;
          const dx = (px - cx) / r;
          const dy = (py - cy) / r;
          const r2 = dx * dx + dy * dy;
          if (r2 > 1) continue;
          this.put(x, y, m, flat ? 2 : clamp(lightTone(dx, dy, r2) + toneShift, 0, 3));
        }
      }
    }

    tri(ax, ay, bx, by, cx, cy, m, tone = 2) {
      const minX = Math.floor(Math.min(ax, bx, cx));
      const maxX = Math.ceil(Math.max(ax, bx, cx));
      const minY = Math.floor(Math.min(ay, by, cy));
      const maxY = Math.ceil(Math.max(ay, by, cy));
      const area = (bx - ax) * (cy - ay) - (cx - ax) * (by - ay);
      if (!area) return;
      for (let y = minY; y <= maxY; y += 1) {
        for (let x = minX; x <= maxX; x += 1) {
          const px = x + 0.5;
          const py = y + 0.5;
          const w0 = ((bx - px) * (cy - py) - (cx - px) * (by - py)) / area;
          const w1 = ((cx - px) * (ay - py) - (ax - px) * (cy - py)) / area;
          const w2 = 1 - w0 - w1;
          if (w0 >= 0 && w1 >= 0 && w2 >= 0) this.put(x, y, m, typeof tone === 'function' ? tone(w0, w1, w2, x, y) : tone);
        }
      }
    }

    rect(x, y, w, h, m, tone = 2) {
      for (let yy = Math.floor(y); yy < Math.floor(y + h); yy += 1) {
        for (let xx = Math.floor(x); xx < Math.floor(x + w); xx += 1) this.put(xx, yy, m, tone);
      }
    }

    // darken tone of existing pixels of material m where predicate holds
    pattern(m, predicate, delta = -1) {
      for (let y = 0; y < this.h; y += 1) {
        for (let x = 0; x < this.w; x += 1) {
          const i = y * this.w + x;
          if (this.mat[i] === m && predicate(x, y)) this.tone[i] = clamp(this.tone[i] + delta, 0, 3);
        }
      }
    }

    render(mats, outline = true) {
      const surface = newCanvas(this.w, this.h);
      const g = surface.getContext('2d');
      const image = g.createImageData(this.w, this.h);
      const data = image.data;
      for (let y = 0; y < this.h; y += 1) {
        for (let x = 0; x < this.w; x += 1) {
          const i = y * this.w + x;
          const m = this.mat[i];
          const o = i * 4;
          if (m >= 0) {
            const color = mats[m].tones[this.tone[i]];
            data[o] = color[0];
            data[o + 1] = color[1];
            data[o + 2] = color[2];
            data[o + 3] = 255;
          } else if (outline) {
            const n = [this.at(x - 1, y), this.at(x + 1, y), this.at(x, y - 1), this.at(x, y + 1)];
            let pick = -1;
            for (const k of n) {
              if (k >= 0 && mats[k].outline) {
                pick = k;
                break;
              }
            }
            if (pick >= 0) {
              const color = mats[pick].outline;
              data[o] = color[0];
              data[o + 1] = color[1];
              data[o + 2] = color[2];
              data[o + 3] = 255;
            }
          }
        }
      }
      g.putImageData(image, 0, 0);
      return surface;
    }
  }

  // ---------------- materials ----------------
  const RABBIT_OUT = '#3E3263';
  const RABBIT_MATS = [
    makeMat('#F2EEF9', RABBIT_OUT, { tones: ['#A69ACB', '#CEC6E6', '#F2EEF9', '#FFFFFF'] }), // 0 fur
    makeMat('#DCD5EE', RABBIT_OUT, { tones: ['#968AB9', '#B8AED6', '#DCD5EE', '#F0ECF8'] }), // 1 far-side fur
    makeMat('#F5B49C', RABBIT_OUT, { tones: ['#D27E6C', '#E89A84', '#F5B49C', '#FFD6C4'] }), // 2 inner ear (peach)
    makeMat('#1A1726', null, { flat: true }), // 3 eye
    makeMat('#FFFFFF', null, { flat: true }), // 4 eye shine
    makeMat('#EBA0A8', null, { flat: true }), // 5 nose
    makeMat('#8EA4C8', null, { flat: true }), // 6 blue-grey iris
    makeMat('#FFFFFF', RABBIT_OUT, { tones: ['#B9AFD8', '#DAD3EE', '#FFFFFF', '#FFFFFF'] }) // 7 tail puff
  ];

  function catMats(kind) {
    const pal = kind === 'hopper'
      ? { fur: '#A2A4AE', out: '#23242E', chest: '#EEEEF2', eye: '#9CC86A', ear: '#D8C2C2', stripe: '#4A4C58' }
      : kind === 'boss'
        ? { fur: '#7F6748', out: '#1E140C', chest: '#E9DDC6', eye: '#C9B13E', ear: '#D2B09E', stripe: '#2E2216' }
        : { fur: '#8E7759', out: '#24180F', chest: '#ECE2CF', eye: '#B8B24A', ear: '#D9B8A8', stripe: '#33261A' };
    return [
      makeMat(pal.fur, pal.out), // 0 fur
      makeMat(mixHex(pal.fur, '#3B2A5E', 0.22), pal.out), // 1 far-side fur
      makeMat(pal.chest, pal.out, { strength: 0.7 }), // 2 chest/muzzle
      makeMat(pal.ear, pal.out, { flat: true }), // 3 inner ear
      makeMat(pal.eye, null, { flat: true }), // 4 eye
      makeMat('#14111C', null, { flat: true }), // 5 pupil
      makeMat('#C58A7C', null, { flat: true }), // 6 nose
      makeMat('#FFFFFF', null, { flat: true }), // 7 shine
      makeMat(pal.out, null, { flat: true }), // 8 brow / mouth
      makeMat(pal.stripe, pal.out, { tones: ramp(pal.stripe, 0.6) }) // 9 tabby stripe
    ];
  }

  // ---------------- rabbit ----------------
  const RABBIT_CANVAS = { w: 34, h: 36, ox: 5, oy: 12 };
  const rabbitCache = new Map();

  function rabbitPoseKey(pose) {
    return [pose.state, Math.round(pose.phase * 8) % 8, Math.round(pose.ear * 8), pose.blink ? 1 : 0,
      Math.round(pose.sx * 20), Math.round(pose.sy * 20), Math.round((pose.roll || 0) * 4) % 25].join('|');
  }

  function buildRabbit(pose) {
    const key = rabbitPoseKey(pose);
    const cached = rabbitCache.get(key);
    if (cached) return cached;
    const { w, h, ox, oy } = RABBIT_CANVAS;
    const g = new PixelGrid(w, h);
    const X = (v) => ox + v;
    const Y = (v) => oy + v;
    const state = pose.state;

    if (state === 'roll') {
      const angle = pose.roll || 0;
      const cx = 12;
      const cy = 15;
      g.ellipse(X(cx), Y(cy), 9, 9, 0);
      for (let k = 0; k < 2; k += 1) {
        const a = angle + k * 0.5;
        const ex = cx + Math.cos(a) * 8.2;
        const ey = cy + Math.sin(a) * 8.2;
        const tx = cx + Math.cos(a + 0.9) * 8.8;
        const ty = cy + Math.sin(a + 0.9) * 8.8;
        g.capsule(X(ex), Y(ey), X(tx), Y(ty), 1.7, 1.2, k ? 0 : 2, 0);
      }
      const ta = angle + Math.PI;
      g.ellipse(X(cx + Math.cos(ta) * 8), Y(cy + Math.sin(ta) * 8), 2.6, 2.6, 7);
      const fa = angle + 2.2;
      g.put(X(cx + Math.cos(fa) * 5), Y(cy + Math.sin(fa) * 5), 3);
      g.put(X(cx + Math.cos(fa + 0.5) * 5), Y(cy + Math.sin(fa + 0.5) * 5), 3);
      const surface = g.render(RABBIT_MATS);
      rabbitCache.set(key, surface);
      return surface;
    }

    const p = pose.phase * Math.PI * 2;
    let bob = 0;
    let hindX = 0;
    let hindLift = 0;
    let frontX = 0;
    let frontLift = 0;
    if (state === 'run') {
      bob = -Math.abs(Math.sin(p)) * 1.4;
      hindX = Math.cos(p) * 3;
      hindLift = Math.max(0, Math.sin(p)) * 1.6;
      frontX = -Math.cos(p) * 2.6;
      frontLift = Math.max(0, -Math.sin(p)) * 1.6;
    } else if (state === 'jump') {
      hindX = -2.5;
      hindLift = -0.5;
      frontX = 2;
      frontLift = 2;
    } else if (state === 'fall') {
      hindX = -1;
      hindLift = -1;
      frontX = 1.5;
      frontLift = -0.5;
    }
    const sx = pose.sx;
    const sy = pose.sy;
    const bodyRx = 8.4 * sx;
    const bodyRy = 6.6 * sy;
    const bodyCy = 22.6 - bodyRy + bob;
    const bodyCx = 11;
    const headR = 6.8 * (0.5 + sx * 0.5);
    const headCx = 15.2 + (sx - 1) * 3;
    const headCy = bodyCy - 5.6 * sy;
    const earA = pose.ear;

    // far-side ear (behind everything)
    const fe0x = 12.6;
    const fe0y = headCy - 4.8;
    g.capsule(X(fe0x), Y(fe0y), X(fe0x + Math.sin(earA - 0.4) * 6.4), Y(fe0y - Math.cos(earA - 0.4) * 6.4), 2.6, 2.9, 1);
    g.capsule(X(fe0x + Math.sin(earA - 0.4) * 2.4), Y(fe0y - Math.cos(earA - 0.4) * 2.4), X(fe0x + Math.sin(earA - 0.4) * 5), Y(fe0y - Math.cos(earA - 0.4) * 5), 1.2, 1.1, 2);
    // tail
    g.ellipse(X(bodyCx - bodyRx + 0.6), Y(bodyCy - 1.2), 2.8, 2.7, 7);
    // far legs
    g.ellipse(X(7.4 + hindX * 0.6), Y(23 - hindLift * 0.6), 3.2, 1.5, 1);
    g.ellipse(X(16.4 + frontX * 0.6), Y(23 - frontLift * 0.6), 2, 1.3, 1);
    // body
    g.ellipse(X(bodyCx), Y(bodyCy), bodyRx, bodyRy, 0);
    // near hind leg (haunch + foot)
    g.ellipse(X(8 + hindX * 0.3), Y(bodyCy + bodyRy * 0.35), 4.2 * sx, 3.6 * sy, 0, 0);
    g.ellipse(X(7.6 + hindX), Y(23.2 - hindLift), 3.9, 1.5, 0);
    // front paw
    g.ellipse(X(15.6 + frontX), Y(23.1 - frontLift), 2.3, 1.4, 0);
    // lionhead mane behind the head
    g.ellipse(X(headCx - 2.4), Y(headCy + 2.6), 4.4, 4.2, 0, 0);
    g.ellipse(X(headCx - 3.6), Y(headCy - 1.6), 3, 3.2, 0, 0);
    // head
    g.ellipse(X(headCx), Y(headCy), headR, headR * 0.96, 0);
    // fluffy cheeks / ruff
    g.ellipse(X(headCx + 1.4), Y(headCy + 2.8), 4.2, 2.8, 0, 1);
    g.ellipse(X(headCx - 1.2), Y(headCy + 4), 3.4, 2.4, 0, 0);
    // top tuft
    // near ear: short, broad, rounded, fluffy rim
    const e0x = 17;
    const e0y = headCy - 4.8;
    const ex = e0x + Math.sin(earA + 0.12) * 7.2;
    const ey = e0y - Math.cos(earA + 0.12) * 7.2;
    g.capsule(X(e0x), Y(e0y), X(ex), Y(ey), 2.8, 3.1, 0);
    g.capsule(X(e0x + (ex - e0x) * 0.3), Y(e0y + (ey - e0y) * 0.3), X(e0x + (ex - e0x) * 0.8), Y(e0y + (ey - e0y) * 0.8), 1.7, 1.6, 2);
    // face
    const eyeX = headCx + 2.2;
    const eyeY = headCy - 0.8;
    if (state === 'hurt') {
      g.put(X(eyeX - 0.5), Y(eyeY), 3);
      g.put(X(eyeX + 0.5), Y(eyeY + 1), 3);
      g.put(X(eyeX + 0.5), Y(eyeY - 1), 3);
    } else if (pose.blink) {
      g.put(X(eyeX - 0.5), Y(eyeY + 1), 3);
      g.put(X(eyeX + 0.5), Y(eyeY + 1), 3);
    } else {
      g.rect(X(eyeX - 0.5), Y(eyeY - 1), 2, 3, 3);
      g.put(X(eyeX + 0.5), Y(eyeY + 1), 6);
      g.put(X(eyeX - 0.5), Y(eyeY + 1), 6);
      g.put(X(eyeX - 0.5), Y(eyeY - 1), 4);
    }
    g.put(X(headCx + 5.4), Y(headCy + 1.2), 5);
    const surface = g.render(RABBIT_MATS);
    rabbitCache.set(key, surface);
    if (rabbitCache.size > 900) rabbitCache.clear();
    return surface;
  }

  // ---------------- cat (Persi) ----------------
  const CAT_CANVAS = { w: 34, h: 30, ox: 5, oy: 7 };
  const catCache = new Map();

  function buildCat(kind, frame, state) {
    const key = `${kind}|${frame}|${state}`;
    const cached = catCache.get(key);
    if (cached) return cached;
    const mats = catMats(kind);
    const { w, h, ox, oy } = CAT_CANVAS;
    const g = new PixelGrid(w, h);
    const X = (v) => ox + v;
    const Y = (v) => oy + v;
    const crouch = state === 'warn' ? 1.4 : 0;
    const air = state === 'air';
    const swing = air ? 0 : (frame ? 1.6 : -1.6);
    const tailSway = frame ? 1 : -0.5;

    // tail: slim, raised, striped
    const tailTip = frame ? 1 : 0;
    g.capsule(X(2.4), Y(13.4 + crouch), X(-0.8), Y(8.4), 1.7, 1.6, 1);
    g.capsule(X(-0.8), Y(8.4), X(0.4 + tailTip), Y(3.2), 1.6, 1.4, 1);
    g.pattern(1, (x, y) => y < Y(12) && (y % 3 === 0), -2);
    // far legs
    const legY = 21;
    const lift = air ? 1 : 0;
    g.capsule(X(6.5 - swing * 0.6), Y(16 + crouch), X(6.5 - swing), Y(legY - 0.8 + lift), 1.8, 1.6, 1);
    g.capsule(X(15.5 + swing * 0.6), Y(16 + crouch), X(15.5 + swing), Y(legY - 0.8 + lift), 1.8, 1.6, 1);
    // body (short hair, solid)
    g.ellipse(X(10.8), Y(14 + crouch), 9.2, 5.4 - crouch * 0.4, 0);
    // mackerel stripes over the back and flank
    g.pattern(0, (x, y) => y < Y(17 + crouch) && x < X(15) && ((x + Math.floor((y - Y(8)) * 0.35)) % 4 === 0), -2);
    g.ellipse(X(16.2), Y(16 + crouch), 3.4, 3.2, 2, -1);
    // near legs
    g.capsule(X(9.5 + swing * 0.6), Y(16.5 + crouch), X(9.5 + swing), Y(legY - 0.6 + lift * 1.2), 1.9, 1.7, 0);
    g.capsule(X(18.2 - swing * 0.6), Y(16.5 + crouch), X(18.2 - swing), Y(legY - 0.6 + lift * 1.2), 1.9, 1.7, 0);
    g.pattern(0, (x, y) => y > Y(17 + crouch) && y < Y(20) && (y % 2 === 0), -1);
    g.ellipse(X(9.5 + swing), Y(legY - 0.4 + lift * 1.2), 1.9, 1.1, 2);
    g.ellipse(X(18.2 - swing), Y(legY - 0.4 + lift * 1.2), 1.9, 1.1, 2);
    // head: big, round, full tomcat cheeks
    const hx = 18.4;
    const hy = 7.8 + crouch * 1.2;
    const earDrop = state === 'warn' ? 1.6 : 0;
    g.tri(X(12.2), Y(hy - 2.4 + earDrop * 0.5), X(13.6 - earDrop), Y(hy - 9 + earDrop), X(17.2), Y(hy - 4.4), 0, 2);
    g.tri(X(19.6), Y(hy - 4.6), X(23.4 + earDrop), Y(hy - 8.8 + earDrop), X(24.6), Y(hy - 1.8), 0, 3);
    g.tri(X(13.6), Y(hy - 3.6), X(14 - earDrop), Y(hy - 7 + earDrop), X(16.2), Y(hy - 4.4), 3);
    g.tri(X(20.8), Y(hy - 4.4), X(23 + earDrop), Y(hy - 7 + earDrop), X(23.4), Y(hy - 2.8), 3);
    g.ellipse(X(hx), Y(hy), 7.2, 6.2, 0);
    g.ellipse(X(hx - 4.6), Y(hy + 2.4), 3.2, 3, 0);
    g.ellipse(X(hx + 4.4), Y(hy + 2.4), 3, 2.8, 0);
    // tabby "M" on the forehead + cheek lines
    for (const fx of [-2, 0, 2]) {
      g.put(X(hx + fx + 0.5), Y(hy - 5), 9, 1);
      g.put(X(hx + fx + 0.5), Y(hy - 4), 9, 1);
    }
    g.put(X(hx - 1.5), Y(hy - 3), 9, 1);
    g.put(X(hx + 1.5), Y(hy - 3), 9, 1);
    g.put(X(hx - 5), Y(hy + 1), 9, 1);
    g.put(X(hx - 4), Y(hy + 1), 9, 1);
    g.put(X(hx - 5), Y(hy + 3), 9, 1);
    // cream chin + muzzle
    g.ellipse(X(hx + 1.6), Y(hy + 3.6), 3.2, 2.2, 2, 0);
    g.ellipse(X(hx + 2.6), Y(hy + 1.6), 2.2, 1.6, 2, 1);
    // face
    const eyeY = hy - 0.4;
    if (state === 'stun') {
      for (const ex of [hx - 1.6, hx + 3]) {
        g.put(X(ex - 1), Y(eyeY - 1), 5);
        g.put(X(ex + 1), Y(eyeY - 1), 5);
        g.put(X(ex), Y(eyeY), 5);
        g.put(X(ex - 1), Y(eyeY + 1), 5);
        g.put(X(ex + 1), Y(eyeY + 1), 5);
      }
    } else if (state === 'warn' || state === 'air') {
      for (const ex of [hx - 1.6, hx + 3]) {
        g.rect(X(ex - 1), Y(eyeY - 1), 2, 2, 4);
        g.put(X(ex), Y(eyeY - 1), 5);
        g.put(X(ex), Y(eyeY), 5);
      }
      if (state === 'warn') {
        g.put(X(hx - 3), Y(eyeY - 3), 8);
        g.put(X(hx - 2), Y(eyeY - 2), 8);
        g.put(X(hx + 4), Y(eyeY - 3), 8);
        g.put(X(hx + 3), Y(eyeY - 2), 8);
      }
    } else {
      // sleepy, half-closed: heavy lid over a thin green-amber slit
      for (const ex of [hx - 1.6, hx + 3]) {
        g.rect(X(ex - 1), Y(eyeY - 1), 3, 1, 8);
        g.rect(X(ex - 1), Y(eyeY), 2, 1, 4);
        g.put(X(ex), Y(eyeY), 5);
      }
    }
    g.put(X(hx + 2.4), Y(hy + 1.4), 6);
    g.put(X(hx + 3.4), Y(hy + 1.4), 6);
    g.put(X(hx + 2.4), Y(hy + 2.8), 8);
    const surface = g.render(mats);
    catCache.set(key, surface);
    return surface;
  }
