  // footprint-preserving draw of new art (fw x fh art px == old cols x rows * scale)
  function drawArtFootprint(entry, x, y, footW, footH, flipX) {
    const k = footW / entry.fw;
    const dw = entry.c.width * k;
    const dh = entry.c.height * k;
    const dy = y - entry.oy * k;
    if (!flipX) {
      ctx.drawImage(entry.c, Math.round(x - entry.ox * k), Math.round(dy), dw, dh);
      return;
    }
    ctx.save();
    ctx.translate(Math.round(x + footW + entry.ox * k), 0);
    ctx.scale(-1, 1);
    ctx.drawImage(entry.c, 0, Math.round(dy), dw, dh);
    ctx.restore();
  }

  // ---------------- pixel text (crisp chunky titles) ----------------
  const pixelTextCache = new Map();

  function buildPixelText(text, size, fill, outline) {
    const key = `${text}|${size}|${fill}|${outline}`;
    const cached = pixelTextCache.get(key);
    if (cached) return cached;
    const probe = newCanvas(4, 4).getContext('2d');
    probe.font = `400 ${size}px "Press Start 2P", "Courier New", monospace`;
    const width = Math.ceil(probe.measureText(text).width) + 8;
    const height = Math.ceil(size * 1.4) + 6;
    const surface = newCanvas(width, height);
    const g = surface.getContext('2d');
    g.font = probe.font;
    g.textBaseline = 'alphabetic';
    g.fillStyle = '#000';
    g.fillText(text, 3, size + 3);
    const image = g.getImageData(0, 0, width, height);
    const mask = new Uint8Array(width * height);
    for (let i = 0; i < mask.length; i += 1) mask[i] = image.data[i * 4 + 3] > 127 ? 1 : 0;
    let top = height;
    let bottom = 0;
    for (let y = 0; y < height; y += 1) {
      for (let x = 0; x < width; x += 1) {
        if (mask[y * width + x]) {
          top = Math.min(top, y);
          bottom = Math.max(bottom, y);
        }
      }
    }
    const lightC = hexRgb(mixHex(fill, '#FFFFFF', 0.45));
    const baseC = hexRgb(fill);
    const darkC = hexRgb(mixHex(fill, '#5A1E2E', 0.35));
    const outC = hexRgb(outline);
    const shadowC = hexRgb(mixHex(outline, '#000000', 0.4));
    const out = g.createImageData(width, height);
    const d = out.data;
    const filled = (x, y) => x >= 0 && y >= 0 && x < width && y < height && mask[y * width + x] === 1;
    const paint = (i, c) => {
      d[i * 4] = c[0];
      d[i * 4 + 1] = c[1];
      d[i * 4 + 2] = c[2];
      d[i * 4 + 3] = 255;
    };
    const span = Math.max(1, bottom - top);
    for (let y = 0; y < height; y += 1) {
      for (let x = 0; x < width; x += 1) {
        const i = y * width + x;
        if (filled(x, y)) {
          const t = (y - top) / span;
          const tt = t + (bayer(x, y) - 0.5) * 0.18;
          paint(i, tt < 0.3 ? lightC : tt < 0.72 ? baseC : darkC);
          if (!filled(x, y - 1) && t < 0.5) paint(i, hexRgb('#FFFFFF'));
        } else if (filled(x - 1, y) || filled(x + 1, y) || filled(x, y - 1) || filled(x, y + 1) || filled(x - 1, y - 1) || filled(x + 1, y - 1) || filled(x - 1, y + 1) || filled(x + 1, y + 1)) {
          paint(i, outC);
        } else if (filled(x, y - 2) || filled(x - 1, y - 2) || filled(x + 1, y - 2)) {
          paint(i, shadowC);
        }
      }
    }
    g.clearRect(0, 0, width, height);
    g.putImageData(out, 0, 0);
    const entry = { canvas: surface, w: width, h: height, base: size + 3 };
    pixelTextCache.set(key, entry);
    return entry;
  }

  function drawPixelText(text, cx, baselineY, size, fill, outline, scale = ART, align = 'center') {
    const entry = buildPixelText(text, size, fill, outline);
    const x = align === 'center' ? cx - entry.w * scale / 2 : cx;
    ctx.drawImage(entry.canvas, snap(x), snap(baselineY - entry.base * scale), entry.w * scale, entry.h * scale);
    return entry.w * scale;
  }

  try {
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => pixelTextCache.clear());
      document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', () => pixelTextCache.clear());
    }
  } catch (error) {
  }

  // ===================================================================
  // v4 WORLD: textured terrain, layered backgrounds, light, motion FX
  // ===================================================================
  const LAYER_W = 480; // art px, tileable
  const bgCache = new Map();
  const LIGHTING = {
    castle: { color: '22,14,48', alpha: 0.2, player: 170 },
    boss: { color: '6,8,24', alpha: 0.56, player: 150 }
  };

  function imageCanvas(w, h, painter) {
    const surface = newCanvas(w, h);
    const g = surface.getContext('2d');
    const image = g.createImageData(w, h);
    const data = image.data;
    const set = (x, y, rgb, a = 255) => {
      if (x < 0 || y < 0 || x >= w || y >= h) return;
      const o = (y * w + x) * 4;
      data[o] = rgb[0];
      data[o + 1] = rgb[1];
      data[o + 2] = rgb[2];
      data[o + 3] = a;
    };
    const alphaAt = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : data[(y * w + x) * 4 + 3];
    painter(set, alphaAt);
    g.putImageData(image, 0, 0);
    return surface;
  }

  function outlinePass(w, h, set, alphaAt, rgb) {
    const marks = [];
    for (let y = 0; y < h; y += 1) {
      for (let x = 0; x < w; x += 1) {
        if (alphaAt(x, y)) continue;
        if (alphaAt(x - 1, y) || alphaAt(x + 1, y) || alphaAt(x, y - 1) || alphaAt(x, y + 1)) marks.push(x, y);
      }
    }
    for (let i = 0; i < marks.length; i += 2) set(marks[i], marks[i + 1], rgb);
  }

  function terrainRamps(th) {
    return {
      grassTop: hexRgb(mixHex(th.grassHi, '#FFFDE0', 0.25)),
      grassHi: hexRgb(th.grassHi),
      grass: hexRgb(th.grass),
      grassDark: hexRgb(th.grassDark),
      grassDeep: hexRgb(mixHex(th.grassDark, '#1A2A30', 0.35)),
      dirt: [hexRgb(mixHex(th.dirt, '#FFE9C0', 0.18)), hexRgb(th.dirt), hexRgb(th.dirtDark), hexRgb(mixHex(th.dirtDark, '#1A1028', 0.35))],
      stone: [hexRgb(mixHex(th.stone, '#FFFFFF', 0.3)), hexRgb(th.stone), hexRgb(mixHex(th.stone, '#2A1E44', 0.35)), hexRgb(mixHex(th.stone, '#1A1028', 0.55))],
      outline: hexRgb(mixHex(th.dirtDark, '#120A1E', 0.55)),
      root: hexRgb(mixHex(th.trunk, '#1A1028', 0.2))
    };
  }

  function soilPixel(R, th, wx, r, depth) {
    if (th.stoneBlocks) {
      const row = Math.floor(depth / 5);
      const local = depth % 5;
      const shift = (row % 2) * 5;
      const col = Math.floor((wx + shift) / 10);
      const inCol = ((wx + shift) % 10 + 10) % 10;
      if (local === 4 || inCol === 9) return R.stone[3];
      const v = hash01(row * 31.7 + col * 7.3);
      let tone = v > 0.7 ? 0 : v > 0.25 ? 1 : 2;
      if (local === 0 && tone > 0) tone -= 1;
      if (local === 3 && tone < 3) tone += 1;
      if (noise2(wx * 0.5, r * 0.5, 5) > 0.82) tone = Math.min(3, tone + 1);
      return R.stone[tone];
    }
    const stoneN = noise2(wx * 0.32, r * 0.32, 9);
    if (stoneN > 0.79 && depth > 2) {
      const above = noise2(wx * 0.32, (r - 1) * 0.32, 9) <= 0.79;
      const below = noise2(wx * 0.32, (r + 1) * 0.32, 9) <= 0.79;
      return R.stone[above ? 0 : below ? 2 : 1];
    }
    const n = noise2(wx * 0.2, r * 0.2, 3);
    const v = n * 0.85 + Math.min(0.5, depth * 0.022) + (bayer(wx, r) - 0.5) * 0.28;
    return R.dirt[v < 0.36 ? 0 : v < 0.62 ? 1 : v < 0.86 ? 2 : 3];
  }

  function grassPixel(R, d, thick, wx, r) {
    if (d === 0) return bayer(wx, r) > 0.7 ? R.grassTop : R.grassHi;
    if (d === thick - 1) return R.grassDark;
    if (d === 1) return bayer(wx, r) > 0.5 ? R.grassHi : R.grass;
    return R.grass;
  }

  function buildGroundArt(p, th) {
    const R = terrainRamps(th);
    const artW = Math.ceil(p.w / ART) + 2;
    const TP = 4;
    const bodyH = Math.ceil((BASE_H - p.y) / ART);
    const artH = TP + bodyH;
    const wx0 = Math.round(p.baseX / ART) - 1;
    const surface = imageCanvas(artW, artH, (set, alphaAt) => {
      for (let c = 0; c < artW; c += 1) {
        const wx = wx0 + c;
        const edge = c === 0 || c === artW - 1;
        const thick = 3 + (hash01(wx * 0.71) > 0.55 ? 1 : 0) + (hash01(wx * 0.13 + 3) > 0.84 ? 2 : 0);
        const h = hash01(wx * 1.37);
        const tuft = edge ? 0 : h > 0.9 ? 2 : h > 0.62 ? 1 : 0;
        for (let r = TP - tuft; r < artH; r += 1) {
          const d = r - TP;
          if (edge && d > 2) continue;
          let rgb;
          if (d < 0) rgb = R.grassHi;
          else if (d < thick) rgb = grassPixel(R, d, thick, wx, r);
          else if (d === thick) rgb = R.grassDeep;
          else rgb = soilPixel(R, th, wx, r, d - thick);
          if (!edge && (c === 1 || c === artW - 2) && d >= thick) rgb = R.dirt[3];
          set(c, r, rgb);
        }
      }
      outlinePass(artW, artH, set, alphaAt, R.outline);
    });
    return { canvas: surface, ox: ART, oy: TP * ART };
  }

  function buildFloatingArt(p, th) {
    const R = terrainRamps(th);
    const artW = Math.ceil(p.w / ART) + 2;
    const TP = 4;
    const artH = TP + 12 + 9;
    const wx0 = Math.round(p.baseX / ART) - 1;
    const surface = imageCanvas(artW, artH, (set, alphaAt) => {
      for (let c = 0; c < artW; c += 1) {
        const wx = wx0 + c;
        const e = Math.min(c - 1, artW - 2 - c);
        const edge = e < 0;
        const thick = 3 + (hash01(wx * 0.71) > 0.6 ? 1 : 0);
        const h = hash01(wx * 1.37);
        const tuft = edge ? 0 : h > 0.9 ? 2 : h > 0.6 ? 1 : 0;
        const bottom = edge ? 2 : Math.min(12 + 6, 8 + Math.min(5, Math.floor(e * 0.8)) + Math.floor(noise2(wx * 0.4, 1, 4) * 4));
        for (let r = TP - tuft; r < TP + bottom; r += 1) {
          const d = r - TP;
          let rgb;
          if (d < 0) rgb = R.grassHi;
          else if (d < thick) rgb = grassPixel(R, d, thick, wx, r);
          else if (d === thick) rgb = R.grassDeep;
          else rgb = soilPixel(R, th, wx, r, d - thick);
          if (!th.stoneBlocks && d >= bottom - 2 && d >= thick) rgb = R.dirt[3];
          set(c, r, rgb);
        }
        if (!edge && !th.stoneBlocks) {
          const rootH = hash01(wx * 2.9);
          if (rootH > 0.8) {
            const len = 2 + Math.floor(hash01(wx * 5.1) * 5);
            for (let k = 0; k < len; k += 1) set(c, TP + bottom + k, R.root);
          } else if (rootH < 0.08 && e > 2) {
            for (let k = 0; k < 3; k += 1) set(c, TP + bottom + k, R.grassDark);
          }
        }
      }
      outlinePass(artW, artH, set, alphaAt, R.outline);
    });
    return { canvas: surface, ox: ART, oy: TP * ART };
  }

  function buildCloudArt(p) {
    const artW = Math.ceil(p.w / ART) + 6;
    const artH = 22;
    const g = new PixelGrid(artW, artH);
    const mats = [makeMat('#F4F8FF', '#6E86B8', { tones: ['#A9BDE0', '#D3E1F5', '#F4F8FF', '#FFFFFF'] })];
    const n = Math.max(2, Math.round(artW / 9));
    for (let k = 0; k <= n; k += 1) {
      const cx = 3 + (artW - 6) * k / n;
      const r = 4.6 + hash01(p.baseX + k) * 2.4;
      g.ellipse(cx, 9 - (k % 2), r, r * 0.9, 0);
    }
    g.ellipse(artW / 2, 10.5, artW / 2 - 2, 5.6, 0);
    return { canvas: g.render(mats), ox: 3 * ART, oy: 3 * ART };
  }

  function buildPlankArt(p) {
    const artW = Math.ceil(p.w / ART);
    const artH = 10;
    const wood = [hexRgb('#E0A866'), hexRgb('#B97A3E'), hexRgb('#8E5628'), hexRgb('#5E3418')];
    const metal = [hexRgb('#D8DDEA'), hexRgb('#8D93A8'), hexRgb('#4E5368')];
    const surface = imageCanvas(artW + 2, artH + 2, (set, alphaAt) => {
      for (let c = 0; c < artW; c += 1) {
        const plank = Math.floor(c / 12);
        const inPlank = c % 12;
        for (let r = 0; r < artH; r += 1) {
          let rgb;
          if (inPlank === 11) rgb = wood[3];
          else if (r === 0) rgb = wood[0];
          else if (r >= artH - 2) rgb = wood[2];
          else {
            const grain = noise2(c * 0.15 + plank * 7, r * 0.9, 6);
            rgb = grain > 0.68 ? wood[2] : grain < 0.25 ? wood[0] : wood[1];
          }
          if ((inPlank === 2 || inPlank === 8) && (r === 2 || r === artH - 3)) rgb = metal[2];
          if (c < 3 || c > artW - 4) rgb = r === 0 ? metal[0] : r >= artH - 2 ? metal[2] : metal[1];
          set(c + 1, r + 1, rgb);
        }
      }
      outlinePass(artW + 2, artH + 2, set, alphaAt, hexRgb('#2A160C'));
    });
    return { canvas: surface, ox: ART, oy: ART };
  }

  function platformArt(p, th) {
    if (p.art && p.artTheme === th) return p.art;
    const isGround = p.y >= BASE_H - TILE - 1;
    if (p.kind === 'log') p.art = buildLogArt(p);
    else if (p.kind === 'crumble') p.art = buildCrumbleArt(p, th);
    else if (p.kind === 'lily') p.art = buildLilyArt(p);
    else if (p.moving) p.art = buildPlankArt(p);
    else if (isGround) p.art = buildGroundArt(p, th);
    else if (th.cloudFloat) p.art = buildCloudArt(p);
    else p.art = buildFloatingArt(p, th);
    p.artTheme = th;
    return p.art;
  }

  // ---------------- background layers ----------------
  function buildSky(th) {
    const W = 400;
    const H = 240;
    const steps = 9;
    const c0 = th.sky[0];
    const c1 = th.sky[1];
    const bands = [];
    for (let i = 0; i <= steps; i += 1) bands.push(hexRgb(mixHex(c0, c1, i / steps)));
    const sunX = 330;
    const sunY = 44;
    const sunCol = th.moon ? '#FFF2CC' : (th.sun || '#FFF3B0');
    const halo1 = hexRgb(mixHex(sunCol, c1, 0.25));
    const halo2 = hexRgb(mixHex(sunCol, c0, 0.55));
    return imageCanvas(W, H, (set) => {
      for (let y = 0; y < H; y += 1) {
        const t = Math.pow(y / H, 0.9) * steps;
        const base = Math.floor(t);
        const frac = t - base;
        for (let x = 0; x < W; x += 1) {
          let rgb = bands[Math.min(steps, base + (frac > bayer(x, y) ? 1 : 0))];
          const dx = x - sunX;
          const dy = y - sunY;
          const d = Math.sqrt(dx * dx + dy * dy);
          const hasSun = th.sun || th.moon;
          if (!hasSun) {
            // overcast
          } else if (d < 15) rgb = hexRgb(sunCol);
          else if (d < 21 && bayer(x, y) < 0.75) rgb = halo1;
          else if (d < 30 && bayer(x, y) < 0.35) rgb = halo2;
          if (th.moon && d < 15) {
            const crater = noise2(x * 0.35, y * 0.35, 2);
            if (crater > 0.66) rgb = hexRgb('#D9C9A0');
            if (dx > 6 && dy > -2) rgb = hexRgb(mixHex('#FFF2CC', '#B8A890', 0.4));
          } else if (hasSun && d < 15 && dx + dy > 10) {
            rgb = hexRgb(mixHex(sunCol, '#FFB46A', 0.35));
          }
          set(x, y, rgb);
        }
      }
    });
  }

  function atmos(th, color, k) {
    return mixHex(color, th.sky[1], k);
  }

  function drawTreeInto(g, x, baseY, s, kind, leafMat, trunkMat, seed) {
    if (kind === 'pine') {
      g.rect(x - 1, baseY - 6 * s, 2, 6 * s + 2, trunkMat, 1);
      for (let k = 0; k < 4; k += 1) {
        const yb = baseY - 4 * s - k * 6 * s;
        const half = (9 - k * 2) * s;
        g.tri(x - half, yb, x + half, yb, x, yb - 10 * s, leafMat, (a, b, c, px) => (px < x - 1 ? 3 : px > x + half * 0.4 ? 1 : 2));
      }
      return;
    }
    g.rect(x - 1, baseY - 9 * s, 3, 9 * s + 2, trunkMat, 1);
    const blobs = 4 + Math.floor(hash01(seed) * 3);
    for (let k = 0; k < blobs; k += 1) {
      const a = (k / blobs) * Math.PI * 2 + seed;
      const rr = (5 + hash01(seed + k) * 3) * s;
      g.ellipse(x + Math.cos(a) * 5 * s, baseY - 14 * s + Math.sin(a) * 3.5 * s, rr, rr * 0.9, leafMat);
    }
    g.ellipse(x - 1 * s, baseY - 17 * s, 6 * s, 5 * s, leafMat, 1);
  }

  function buildLayer(th, which) {
    const H = which === 'far' ? 150 : which === 'mid' ? 120 : 70;
    const W = LAYER_W;
    const g = new PixelGrid(W, H);
    const k = which === 'far' ? 0.42 : which === 'mid' ? 0.2 : 0;
    const baseCol = atmos(th, which === 'far' ? th.far : which === 'mid' ? th.mid : th.near, k);
    const mats = [
      makeMat(baseCol, null, { strength: 0.55 }),
      makeMat(atmos(th, th.leaf, k + 0.1), null, { strength: 0.8 }),
      makeMat(atmos(th, th.trunk, k + 0.1), null, { strength: 0.6 }),
      makeMat(atmos(th, mixHex(baseCol, '#FFFFFF', 0.5), 0), null, { strength: 0.4 }),
      makeMat(th.leafHi, null, { strength: 0.6 }),
      makeMat(atmos(th, th.stone || '#9C93A0', k), null, { strength: 0.6 }),
      makeMat('#FFE3A0', null, { flat: true })
    ];
    const per = (x, scale, seed) => periodicNoise(x / scale, W / scale, seed);
    const heightAt = (x) => {
      if (which === 'far') return 34 + per(x, 60, 1) * 40 + per(x, 17, 2) * 12;
      if (which === 'mid') return 34 + per(x, 48, 3) * 30 + per(x, 13, 4) * 6;
      return 20 + per(x, 30, 5) * 14;
    };
    for (let x = 0; x < W; x += 1) {
      const top = Math.round(H - heightAt(x));
      const slope = heightAt(x + 1) - heightAt(x - 1);
      for (let y = top; y < H; y += 1) {
        let tone = 2;
        const d = y - top;
        if (slope < -0.4 && d < 6) tone = 3;
        else if (slope > 0.4 && d < 5) tone = 1;
        if (d === 0) tone = 3;
        if (which === 'far' && d > 30 && bayer(x, y) < (d - 30) / 70) tone = 1;
        g.put(x, y, 0, tone);
        if (which === 'far' && !th.moon && th.deco !== 'castle' && top < H - 70 && d < 3 + (x % 3)) g.put(x, y, 3, d === 0 ? 3 : 2);
      }
    }
    if (which === 'far' && th.deco === 'castle') {
      for (const [cx, w, h, roof] of [[60, 16, 70, 1], [92, 26, 52, 0], [126, 14, 84, 1], [300, 20, 64, 1], [330, 34, 44, 0], [372, 16, 90, 1]]) {
        const by = H - heightAt(cx) + 6;
        g.rect(cx - w / 2, by - h, w, h + 10, 5, 1);
        for (let m = 0; m < w; m += 4) g.rect(cx - w / 2 + m, by - h - 3, 2, 3, 5, 1);
        if (roof) g.tri(cx - w / 2 - 2, by - h, cx + w / 2 + 2, by - h, cx, by - h - w * 1.3, 5, (a, b, c, px) => (px < cx ? 2 : 0));
        for (let wy = by - h + 10; wy < by - 6; wy += 14) g.rect(cx - 1, wy, 2, 4, 6);
      }
    }
    if (which === 'mid') {
      const kind = th.deco === 'forest' ? 'pine' : 'round';
      if (th.deco === 'sky') {
        for (let i = 0; i < 6; i += 1) {
          const cx = i * 80 + hash01(i + 40) * 30;
          const cy = 70 + hash01(i + 41) * 22;
          for (let j = 0; j < 5; j += 1) g.ellipse(cx + j * 9 - 18, cy - (j % 2) * 4, 9, 8, 3);
        }
      } else if (th.deco !== 'castle') {
        const spacing = kind === 'pine' ? 18 : 46;
        for (let x0 = 0; x0 < W; x0 += spacing) {
          const seed = x0 * 0.37 + (kind === 'pine' ? 9 : 0);
          if (hash01(seed) < (kind === 'pine' ? 0.15 : 0.35)) continue;
          const x = x0 + Math.floor(hash01(seed + 1) * spacing * 0.6);
          const by = Math.round(H - heightAt(x) + 4);
          const s = kind === 'pine' ? 1 + hash01(seed + 2) * 0.7 : 0.9 + hash01(seed + 2) * 0.5;
          drawTreeInto(g, x, by, s, kind, 1, 2, seed);
          if (x < 30) drawTreeInto(g, x + W, by, s, kind, 1, 2, seed);
          if (x > W - 30) drawTreeInto(g, x - W, by, s, kind, 1, 2, seed);
        }
      }
    }
    if (which === 'near') {
      for (let x0 = 0; x0 < W; x0 += 26) {
        const seed = x0 * 0.91 + 5;
        if (hash01(seed) < 0.3) continue;
        const x = x0 + Math.floor(hash01(seed + 1) * 12);
        const by = H - heightAt(x) + 6;
        const r = 7 + hash01(seed + 2) * 6;
        for (const dx of [-W, 0, W]) {
          if (th.deco === 'sky') {
            g.ellipse(x + dx, by + 4, r * 1.4, r, 3);
          } else {
            g.ellipse(x + dx, by, r, r * 0.8, 0);
            g.ellipse(x + dx - r * 0.7, by + 3, r * 0.7, r * 0.6, 0);
            g.ellipse(x + dx + r * 0.7, by + 2, r * 0.75, r * 0.6, 0);
            if (th.deco === 'garden' && hash01(seed + 3) > 0.4) {
              for (let f = 0; f < 4; f += 1) g.put(x + dx - 4 + f * 3, by - r * 0.4 + (f % 2) * 3, 4, 3);
            }
          }
        }
        if (th.deco === 'stream' && hash01(seed + 4) > 0.5) {
          for (let f = 0; f < 4; f += 1) {
            g.rect(x + 12 + f * 3, by - 14 - (f % 2) * 3, 1, 22, 1, 1);
            g.rect(x + 12 + f * 3, by - 15 - (f % 2) * 3, 2, 4, 2, 1);
          }
        }
      }
      if (th.deco === 'garden') {
        for (let x = 0; x < W; x += 10) {
          g.rect(x, H - 34, 3, 26, 3, 2);
          g.put(x + 1, H - 35, 3, 3);
        }
        g.rect(0, H - 30, W, 2, 3, 2);
        g.rect(0, H - 22, W, 2, 3, 1);
      }
    }
    return { canvas: g.render(mats, false), h: H };
  }

  function buildCloudSprite(th, seed) {
    const w = 46 + Math.floor(hash01(seed) * 26);
    const g = new PixelGrid(w, 22);
    const base = th.moon ? '#3E4470' : th.rain ? '#9EABBA' : th.deco === 'garden' ? '#FFE6D2' : th.deco === 'castle' ? '#E8C8D8' : '#FFFFFF';
    const mats = [makeMat(base, null, { tones: [mixHex(base, th.sky[0], 0.55), mixHex(base, th.sky[0], 0.3), base, mixHex(base, '#FFFFFF', 0.5)] })];
    const n = 3 + Math.floor(hash01(seed + 1) * 3);
    for (let k = 0; k < n; k += 1) {
      const cx = 8 + (w - 16) * k / (n - 1);
      const r = 5 + hash01(seed + k * 3) * 5;
      g.ellipse(cx, 14 - r * 0.5, r, r * 0.85, 0);
    }
    g.ellipse(w / 2, 16, w / 2 - 3, 4.6, 0, -1);
    return g.render(mats, false);
  }

  function backgroundFor(th) {
    let bg = bgCache.get(th);
    if (!bg) {
      bg = {
        sky: buildSky(th),
        far: buildLayer(th, 'far'),
        mid: buildLayer(th, 'mid'),
        near: buildLayer(th, 'near'),
        clouds: [0, 1, 2, 3].map((k) => buildCloudSprite(th, k * 11 + 3))
      };
      bgCache.set(th, bg);
    }
    return bg;
  }

  function drawLayerTiled(layer, parallax, bottomY, camX) {
    const span = LAYER_W * ART;
    let x = -(((camX * parallax) % span) + span) % span;
    x = snap(x);
    const h = layer.h * ART;
    for (; x < BASE_W; x += span) ctx.drawImage(layer.canvas, x, bottomY - h, span, h);
  }

  function drawSceneryBackdrop(th, camX, time, ground = BASE_H - TILE) {
    const bg = backgroundFor(th);
    ctx.drawImage(bg.sky, 0, 0, BASE_W, BASE_H);
    if (th.moon) {
      for (let index = 0; index < 60; index += 1) {
        const tw = Math.sin(time * 0.04 + index * 2.3);
        if (tw < -0.2) continue;
        ctx.fillStyle = tw > 0.7 ? '#FFFFFF' : 'rgba(255,250,220,0.7)';
        const sx = snap(((hash01(index) * 900 - camX * 0.02) % 860 + 860) % 860 - 30);
        const sy = snap(hash01(index + 9) * 230);
        ctx.fillRect(sx, sy, ART, ART);
        if (tw > 0.92) {
          ctx.fillRect(sx - ART, sy, ART, ART);
          ctx.fillRect(sx + ART, sy, ART, ART);
          ctx.fillRect(sx, sy - ART, ART, ART);
          ctx.fillRect(sx, sy + ART, ART, ART);
        }
      }
    }
    for (let index = 0; index < 5; index += 1) {
      const cloud = bg.clouds[index % bg.clouds.length];
      const span = BASE_W + 300;
      const speed = 0.05 + index * 0.02;
      const x = snap((((index * 230 + hash01(index) * 120) - camX * (0.06 + index * 0.015) - time * speed) % span + span) % span - 150);
      const y = snap(26 + hash01(index + 30) * 130);
      ctx.drawImage(cloud, x, y, cloud.width * ART, cloud.height * ART);
    }
    drawLayerTiled(bg.far, 0.1, ground - 16, camX);
    const fog1 = ctx.createLinearGradient(0, ground - 146, 0, ground - 16);
    fog1.addColorStop(0, `rgba(${hexRgb(th.sky[1]).join(',')},0)`);
    fog1.addColorStop(1, `rgba(${hexRgb(th.sky[1]).join(',')},0.45)`);
    ctx.fillStyle = fog1;
    ctx.fillRect(0, ground - 146, BASE_W, 130);
    drawLayerTiled(bg.mid, 0.3, ground + 4, camX);
    const fog2 = ctx.createLinearGradient(0, ground - 66, 0, ground + 24);
    fog2.addColorStop(0, `rgba(${hexRgb(th.sky[1]).join(',')},0)`);
    fog2.addColorStop(1, `rgba(${hexRgb(th.sky[1]).join(',')},0.3)`);
    ctx.fillStyle = fog2;
    ctx.fillRect(0, ground - 66, BASE_W, 90);
    drawLayerTiled(bg.near, 0.55, ground + 30, camX);
  }

  // ---------------- interactive grass ----------------
  function drawGrassBlades(foreground) {
    const th = theme();
    if (th.cloudFloat === undefined && th.stoneBlocks && th.moon) return;
    const R = terrainRamps(th);
    const colors = [rgbHex(...R.grassHi), rgbHex(...R.grass), rgbHex(...R.grassDark), rgbHex(...R.grassTop)];
    const player = game.player;
    const pcx = player.x + PLAYER_W / 2;
    const pBottom = player.y + PLAYER_H;
    const t = game.frame;
    for (const p of game.platforms) {
      if (p.moving || p.kind || (th.cloudFloat && p.y < BASE_H - TILE - 1)) continue;
      const sx = p.x - game.cameraX;
      if (sx + p.w < -10 || sx > BASE_W + 10) continue;
      const a0 = Math.max(Math.ceil(p.x / ART) + 1, Math.floor((game.cameraX - 10) / ART));
      const a1 = Math.min(Math.floor((p.x + p.w) / ART) - 2, Math.ceil((game.cameraX + BASE_W + 10) / ART));
      const near = Math.abs(pBottom - p.y) < 10;
      for (let ax = a0; ax <= a1; ax += 1) {
        const h = hash01(ax * 3.11 + 7);
        if (foreground ? h < 0.93 : (h < 0.5 || h >= 0.93)) continue;
        const height = 2 + Math.floor(hash01(ax * 1.7) * 3) + (foreground ? 1 : 0);
        let sway = Math.sin(t * 0.045 + ax * 0.35) * 0.7;
        if (near) {
          const dist = ax * ART - pcx;
          if (Math.abs(dist) < 28) sway += Math.sign(dist || 1) * (1 - Math.abs(dist) / 28) * 2.6;
        }
        const color = colors[Math.floor(hash01(ax * 0.77) * 3)];
        const flower = hash01(ax * 5.3) > 0.965 && !th.stoneBlocks;
        for (let k = 0; k < height; k += 1) {
          const off = Math.round(sway * (k + 1) / height);
          ctx.fillStyle = k === height - 1 && flower ? (hash01(ax) > 0.5 ? '#FFE36E' : '#FF9CCF') : color;
          ctx.fillRect(snap(ax * ART - game.cameraX) + off * ART, p.y - (k + 1) * ART, ART, ART);
        }
      }
    }
  }

  // ---------------- water ----------------
  function drawWaterPixel() {
    if (!theme().water) return;
    const top = BASE_H - 18;
    ctx.fillStyle = '#2E6FB0';
    ctx.fillRect(0, top, BASE_W, 18);
    ctx.fillStyle = '#245A96';
    ctx.fillRect(0, top + 8, BASE_W, 10);
    ctx.fillStyle = '#6EB8EC';
    const t = game.frame;
    for (let x = 0; x < BASE_W; x += ART * 3) {
      const wave = Math.sin((x + game.cameraX) * 0.05 + t * 0.06);
      if (wave > -0.3) ctx.fillRect(x, top + (wave > 0.5 ? 0 : ART), ART * 3, ART);
    }
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    for (let index = 0; index < 22; index += 1) {
      const span = BASE_W + 40;
      const x = snap(((index * 47 - game.cameraX * 0.9 + t * 0.4) % span + span) % span - 20);
      if (Math.sin(t * 0.08 + index) > 0.2) ctx.fillRect(x, top + 6 + (index % 3) * 4, ART * (2 + (index % 3)), ART);
    }
  }

  // ---------------- ambient particles ----------------
  function ambientKind(th) {
    if (th.moon) return 'firefly';
    if (th.deco === 'forest') return 'leaf';
    if (th.deco === 'garden') return 'petal';
    if (th.deco === 'castle') return 'ember';
    if (th.deco === 'sky') return 'wind';
    return 'pollen';
  }

  function spawnAmbient(kind, anywhere) {
    const p = {
      kind,
      x: Math.random() * BASE_W,
      y: anywhere ? Math.random() * BASE_H : (kind === 'ember' || kind === 'pollen' ? BASE_H + 10 : -10),
      vx: 0,
      vy: 0,
      phase: Math.random() * 6.28,
      life: 600 + Math.random() * 600,
      seed: Math.random()
    };
    if (kind === 'leaf' || kind === 'petal') {
      p.vx = -0.3 - Math.random() * 0.4;
      p.vy = 0.35 + Math.random() * 0.35;
    } else if (kind === 'wind') {
      p.x = anywhere ? Math.random() * BASE_W : BASE_W + 20;
      p.y = Math.random() * 360;
      p.vx = -3 - Math.random() * 3;
    } else if (kind === 'ember') {
      p.vy = -0.4 - Math.random() * 0.5;
    } else if (kind === 'pollen') {
      p.vy = -0.15 - Math.random() * 0.2;
      p.vx = 0.15;
    } else {
      p.y = 200 + Math.random() * 260;
    }
    return p;
  }

  function updateAmbient(th) {
    const kind = ambientKind(th);
    const target = kind === 'wind' ? 14 : kind === 'firefly' ? 26 : 34;
    if (!game.ambient || game.ambientKind !== kind) {
      game.ambient = [];
      game.ambientKind = kind;
      for (let index = 0; index < target; index += 1) game.ambient.push(spawnAmbient(kind, true));
    }
    const camDelta = (game.cameraX - (game.ambientCam || game.cameraX));
    game.ambientCam = game.cameraX;
    game.ambient = game.ambient.filter((p) => {
      p.phase += 0.05;
      p.life -= 1;
      p.x += p.vx - camDelta * 0.8;
      p.y += p.vy;
      if (p.kind === 'leaf' || p.kind === 'petal') p.x += Math.sin(p.phase) * 0.6;
      if (p.kind === 'firefly') {
        p.x += Math.sin(p.phase * 0.7) * 0.5;
        p.y += Math.cos(p.phase * 0.5) * 0.35;
      }
      if (p.kind === 'pollen' || p.kind === 'ember') p.x += Math.sin(p.phase * 0.8) * 0.3;
      if (p.x < -40) p.x += BASE_W + 60;
      if (p.x > BASE_W + 40) p.x -= BASE_W + 60;
      return p.life > 0 && p.y > -30 && p.y < BASE_H + 30;
    });
    while (game.ambient.length < target) game.ambient.push(spawnAmbient(kind, false));
  }

  function drawAmbient() {
    if (!game.ambient) return;
    for (const p of game.ambient) {
      const x = snap(p.x);
      const y = snap(p.y);
      switch (p.kind) {
        case 'pollen':
          ctx.fillStyle = Math.sin(p.phase * 2) > 0 ? 'rgba(255,250,200,0.9)' : 'rgba(255,240,160,0.5)';
          ctx.fillRect(x, y, ART, ART);
          break;
        case 'leaf': {
          ctx.fillStyle = p.seed > 0.5 ? '#E8A33C' : '#7DBA4A';
          const flip = Math.sin(p.phase * 1.5) > 0;
          ctx.fillRect(x, y, flip ? ART * 2 : ART, ART);
          ctx.fillStyle = p.seed > 0.5 ? '#B8701E' : '#4E8A32';
          ctx.fillRect(x, y + ART, ART, ART);
          break;
        }
        case 'petal':
          ctx.fillStyle = p.seed > 0.4 ? '#FFB7D2' : '#FFFFFF';
          ctx.fillRect(x, y, Math.sin(p.phase * 1.7) > 0 ? ART * 2 : ART, ART);
          break;
        case 'ember':
          ctx.fillStyle = p.seed > 0.5 ? '#FFC46A' : '#FF8A3C';
          ctx.fillRect(x, y, ART, ART);
          break;
        case 'wind':
          ctx.fillStyle = 'rgba(255,255,255,0.45)';
          ctx.fillRect(x, y, ART * (6 + Math.floor(p.seed * 8)), ART);
          break;
        case 'firefly': {
          const a = 0.35 + 0.65 * Math.max(0, Math.sin(p.phase * 1.3));
          ctx.fillStyle = `rgba(220,255,140,${(a * 0.25).toFixed(2)})`;
          ctx.fillRect(x - ART * 2, y - ART, ART * 5, ART * 3);
          ctx.fillRect(x - ART, y - ART * 2, ART * 3, ART * 5);
          ctx.fillStyle = `rgba(245,255,190,${a.toFixed(2)})`;
          ctx.fillRect(x, y, ART, ART);
          break;
        }
      }
    }
  }

  // ---------------- light & post ----------------
  let lightCanvas = null;

  function drawLighting(th, sources) {
    const cfg = LIGHTING[THEME_ORDER[game.levelIndex]];
    if (cfg) {
      if (!lightCanvas) lightCanvas = newCanvas(200, 120);
      const lg = lightCanvas.getContext('2d');
      lg.globalCompositeOperation = 'source-over';
      lg.clearRect(0, 0, 200, 120);
      lg.fillStyle = `rgba(${cfg.color},${cfg.alpha})`;
      lg.fillRect(0, 0, 200, 120);
      lg.globalCompositeOperation = 'destination-out';
      for (const s of sources) {
        const x = s.x / 4;
        const y = s.y / 4;
        const r = s.r / 4;
        const grad = lg.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, `rgba(0,0,0,${s.a || 1})`);
        grad.addColorStop(0.5, `rgba(0,0,0,${(s.a || 1) * 0.7})`);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        lg.fillStyle = grad;
        lg.fillRect(x - r, y - r, r * 2, r * 2);
      }
      lg.globalCompositeOperation = 'source-over';
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(lightCanvas, 0, 0, BASE_W, BASE_H);
      ctx.imageSmoothingEnabled = false;
    }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const s of sources) {
      if (!s.glow) continue;
      const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 0.6);
      grad.addColorStop(0, `rgba(${s.glow},0.22)`);
      grad.addColorStop(1, `rgba(${s.glow},0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(s.x - s.r, s.y - s.r, s.r * 2, s.r * 2);
    }
    if (th.sun && !th.moon) {
      const t = game.frame * 0.01;
      const sunX = 660;
      for (let k = 0; k < 4; k += 1) {
        const a = 0.035 + 0.025 * Math.sin(t * 1.3 + k * 1.7);
        const angle = 2.1 + k * 0.12 + Math.sin(t + k) * 0.02;
        const len = 700;
        const w = 30 + k * 16;
        ctx.fillStyle = `rgba(255,248,210,${a.toFixed(3)})`;
        ctx.beginPath();
        ctx.moveTo(sunX, 80);
        ctx.lineTo(sunX + Math.cos(angle - w / 1400) * len, 80 + Math.sin(angle - w / 1400) * len);
        ctx.lineTo(sunX + Math.cos(angle + w / 1400) * len, 80 + Math.sin(angle + w / 1400) * len);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.restore();
    const vignette = ctx.createRadialGradient(BASE_W / 2, BASE_H * 0.45, BASE_H * 0.35, BASE_W / 2, BASE_H * 0.45, BASE_W * 0.62);
    vignette.addColorStop(0, 'rgba(12,8,30,0)');
    vignette.addColorStop(1, 'rgba(12,8,30,0.32)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, BASE_W, BASE_H);
  }

  // ---------------- iris wipe ----------------
  function startWipe(action, cx, cy) {
    if (game.wipe && game.wipe.phase === 'close') return;
    game.wipe = { phase: 'close', t: 0, dur: 26, action, cx: cx == null ? BASE_W / 2 : cx, cy: cy == null ? BASE_H / 2 : cy };
  }

  function openWipe(cx, cy) {
    game.wipe = { phase: 'open', t: 0, dur: 30, cx: cx == null ? BASE_W / 2 : cx, cy: cy == null ? BASE_H / 2 : cy };
  }

  function updateWipe() {
    const w = game.wipe;
    if (!w) return;
    w.t += 1;
    if (w.t < w.dur) return;
    if (w.phase === 'close') {
      const action = w.action;
      game.wipe = null;
      if (action) action();
      if (!game.wipe) {
        const p = game.player;
        openWipe(p ? p.x - game.cameraX + PLAYER_W / 2 : BASE_W / 2, p ? p.y + PLAYER_H / 2 : BASE_H / 2);
      }
    } else {
      game.wipe = null;
    }
  }

  function drawWipe() {
    const w = game.wipe;
    if (!w) return;
    const maxR = Math.hypot(Math.max(w.cx, BASE_W - w.cx), Math.max(w.cy, BASE_H - w.cy)) + 16;
    let k = clamp(w.t / w.dur, 0, 1);
    k = k * k * (3 - 2 * k);
    const r = w.phase === 'close' ? maxR * (1 - k) : maxR * k;
    const block = 8;
    ctx.fillStyle = '#0D0A1C';
    for (let y = 0; y < BASE_H; y += block) {
      const dy = y + block / 2 - w.cy;
      if (Math.abs(dy) >= r) {
        ctx.fillRect(0, y, BASE_W, block + 1);
        continue;
      }
      const dx = Math.floor(Math.sqrt(r * r - dy * dy) / block) * block;
      const left = Math.floor((w.cx - dx) / block) * block;
      const right = Math.ceil((w.cx + dx) / block) * block;
      if (left > 0) ctx.fillRect(0, y, left, block + 1);
      if (right < BASE_W) ctx.fillRect(right, y, BASE_W - right, block + 1);
    }
    if (r > 6 && r < maxR - 6) {
      ctx.fillStyle = '#FFD94A';
      for (let a = 0; a < Math.PI * 2; a += 0.08) {
        ctx.fillRect(snap(w.cx + Math.cos(a) * r) - 2, snap(w.cy + Math.sin(a) * r) - 2, 4, 4);
      }
    }
  }

  // ---------------- UI particles (screen space) ----------------
  function burstUi(x, y, colors, count = 14, speed = 3) {
    if (!game.uiParticles) game.uiParticles = [];
    for (let index = 0; index < count; index += 1) {
      const a = Math.random() * Math.PI * 2;
      const v = speed * (0.4 + Math.random());
      game.uiParticles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 40 + Math.random() * 30, color: colors[index % colors.length], size: Math.random() > 0.6 ? 4 : 2, spin: Math.random() * 6, gravity: 0.12 });
    }
  }

  function spawnConfetti(count = 80) {
    if (!game.uiParticles) game.uiParticles = [];
    const colors = ['#FFD94A', '#FF7AA8', '#7BE36C', '#6CC4FF', '#FF9C3A', '#C59BFF'];
    for (let index = 0; index < count; index += 1) {
      game.uiParticles.push({ x: Math.random() * BASE_W, y: -10 - Math.random() * 200, vx: (Math.random() - 0.5) * 1.5, vy: 1 + Math.random() * 1.5, life: 260, color: colors[index % colors.length], size: 4, spin: Math.random() * 6, gravity: 0.02, confetti: true });
    }
  }

  function updateUiParticles() {
    if (!game.uiParticles) return;
    game.uiParticles = game.uiParticles.filter((p) => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      if (p.confetti) {
        p.vx += Math.sin(p.spin + p.y * 0.03) * 0.03;
        p.vy = Math.min(p.vy, 2.2);
      }
      p.spin += 0.2;
      p.life -= 1;
      return p.life > 0 && p.y < BASE_H + 20;
    });
  }

  function drawUiParticles() {
    if (!game.uiParticles) return;
    for (const p of game.uiParticles) {
      ctx.globalAlpha = clamp(p.life / 25, 0, 1);
      ctx.fillStyle = p.color;
      const wide = p.confetti ? (Math.sin(p.spin) > 0 ? 6 : 2) : p.size;
      ctx.fillRect(snap(p.x), snap(p.y), wide, p.confetti ? 4 : p.size);
    }
    ctx.globalAlpha = 1;
  }

  buildItems();
  registerLegacyArt();
  // ===================================================================
  // v6: land mechanics — mushrooms, rolling cabbages, falling logs, wind,
  // sinking lilies, sprinklers, crumbling bricks, timed spikes, yarn drops
  // ===================================================================
  const MECH_ART = new Map();

  function buildMechArt() {
    {
      const make = (squash) => {
        const g = new PixelGrid(26, 16);
        const mats = [
          makeMat('#E8423C', '#4A0E12', { tones: ['#9E1F2A', '#C9303A', '#E8423C', '#FF8A78'] }),
          makeMat('#F4E6CC', '#4A2E1A'),
          makeMat('#FFFFFF', null, { flat: true })
        ];
        const capY = squash ? 8.6 : 6.6;
        g.rect(9, capY + 2, 8, 14 - capY - 1, 1, 2);
        g.ellipse(13, capY, 11.6, squash ? 4.6 : 5.8, 0);
        for (const [dx, dy] of [[-6, -1], [0, -3], [5, -1], [-2, 1], [8, 1]]) {
          g.put(13 + dx, capY + dy, 2);
          g.put(14 + dx, capY + dy, 2);
        }
        return g.render(mats);
      };
      MECH_ART.set('mushroom', make(false));
      MECH_ART.set('mushroomSquash', make(true));
    }
    for (const [name, base, vein] of [['cabbage', '#7CC855', '#3E7A2E'], ['yarn', '#F28AB8', '#B04A80']]) {
      for (let f = 0; f < 4; f += 1) {
        const g = new PixelGrid(16, 16);
        const mats = [makeMat(base, mixHex(vein, '#140A20', 0.5)), makeMat(vein, null, { flat: true })];
        g.ellipse(8, 8, 6.8, 6.8, 0);
        const a0 = f * Math.PI / 8;
        for (let k = 0; k < 3; k += 1) {
          const a = a0 + k * Math.PI / 3;
          for (let r = -5; r <= 5; r += 1) {
            const x = 8 + Math.cos(a) * r;
            const y = 8 + Math.sin(a) * r * (name === 'yarn' ? 0.6 : 1);
            if (g.at(Math.floor(x), Math.floor(y)) === 0) g.put(x, y, 1);
          }
        }
        MECH_ART.set(`${name}${f}`, g.render(mats));
      }
    }
  }

  function buildLogArt(p) {
    const w = Math.ceil(p.w / ART);
    const g = new PixelGrid(w + 2, 14);
    const mats = [
      makeMat('#8A5A32', '#2A160A', { tones: ['#4E2E16', '#6E4424', '#8A5A32', '#B07A46'] }),
      makeMat('#E8C890', '#2A160A', { strength: 0.6 }),
      makeMat('#5E9A48', null, { strength: 0.6 })
    ];
    g.capsule(3.5, 6.5, w - 1.5, 6.5, 5, 5, 0);
    g.pattern(0, (x, y) => (x * 3 + y * 7) % 11 === 0 || (y === 6 && x % 5 === 0), -1);
    g.ellipse(w - 1.5, 6.5, 2.6, 4.4, 1);
    g.put(w - 1.5, 6.5, 0, 0);
    for (let x = 6; x < w - 4; x += 7) {
      g.put(x, 1, 2, 2);
      g.put(x + 1, 1, 2, 3);
    }
    return { canvas: g.render(mats), ox: ART, oy: ART };
  }

  function buildLilyArt(p) {
    const w = Math.ceil(p.w / ART) + 4;
    const g = new PixelGrid(w, 9);
    const mats = [
      makeMat('#4FAE52', '#123A1E', { tones: ['#2E7A3A', '#3E9446', '#4FAE52', '#86D46E'] }),
      makeMat('#F6A6C8', '#5A1A36'),
      makeMat('#FFE36E', null, { flat: true })
    ];
    g.ellipse(w / 2, 4.5, w / 2 - 1, 3.4, 0);
    for (let k = 0; k < 4; k += 1) g.put(w / 2 + k, 4.5 - k * 0.3, -1);
    g.pattern(0, (x, y) => (x - Math.floor(w / 2)) % 4 === 0 && y > 3, -1);
    g.ellipse(4, 3, 1.8, 1.6, 1);
    g.put(4, 3, 2);
    return { canvas: g.render(mats), ox: ART * 2, oy: ART };
  }

  function buildCrumbleArt(p, th) {
    const base = buildFloatingArt(p, th);
    const g = base.canvas.getContext('2d');
    const crack = mixHex(th.dirtDark, '#000000', 0.55);
    const glint = mixHex(th.stone, '#FFE9B0', 0.5);
    for (let x = 5; x < base.canvas.width - 5; x += 8) {
      let cx = x;
      for (let y = 4; y < 15; y += 1) {
        cx += (y % 3 === 0) ? ((x / 8) % 2 ? 1 : -1) : 0;
        g.fillStyle = crack;
        g.fillRect(cx, y, 1, 1);
        g.fillStyle = glint;
        g.fillRect(cx + 1, y, 1, 1);
      }
    }
    g.fillStyle = 'rgba(255,200,120,0.18)';
    g.fillRect(1, 4, base.canvas.width - 2, 11);
    return base;
  }

  // ---------------- platforms that react ----------------
  function updatePlatformKinds() {
    const player = game.player;
    for (let i = 0; i < game.platforms.length; i += 1) {
      const p = game.platforms[i];
      if (!p.kind) continue;
      const stood = player.onGround && player.standingPlatform === i;
      if (p.kind === 'lily') {
        if (p.gone) {
          p.ptimer -= 1;
          if (p.ptimer <= 0) {
            p.gone = false;
            p.sink = 24;
            p.fade = 0;
          }
        } else if (stood) {
          if (p.sink < 0.5) audio.cue('plop');
          p.sink += 0.42;
          if (p.sink >= 28) {
            p.gone = true;
            p.ptimer = 80;
            audio.cue('bloop');
            for (let k = 0; k < 12; k += 1) game.particles.push({ x: p.x + p.w / 2 + (Math.random() - 0.5) * p.w, y: p.y, vx: (Math.random() - 0.5) * 3, vy: -2 - Math.random() * 3, color: k % 2 ? '#BFE6FF' : '#FFFFFF', life: 24, size: 2 });
          }
        } else {
          p.sink = Math.max(0, p.sink - 0.5);
        }
        p.y = p.baseY + p.sink + (stood ? 0 : Math.round(Math.sin(game.frame * 0.05 + i)));
        if (p.fade < 1) p.fade = Math.min(1, p.fade + 0.05);
        continue;
      }
      switch (p.pstate) {
        case 'idle':
          if (stood) {
            p.pstate = 'shake';
            p.ptimer = p.kind === 'log' ? 40 : 30;
            audio.cue(p.kind === 'log' ? 'creak' : 'crack');
          }
          break;
        case 'shake':
          p.ptimer -= 1;
          if (p.ptimer <= 0) {
            if (p.kind === 'crumble') {
              p.pstate = 'gone';
              p.gone = true;
              p.ptimer = 210;
              audio.cue('crumble');
              for (let k = 0; k < 16; k += 1) game.particles.push({ x: p.x + Math.random() * p.w, y: p.y + Math.random() * 20, vx: (Math.random() - 0.5) * 2, vy: -1 - Math.random() * 2, color: k % 3 ? theme().stone : theme().dirtDark, life: 40, size: 4 });
            } else {
              p.pstate = 'fall';
              p.pvy = 0;
              audio.cue('logfall');
            }
          }
          break;
        case 'fall':
          p.pvy = Math.min(10, p.pvy + 0.45);
          p.y += p.pvy;
          if (p.y > BASE_H + 40) {
            p.pstate = 'gone';
            p.gone = true;
            p.ptimer = 220;
          }
          break;
        case 'gone':
          p.ptimer -= 1;
          if (p.ptimer <= 0) {
            const blocked = overlap(player.x, player.y, PLAYER_W, PLAYER_H, p.x, p.baseY - 4, p.w, TILE);
            if (blocked) {
              p.ptimer = 20;
            } else {
              p.pstate = 'idle';
              p.gone = false;
              p.y = p.baseY;
              p.fade = 0;
            }
          }
          break;
      }
      if (p.fade < 1) p.fade = Math.min(1, p.fade + 0.05);
    }
  }

  // ---------------- mushrooms ----------------
  function launchPlayer(vy) {
    const player = game.player;
    player.vy = vy;
    player.boost = 22;
    player.onGround = false;
    player.airJumps = 1;
    player.coyote = 0;
    player.pounding = false;
    player.standingPlatform = -1;
    player.squash = -0.18;
  }

  function updateBouncers() {
    const player = game.player;
    const cx = player.x + PLAYER_W / 2;
    const bottom = player.y + PLAYER_H;
    for (const b of game.bouncers) {
      if (b.squash > 0) b.squash -= 1;
      const capTop = b.y - 22;
      if (Math.abs(cx - b.x) > 26) continue;
      const prevBottom = bottom - player.vy;
      const fromAbove = player.vy > 0 && bottom >= capTop && prevBottom <= capTop + 4;
      const landedOn = player.onGround && Math.abs(bottom - b.y) < 2 && game.frame - (player.landedFrame || -99) < 2;
      if (!fromAbove && !landedOn) continue;
      const pounded = player.pounding;
      player.y = capTop - PLAYER_H;
      launchPlayer(pounded ? -18 : -15.8);
      b.squash = 12;
      audio.cue('boing');
      for (let k = 0; k < 10; k += 1) game.particles.push({ x: b.x + (Math.random() - 0.5) * 30, y: capTop, vx: (Math.random() - 0.5) * 3, vy: -Math.random() * 2, color: k % 2 ? '#FFFFFF' : '#FF8A78', life: 20, size: 2 });
      if (!game.guide.bounceShown) {
        game.guide.bounceShown = true;
        popup(b.x - game.cameraX, capTop - 30, 'BOING!', '#FF9C8A');
      }
    }
  }

  function drawBouncers() {
    for (const b of game.bouncers) {
      const x = b.x - game.cameraX;
      if (x < -60 || x > BASE_W + 60) continue;
      const art = MECH_ART.get(b.squash > 6 ? 'mushroomSquash' : 'mushroom');
      ctx.drawImage(art, snap(x - art.width), snap(b.y - art.height * ART + 2), art.width * ART, art.height * ART);
    }
  }

  // ---------------- rolling cabbages / yarn ----------------
  function spawnRoller(x, y, vx, kind = 'cabbage', vy = 0) {
    game.rollers.push({ x, y, vx, vy, rot: 0, kind, life: kind === 'yarn' ? 360 : 2400 });
  }

  function updateRollers() {
    for (const s of game.rollerSpawners) {
      s.timer -= 1;
      if (s.timer > 0) continue;
      s.timer = s.interval;
      if (Math.abs(s.x - (game.cameraX + BASE_W / 2)) < BASE_W * 1.1) { spawnRoller(s.x - 14, s.y - 28, s.dir * 2.3); if (Math.abs(s.x - (game.cameraX + BASE_W / 2)) < BASE_W * 0.7) audio.cue('roll'); }
    }
    const player = game.player;
    game.rollers = game.rollers.filter((r) => {
      r.vy = Math.min(14, r.vy + 0.5);
      const prevBottom = r.y + 28;
      r.y += r.vy;
      r.x += r.vx;
      r.rot += Math.abs(r.vx) * 0.06;
      r.life -= 1;
      for (const p of game.platforms) {
        if (p.gone) continue;
        if (r.x + 24 <= p.x || r.x + 4 >= p.x + p.w) continue;
        if (r.vy >= 0 && prevBottom <= p.y + 6 && r.y + 28 >= p.y) {
          if (r.kind === 'yarn' && r.vy > 4) {
            r.vx = (Math.random() < 0.5 ? -1 : 1) * 1.8;
            triggerShake(2, 6);
            audio.cue('yarnLand');
            emitDust(r.x + 14, p.y - 2, 6);
          }
          r.y = p.y - 28;
          r.vy = 0;
          r.x += p.dx || 0;
        }
      }
      if (r.y > BASE_H + 80 || r.x < -60 || r.x > game.level.worldWidth + 60 || r.life <= 0) return false;
      if (game.celebrate > 0) return true;
      if (overlap(player.x + 6, player.y + 6, PLAYER_W - 12, PLAYER_H - 8, r.x + 2, r.y + 2, 24, 24)) {
        if (player.vy > 0.5 && player.y + PLAYER_H < r.y + 18) {
          player.vy = -9;
          player.pounding = false;
          player.airJumps = 1;
          game.score += 30;
          saveHiScore();
          popup(r.x - game.cameraX + 14, r.y - 8, '+30', '#B8F08A');
          emitSpark(r.x + 14, r.y + 14, r.kind === 'yarn' ? '#F28AB8' : '#7CC855', 12);
          audio.cue('stomp');
          return false;
        }
        if (player.invul <= 0) damagePlayer(r.kind === 'yarn' ? 'wloczka' : 'kapusta');
      }
      return true;
    });
  }

  function drawRollers() {
    for (const r of game.rollers) {
      const x = r.x - game.cameraX;
      if (x < -40 || x > BASE_W + 40) continue;
      if (r.kind === 'yarn') {
        const cx = snap(x + 14);
        const cy = snap(r.y + 14);
        ctx.fillStyle = '#5A2A4A';
        ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#C86AA8';
        ctx.beginPath(); ctx.arc(cx, cy, 11, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#F4C8E8';
        for (let k = 0; k < 5; k += 1) { const a = r.rot + k * 1.25; ctx.fillRect(snap(cx + Math.cos(a) * 6) - 2, snap(cy + Math.sin(a) * 6) - 2, 4, 4); }
        continue;
      }
      const frame = Math.floor(r.rot * 4 / Math.PI) % 4;
      const art = MECH_ART.get(`${r.kind}${(frame + 4) % 4}`);
      ctx.drawImage(art, snap(x - 2), snap(r.y - 2), art.width * ART, art.height * ART);
    }
  }

  // ---------------- wind ----------------
  function updateWinds() {
    const player = game.player;
    const cx = player.x + PLAYER_W / 2;
    for (const w of game.winds) {
      const inZone = cx > w.x && cx < w.x + w.w;
      if (inZone && !w.inside) audio.cue('wind');
      w.inside = inZone;
      if (inZone) {
        player.x = clamp(player.x + w.force, 0, game.level.worldWidth - PLAYER_W);
        if (!w.shown) {
          w.shown = true;
          setNotice(w.force < 0 ? 'Wiatr w twarz – rozpędź się i skacz dalej!' : 'Wiatr w plecy – uważaj, żeby nie przeskoczyć!', '#D9F0FF', 160, 2, 'WIATR');
        }
      }
      const visible = w.x + w.w > game.cameraX && w.x < game.cameraX + BASE_W;
      if (visible && game.frame % 3 === 0) {
        game.windStreaks.push({ x: w.force < 0 ? w.x + w.w : w.x, y: 40 + Math.random() * 400, vx: w.force * 9, len: 10 + Math.random() * 30, zone: w });
      }
    }
    game.windStreaks = game.windStreaks.filter((s) => {
      s.x += s.vx;
      return s.x > s.zone.x - 40 && s.x < s.zone.x + s.zone.w + 40;
    });
  }

  function drawWindStreaks() {
    for (const s of game.windStreaks) {
      const x = s.x - game.cameraX;
      if (x < -60 || x > BASE_W + 60) continue;
      ctx.fillStyle = 'rgba(60,110,180,0.55)';
      ctx.fillRect(snap(x), snap(s.y) + 2, snap(s.len), 2);
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.fillRect(snap(x), snap(s.y), snap(s.len), 2);
      ctx.fillRect(snap(x + (s.vx > 0 ? -8 : s.len)), snap(s.y - 2), 8, 2);
      if (s.len > 30) {
        ctx.fillStyle = '#6FB04A';
        ctx.fillRect(snap(x + s.len / 2), snap(s.y - 6 + Math.sin((game.frame + s.y) * 0.3) * 4), 4, 2);
      }
    }
  }

  // ---------------- sprinklers ----------------
  function geyserState(g) {
    const t = (game.frame + g.offset) % g.period;
    const activeAt = g.period - 72;
    const warnAt = activeAt - 50;
    if (t >= activeAt) return { state: 'active', k: t - activeAt };
    if (t >= warnAt) return { state: 'warn', k: t - warnAt };
    return { state: 'idle', k: 0 };
  }

  function updateGeysers() {
    const player = game.player;
    const cx = player.x + PLAYER_W / 2;
    for (const g of game.geysers) {
      if (g.cool > 0) g.cool -= 1;
      const st = geyserState(g);
      if (st.state === 'warn' && st.k % 24 === 0 && Math.abs(g.x - cx) < 420) audio.cue('bubbles');
      if (st.state !== 'active' || st.k < 4 || g.cool > 0) continue;
      const height = Math.min(180, st.k * 22);
      const bottom = player.y + PLAYER_H;
      if (Math.abs(cx - g.x) < 22 && bottom > g.y - height - 6 && bottom <= g.y + 2) {
        launchPlayer(-15.8);
        g.cool = 34;
        audio.cue('geyser');
      }
    }
  }

  function drawGeysers() {
    for (const g of game.geysers) {
      const x = snap(g.x - game.cameraX);
      if (x < -60 || x > BASE_W + 60) continue;
      const st = geyserState(g);
      if (st.state === 'active') {
        const height = Math.min(180, st.k * 22);
        const fadeOut = st.k > 62 ? (72 - st.k) / 10 : 1;
        ctx.globalAlpha = clamp(fadeOut, 0, 1);
        ctx.fillStyle = '#3E8ED8';
        ctx.fillRect(x - 12, g.y - height, 24, height);
        ctx.fillStyle = '#8CCBFF';
        ctx.fillRect(x - 8, g.y - height, 16, height);
        ctx.fillStyle = '#FFFFFF';
        for (let y = g.y - height; y < g.y; y += 12) ctx.fillRect(x - 4 + ((y / 12 + game.frame) % 2) * 4, snap(y + (game.frame * 6) % 12), 4, 6);
        for (let k = 0; k < 8; k += 1) {
          const a = game.frame * 0.3 + k * 0.8;
          ctx.fillStyle = k % 2 ? '#FFFFFF' : '#8CCBFF';
          ctx.fillRect(snap(x + Math.cos(a) * 22), snap(g.y - height - 4 + Math.abs(Math.sin(a)) * 12), 4, 4);
        }
        ctx.globalAlpha = 1;
      } else if (st.state === 'warn') {
        ctx.fillStyle = '#8CCBFF';
        for (let k = 0; k < 3; k += 1) {
          const hop = Math.abs(Math.sin((game.frame + k * 7) * 0.3)) * (6 + st.k * 0.2);
          ctx.fillRect(x - 8 + k * 6, snap(g.y - 12 - hop), 4, 4);
        }
      }
      ctx.fillStyle = '#2A2238';
      ctx.fillRect(x - 12, g.y - 10, 24, 10);
      ctx.fillStyle = '#8D93A8';
      ctx.fillRect(x - 10, g.y - 8, 20, 8);
      ctx.fillStyle = '#D8DDEA';
      ctx.fillRect(x - 10, g.y - 8, 20, 2);
      ctx.fillStyle = '#2A2238';
      ctx.fillRect(x - 4, g.y - 12, 8, 4);
      ctx.fillStyle = st.state === 'idle' ? '#5E6478' : '#6CC4FF';
      ctx.fillRect(x - 2, g.y - 12, 4, 2);
    }
  }

  // ---------------- timed spikes ----------------
  function timedSpikeOffset(s) {
    const t = (game.frame + s.offset) % s.period;
    const half = s.period / 2;
    if (t < half) return 16 * (1 - Math.min(1, t / 5));
    const down = t - half;
    if (down > half - 26) return Math.floor(game.frame / 4) % 2 ? 11 : 13;
    return 16 * Math.min(1, down / 5);
  }

  function updateTimedSpikes() {
    const player = game.player;
    const groundY = BASE_H - TILE;
    for (const s of game.timedSpikes) {
      if ((game.frame + s.offset) % s.period === 0 && Math.abs(s.x - player.x) < 320) audio.cue('schwing');
      if (timedSpikeOffset(s) > 6) continue;
      if (overlap(player.x + 6, player.y + 8, PLAYER_W - 12, PLAYER_H - 10, s.x + 2, groundY - 14, 20, 14)) {
        damagePlayer('kolce');
        return;
      }
    }
  }

  function drawTimedSpikes() {
    const groundY = BASE_H - TILE;
    for (const s of game.timedSpikes) {
      const x = s.x - game.cameraX;
      if (x < -40 || x > BASE_W + 40) continue;
      const off = timedSpikeOffset(s);
      ctx.save();
      ctx.beginPath();
      ctx.rect(x - 6, 0, 40, groundY + 2);
      ctx.clip();
      drawItemArt('spike', snap(x), snap(groundY - 16 + off), ART);
      ctx.restore();
      ctx.fillStyle = '#2A2238';
      ctx.fillRect(snap(x) - 2, groundY, 28, 4);
      ctx.fillStyle = '#6E6880';
      ctx.fillRect(snap(x), groundY, 24, 2);
    }
  }

  // ---------------- boss: falling yarn ----------------
  function updateBossHazards() {
    const boss = game.enemies.find((enemy) => enemy.boss);
    if (!boss) return;
    const rage = boss.maxHp - boss.hp;
    if (rage < 1) return;
    game.bossDropTimer -= 1;
    if (game.bossDropTimer <= 0) {
      game.bossDropTimer = rage >= 2 ? 64 : 104;
      const px = game.player.x + PLAYER_W / 2 + (Math.random() - 0.5) * 220;
      game.drops.push({ x: clamp(px, 120, game.level.worldWidth - 120), t: 54 });
      audio.cue('whistle');
      if (!game.guide.yarnShown) {
        game.guide.yarnShown = true;
        setNotice('Grzybowy Król sypie zarodnikami! Uciekaj spod cieni.', '#FFC8E0', 180, 3, 'UWAGA');
      }
    }
    game.drops = game.drops.filter((d) => {
      d.t -= 1;
      if (d.t <= 0) {
        spawnRoller(d.x - 14, -40, 0, 'yarn', 9);
        return false;
      }
      return true;
    });
  }

  function drawDrops() {
    for (const d of game.drops) {
      const x = d.x - game.cameraX;
      const k = 1 - d.t / 54;
      const w = snap(12 + k * 28);
      ctx.fillStyle = `rgba(10,6,24,${(0.25 + k * 0.4).toFixed(2)})`;
      ctx.fillRect(snap(x - w / 2), BASE_H - TILE - 4, w, 4);
      ctx.fillRect(snap(x - w / 2 + 4), BASE_H - TILE - 6, w - 8, 2);
      if (Math.floor(game.frame / 6) % 2) {
        ctx.fillStyle = '#FF7AA8';
        ctx.fillRect(snap(x) - 2, BASE_H - TILE - 30, 4, 12);
        ctx.fillRect(snap(x) - 2, BASE_H - TILE - 14, 4, 4);
      }
    }
  }
