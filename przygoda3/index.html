  function emitSpark(x, y, color, count = 8) {
    for (let index = 0; index < count; index += 1) {
      const angle = Math.PI * 2 * index / count + Math.random() * 0.5;
      const speed = 1.8 + Math.random() * 3.2;
      game.particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        color,
        life: 22 + Math.random() * 10,
        size: 2 + Math.random() * 2
      });
    }
  }

  function emitDust(x, y, count = 8) {
    for (let index = 0; index < count; index += 1) {
      game.particles.push({
        x,
        y,
        vx: (Math.random() * 2 - 1) * (2 + Math.random() * 2.5),
        vy: -(Math.random() * 1.6 + 0.4),
        color: Math.random() < 0.5 ? '#A98747' : '#C49A62',
        life: 24 + Math.random() * 12,
        size: 3 + Math.random() * 3
      });
    }
  }

  function popup(x, y, text, color = '#FFD700') {
    game.popups.push({ x, y, text, color, life: 48 });
  }

  function setNotice(text, color = '#FFE082', duration = 140, priority = 1, title = '') {
    if (game.notice && game.notice.life > 18 && game.notice.priority > priority) return;
    game.notice = {
      title,
      text,
      color,
      life: duration,
      maxLife: duration,
      priority
    };
  }

  function setFlash(color = 'rgba(255,90,90,0.24)', alpha = 0.24) {
    game.flashColor = color;
    game.flashAlpha = Math.max(game.flashAlpha, alpha);
  }

  function updateParticles() {
    game.particles = game.particles.filter((part) => {
      part.x += part.vx;
      part.y += part.vy;
      part.vy += 0.14;
      part.vx *= 0.98;
      part.life -= 1;
      return part.life > 0;
    });
  }

  function updatePopups() {
    game.popups = game.popups.filter((item) => {
      item.y -= 0.65;
      item.life -= 1;
      return item.life > 0;
    });
  }

  function updateNotice() {
    if (!game.notice) return;
    game.notice.life -= 1;
    if (game.notice.life <= 0) {
      game.notice = null;
    }
  }

  function updateFlash() {
    if (game.flashAlpha <= 0.002) {
      game.flashAlpha = 0;
      return;
    }
    game.flashAlpha *= 0.84;
  }

  function drawParticles() {
    for (const part of game.particles) {
      ctx.globalAlpha = clamp(part.life / 28, 0, 1);
      ctx.fillStyle = part.color;
      const size = part.size > 3.2 ? ART * 2 : ART;
      ctx.fillRect(snap(part.x - game.cameraX), snap(part.y), size, size);
    }
    ctx.globalAlpha = 1;
  }

  function drawPopups() {
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.lineJoin = 'round';
    for (const item of game.popups) {
      ctx.globalAlpha = clamp(item.life / 20, 0, 1);
      const rise = item.life > 40 ? (48 - item.life) * 0.6 : 0;
      ctx.lineWidth = 4;
      ctx.strokeStyle = OUTLINE;
      ctx.strokeText(item.text, item.x, item.y - rise);
      ctx.fillStyle = item.color;
      ctx.fillText(item.text, item.x, item.y - rise);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  function triggerShake(strength = 4, frames = 10) {
    game.shakeStrength = Math.max(game.shakeStrength, strength);
    game.shakeFrames = Math.max(game.shakeFrames, frames);
  }

  function updateShake() {
    if (game.shakeFrames > 0) {
      game.shakeFrames -= 1;
      game.shakeX = (Math.random() * 2 - 1) * game.shakeStrength;
      game.shakeY = (Math.random() * 2 - 1) * game.shakeStrength * 0.5;
      game.shakeStrength *= 0.86;
    } else {
      game.shakeStrength = 0;
      game.shakeX = 0;
      game.shakeY = 0;
    }
  }

  function loadLevel(index) {
    const source = LEVELS[index];
    game.levelIndex = index;
    game.level = source;
    game.platforms = source.platforms.map((platform, platformIndex) => ({
      x: platform.x,
      y: platform.y,
      w: platform.w,
      moving: !!platform.moving,
      baseX: platform.x,
      phase: platformIndex * 0.55,
      range: platform.moving ? 26 + (platformIndex % 3) * 8 : 0,
      speed: platform.moving ? 0.014 + (platformIndex % 3) * 0.002 : 0,
      dx: 0,
      kind: platform.kind || null,
      baseY: platform.y,
      pstate: 'idle',
      ptimer: 0,
      pvy: 0,
      sink: 0,
      gone: false,
      fade: 1
    }));
    game.enemies = source.enemies.map((enemy) => createEnemy(enemy, index));
    const pickupSource = source.pickups.concat(buildAutoCarrots(source));
    game.pickups = pickupSource.map((item) => createPickup(item));
    game.spikes = source.spikes.map((spike) => ({ x: spike.x, y: spike.y }));
    game.bouncers = (source.bouncers || []).map((b) => ({ x: b.x, y: b.y, squash: 0 }));
    game.rollerSpawners = (source.rollers || []).map((r) => ({ ...r, timer: r.offset || 0 }));
    game.rollers = [];
    game.winds = (source.winds || []).map((w) => ({ ...w, shown: false }));
    game.geysers = (source.geysers || []).map((g) => ({ ...g, cool: 0 }));
    game.timedSpikes = (source.timedSpikes || []).map((s) => ({ ...s }));
    game.drops = [];
    game.bossDropTimer = 120;
    game.windStreaks = [];
    p3ResetLevel(source);
    game.secrets = (source.secrets || []).map((secret) => ({
      x: secret.x,
      y: secret.y,
      w: secret.w,
      h: secret.h,
      text: secret.text,
      rewards: [...(secret.rewards || [])],
      found: false
    }));
    game.checkpoint = source.checkpoint ? { ...source.checkpoint } : null;
    game.checkpointActive = false;
    game.respawnX = source.startX;
    game.respawnY = source.startY;
    game.player = createPlayer(source.startX, source.startY);
    game.cameraX = 0;
    game.lookahead = 0;
    game.portalTick = 0;
    game.bullets = [];
    game.particles = [];
    game.popups = [];
    game.defeated = [];
    game.notice = null;
    game.flashAlpha = 0;
    game.secretScene = null;
    game.powerHelpText = '';
    game.tutorialVisible = index === 0;
    game.hitStop = 0;
    game.levelFrames = 0;
    game.titleCard = 170;
    game.nameTagTimer = 170;
    game.fade = 0;
    game.pickupStreak = 0;
    game.ambient = null;
    game.uiParticles = [];
    game.celebrate = 0;
    game.binkyY = 0;
    game.shockwaves = [];
    game.weather = null;
    game.pickupStreakTimer = 0;
    game.stats = {
      heartsLost: 0,
      diamonds: 0,
      diamondsTotal: game.pickups.filter((item) => item.kind === 'diamond').length,
      carrots: 0,
      carrotsTotal: game.pickups.filter((item) => item.kind === 'carrot' || item.kind === 'golden').length,
      secrets: 0,
      secretsTotal: game.secrets.length
    };
    game.levelEntryState = {
      score: game.score,
      lives: game.lives,
      ammo: game.ammo
    };
    audio.resetMusic();
    if (!game.wipe) openWipe(source.startX + PLAYER_W / 2, source.startY + PLAYER_H / 2);
    if (source.hint) setNotice(source.hint, '#D7F6FF', 330, 2, 'NOWOŚĆ');
  }

  function startGame() {
    saveName();
    if (!isPlayerNameValid(nameInput.value)) {
      game.scoreSyncText = '';
      updateMenuHint();
      requestAnimationFrame(() => nameInput.focus());
      return;
    }
    audio.resume();
    game.scoreSyncText = '';
    startWipe(() => openMap(), BASE_W / 2, BASE_H / 2);
  }

  function beginLevelRun() {
    input.resetAll();
    game.notice = null;
    game.flashAlpha = 0;
    setScene('PLAYING');
  }

  function goMenu() {
    input.resetAll();
    game.notice = null;
    game.flashAlpha = 0;
    game.secretScene = null;
    game.powerHelpText = '';
    setScene('MENU');
    updateMenuHint();
  }

  function restartCurrentLevel(reason = '') {
    if (!game.level) return;
    const afterGameOver = game.scene === 'GAME_OVER';
    game.score = game.levelEntryState.score;
    game.lives = afterGameOver ? Math.max(3, game.levelEntryState.lives) : game.levelEntryState.lives;
    game.ammo = game.levelEntryState.ammo;
    game.displayScore = game.score;
    input.resetAll();
    loadLevel(game.levelIndex);
    game.titleCard = 0;
    setScene('PLAYING');
    if (reason) {
      setNotice(reason, '#D7F6FF', 120, 2, 'POWTÓRKA');
    }
  }

  function startNextLevel() {
    const nextIndex = game.levelIndex + 1;
    if (nextIndex >= LEVELS.length) {
      audio.cue('win');
      saveHiScore();
      game.winTimer = 0;
      setScene('WIN');
      submitScoreToLeaderboard('KONIEC PRZYGODY');
      return;
    }
    input.resetAll();
    loadLevel(nextIndex);
    setScene('PLAYING');
  }

  function pauseOrResume() {
    if (game.scene === 'PLAYING') {
      setScene('PAUSED', '');
      input.resetAll();
    } else if (game.scene === 'PAUSED') {
      setScene('PLAYING');
    }
  }

  function overlayButtonsForScene() {
    const centerX = BASE_W / 2;
    switch (game.scene) {
      case 'MAP':
        return [
          { action: 'playMap', label: 'GRAJ', x: centerX - 150, y: 432, w: 190, h: 38, tone: 'primary' },
          { action: 'menu', label: 'MENU', x: centerX + 54, y: 432, w: 100, h: 38, tone: 'ghost' }
        ];
      case 'ONBOARDING':
        return [
          { action: 'startRun', label: 'JASNE, RUSZAJMY', x: centerX - 180, y: 396, w: 248, h: 40, tone: 'primary' },
          { action: 'map', label: 'MAPA', x: centerX + 80, y: 396, w: 168, h: 40, tone: 'ghost' }
        ];
      case 'SECRET_FOUND':
        return [
          { action: 'claimSecret', label: 'ZGARNIJ PREZENTY', x: centerX - 184, y: 390, w: 248, h: 40, tone: 'primary' },
          { action: 'map', label: 'MAPA', x: centerX + 78, y: 390, w: 108, h: 40, tone: 'ghost' }
        ];
      case 'POWER_HELP':
        return [
          { action: 'continuePower', label: 'ROZUMIEM, BIEGNĘ', x: centerX - 170, y: 396, w: 340, h: 40, tone: 'primary' }
        ];
      case 'PAUSED':
        return [
          { action: 'resume', label: 'WRÓĆ DO GRY', x: centerX - 140, y: 260, w: 280, h: 38, tone: 'primary' },
          { action: 'restartLevel', label: 'POWTÓRZ POZIOM', x: centerX - 140, y: 308, w: 174, h: 34, tone: 'secondary' },
          { action: 'map', label: 'MAPA', x: centerX + 44, y: 308, w: 96, h: 34, tone: 'ghost' }
        ];
      case 'LEVEL_CLEAR':
        return [
          { action: 'nextLevel', label: 'DALEJ', x: centerX - 140, y: 330, w: 280, h: 42, tone: 'primary' },
          { action: 'restartLevel', label: 'JESZCZE RAZ', x: centerX - 140, y: 380, w: 174, h: 34, tone: 'secondary' },
          { action: 'map', label: 'MAPA', x: centerX + 44, y: 380, w: 96, h: 34, tone: 'ghost' }
        ];
      case 'GAME_OVER':
        return [
          { action: 'restartLevel', label: 'SPRÓBUJ JESZCZE RAZ', x: centerX - 40, y: 388, w: 320, h: 40, tone: 'danger' },
          { action: 'map', label: 'MAPA', x: centerX + 50, y: 438, w: 140, h: 30, tone: 'ghost' }
        ];
      case 'WIN':
        return [
          { action: 'restartAdventure', label: 'MAPA PRZYGODY', x: centerX - 170, y: 104, w: 198, h: 38, tone: 'primary' },
          { action: 'menu', label: 'MENU', x: centerX + 36, y: 104, w: 134, h: 38, tone: 'secondary' }
        ];
      default:
        return [];
    }
  }

  function overlayActionAt(x, y) {
    if (!canUseSceneAction()) return null;
    for (const button of overlayButtonsForScene()) {
      if (pointInRect(x, y, button)) {
        return button.action;
      }
    }
    if (game.scene === 'MAP') {
      for (let index = 0; index < MAP_NODES.length; index += 1) {
        const [nx, ny] = MAP_NODES[index];
        if (Math.abs(x - nx) < 24 && Math.abs(y - ny) < 24) return `node:${index}`;
      }
    }
    return null;
  }

  function runSceneAction(action) {
    if (!canUseSceneAction()) return;
    if (typeof action === 'string' && action.startsWith('node:')) {
      selectMapNode(Number(action.slice(5)));
      return;
    }
    switch (action) {
      case 'resume':
        input.resetAll();
        setScene('PLAYING');
        return;
      case 'restartLevel':
        startWipe(() => restartCurrentLevel('Powtarzamy poziom od początku.'));
        return;
      case 'menu':
        goMenu();
        return;
      case 'map': {
        const next = game.scene === 'LEVEL_CLEAR' ? game.levelIndex + 1 : game.levelIndex;
        startWipe(() => openMap(Math.min(next, LEVELS.length - 1)));
        return;
      }
      case 'playMap':
        selectMapNode(game.map.sel);
        return;
      case 'nextLevel':
        startWipe(startNextLevel);
        return;
      case 'startRun':
        beginLevelRun();
        openWipe(game.player.x - game.cameraX + PLAYER_W / 2, game.player.y + PLAYER_H / 2);
        return;
      case 'claimSecret':
        claimSecretRewards();
        return;
      case 'continuePower':
        input.resetAll();
        setScene('PLAYING');
        return;
      case 'restartAdventure':
        startWipe(() => openMap(0));
        return;
    }
  }

  function rewardSprite(kind) {
    switch (kind) {
      case 'carrot': return CARROT;
      case 'golden': return GOLD_CARROT;
      case 'lettuce': return GOLD_LETTUCE;
      case 'heart': return HEART;
      case 'diamond': return DIAMOND;
      default: return CARROT;
    }
  }

  function rewardLabel(kind) {
    switch (kind) {
      case 'carrot': return 'ŻOŁĄDŹ';
      case 'golden': return 'ZŁOTY ŻOŁĄDŹ';
      case 'lettuce': return 'TURBO-MARCHEW';
      case 'heart': return 'SERCE';
      case 'diamond': return 'DIAMENT';
      default: return 'BONUS';
    }
  }

  function rewardGlow(kind) {
    switch (kind) {
      case 'carrot': return '#FFE082';
      case 'golden': return '#FFD700';
      case 'lettuce': return '#E8FF8B';
      case 'heart': return '#FF9DAA';
      case 'diamond': return '#88CCFF';
      default: return '#FFFFFF';
    }
  }

  function rewardHint(kind) {
    switch (kind) {
      case 'carrot': return '1 bobek i kilka punktow.';
      case 'golden': return '2 bobki i porzadny zastrzyk punktow.';
      case 'lettuce': return 'Wyzej skaczesz i szybciej wlacza sie taran.';
      case 'heart': return 'Oddaje serce, jesli Puszek je stracil.';
      case 'diamond': return 'Czysty bonus do rekordu.';
      default: return 'Maly bonus dla Puszka.';
    }
  }

  function openPowerHelp(text = '') {
    if (game.guide.powerIntroShown) return false;
    game.guide.powerIntroShown = true;
    game.powerHelpText = text;
    input.resetAll();
    setScene('POWER_HELP');
    return true;
  }

  function applySecretReward(kind) {
    let points = 0;
    switch (kind) {
      case 'carrot':
        points = 10;
        game.ammo = Math.min(MAX_AMMO, game.ammo + 1);
        game.guide.ammoIntroShown = true;
        audio.cue('collect');
        break;
      case 'golden':
        points = 50;
        game.ammo = Math.min(MAX_AMMO, game.ammo + 2);
        game.guide.ammoIntroShown = true;
        audio.cue('golden');
        break;
      case 'diamond':
        points = 100;
        audio.cue('diamond');
        break;
      case 'lettuce':
        points = 75;
        game.player.powerFrames = Math.max(game.player.powerFrames, 60 * 8);
        audio.cue('power');
        break;
      case 'magnet':
        points = 25;
        game.magnet = 60 * 9;
        audio.cue('power');
        emitSpark(cx, cy, '#FF8A9A', 14);
        setNotice('Żołędzie same lecą do ciebie przez 9 sekund!', '#FFC8D0', 180, 3, 'MAGNES');
        break;
      case 'bubble':
        points = 25;
        game.player.bubble = 60 * 14;
        audio.cue('power');
        emitSpark(cx, cy, '#A8E0FF', 14);
        setNotice('Bańka obroni cię przed jednym trafieniem.', '#C8ECFF', 180, 3, 'BAŃKA');
        break;
      case 'heart':
        if (game.lives < MAX_LIVES) {
          game.lives += 1;
          audio.cue('heart');
          return { kind, points: 0, gavePower: false };
        }
        points = 25;
        audio.cue('collect');
        break;
    }
    game.score += points;
    saveHiScore();
    return { kind, points, gavePower: kind === 'lettuce' };
  }

  function claimSecretRewards() {
    if (!game.secretScene) {
      input.resetAll();
      setScene('PLAYING');
      return;
    }
    const rewards = game.secretScene.rewards || [];
    let gavePower = false;
    for (const kind of rewards) {
      const result = applySecretReward(kind);
      if (result && result.gavePower) gavePower = true;
    }
    setNotice(HERO_NAME() + ' zgarnął prezenty ze skrytki.', '#FFE680', 190, 3, 'SEKRET');
    game.secretScene = null;
    if (gavePower && openPowerHelp('Zlota salata trafila do lapek Puszka.')) {
      return;
    }
    input.resetAll();
    setScene('PLAYING');
  }

  function respawnPlayer() {
    game.player = createPlayer(game.respawnX, game.respawnY);
    if (game.level && game.level.chase) game.chaseX = game.respawnX - 340;
    game.player.invul = 110;
    game.cameraX = clamp(game.respawnX - BASE_W * 0.35, 0, game.level.worldWidth - BASE_W);
  }

  function damagePlayer(kind = 'hit') {
    const player = game.player;
    if (kind !== 'pit' && player.invul > 0) return;
    if (kind !== 'pit' && player.bubble > 0) {
      player.bubble = 0;
      player.invul = 80;
      audio.cue('stomp');
      emitSpark(player.x + PLAYER_W / 2, player.y + PLAYER_H / 2, '#A8E0FF', 18);
      popup(player.x - game.cameraX + PLAYER_W / 2, Math.max(60, player.y - 10), 'BAŃKA!', '#A8E0FF');
      return;
    }
    game.lives -= 1;
    if (kind !== 'pit') scatterAcorns(player);
    if (game.stats) game.stats.heartsLost += 1;
    game.hitStop = 6;
    audio.cue(kind === 'pit' ? 'fall' : 'hurt');
    setFlash('rgba(255,90,90,0.26)', 0.26);
    triggerShake(kind === 'pit' ? 7 : 5, kind === 'pit' ? 14 : 12);
    emitSpark(player.x + PLAYER_W / 2, player.y + PLAYER_H / 2, '#FF4444', 12);
    if (game.lives <= 0) {
      saveHiScore();
      audio.cue('over');
      setScene('GAME_OVER');
      submitScoreToLeaderboard('KONIEC GRY');
      return;
    }
    if (kind === 'pit') {
      respawnPlayer();
      openWipe(game.player.x - game.cameraX + PLAYER_W / 2, game.player.y + PLAYER_H / 2);
      popup(game.player.x - game.cameraX + 6, Math.max(60, game.player.y - 10), '-1 SERCE', '#FF6666');
      setNotice(game.checkpointActive ? 'Wracasz do flagi. Spokojnie, jeszcze raz!' : 'Wracasz na start. Spokojnie, jeszcze raz!', '#FFBBBB', 140, 3, 'UPS!');
      return;
    }
    popup(player.x - game.cameraX + PLAYER_W / 2, Math.max(60, player.y - 10), '-1 SERCE', '#FF6666');
    if (kind === 'persi') {
      setNotice('Z boku zabiera serce! Wskakuj wrogom na głowę.', '#FFBBBB', 140, 3, 'AU!');
    } else if (kind === 'jez') {
      setNotice('Jeż ma kolce! Bobek, zryw albo tupnięcie – nie skacz mu na grzbiet.', '#FFBBBB', 170, 3, 'AU!');
    } else if (kind === 'szyszka') {
      setNotice('Szyszka! Wiewiórki celują – rób uniki.', '#FFBBBB', 140, 3, 'AU!');
    } else if (kind === 'wiatrolom') {
      setNotice('Pień cię dogonił! Biegnij dalej w prawo!', '#FFBBBB', 140, 3, 'AU!');
    } else if (kind === 'kapusta') {
      setNotice('Kapusta przejechała Puszka. Przeskakuj je!', '#FFBBBB', 140, 3, 'AU!');
    } else if (kind === 'wloczka') {
      setNotice('Kłębek spadł na głowę! Uciekaj spod cieni.', '#FFBBBB', 140, 3, 'AU!');
    } else if (kind === 'kolce') {
      setNotice('Kolce kłują. Przeskocz je.', '#FFBBBB', 130, 3, 'AU!');
    } else {
      setNotice('Uwaga, jedno serce mniej.', '#FFBBBB', 110, 2, 'AU!');
    }
    player.invul = 150;
    player.vy = -6.2;
    player.vx = player.facingLeft ? 1.8 : -1.8;
    player.squash = 0.14;
  }

  function tryJump() {
    const player = game.player;
    const canGroundJump = player.onGround || player.coyote > 0;
    if (!canGroundJump && (player.airJumps <= 0 || HERO === 'C')) return false;
    const strength = (player.powerFrames > 0 ? JUMP_FORCE * 1.20 : JUMP_FORCE) * (HERO === 'C' ? 1.08 : 1);
    player.vy = canGroundJump ? strength : strength * 0.96;
    player.onGround = false;
    player.coyote = 0;
    player.standingPlatform = -1;
    player.squash = -0.12;
    if (!canGroundJump) {
      player.airJumps -= 1;
      game.guide.doubleDone = true;
      const cx = player.x + PLAYER_W / 2;
      const cy = player.y + PLAYER_H - 4;
      for (let index = 0; index < 12; index += 1) {
        const angle = Math.PI * 2 * index / 12;
        game.particles.push({ x: cx, y: cy, vx: Math.cos(angle) * 2.6, vy: Math.sin(angle) * 1.1, color: '#FFFFFF', life: 16, size: 3 });
      }
      audio.cue('djump');
    } else {
      emitDust(player.x + PLAYER_W / 2, player.y + PLAYER_H - 6, 7);
      audio.cue('jump');
    }
    game.guide.jumpDone = true;
    return true;
  }

  function fireBobek() {
    if (game.scene !== 'PLAYING') return false;
    if (HERO === 'C') return startDash(game.player);
    if (game.ammo <= 0) {
      audio.cue('empty');
      setNotice('Brak bobków – zbieraj żołędzie.', '#FFE0B8', 120, 2, 'PUSTO');
      return false;
    }
    const player = game.player;
    game.ammo -= 1;
    const direction = player.facingLeft ? -1 : 1;
    game.bullets.push({
      x: player.x + PLAYER_W / 2,
      y: player.y + PLAYER_H / 2 - 4,
      vx: direction * 6.1,
      vy: -4.6,
      radius: 5
    });
    audio.cue('shoot');
    emitSpark(player.x + PLAYER_W / 2 + direction * 8, player.y + PLAYER_H / 2 - 2, '#8B5A2B', 5);
    game.guide.shootDone = true;
    return true;
  }

  function updateMovingPlatforms() {
    for (const platform of game.platforms) {
      platform.dx = 0;
      if (!platform.moving) continue;
      const previousX = platform.x;
      platform.phase += platform.speed;
      platform.x = platform.baseX + Math.sin(platform.phase) * platform.range;
      platform.dx = platform.x - previousX;
    }
  }

  function updatePlayer() {
    const player = game.player;
    const wasOnGround = player.onGround;
    const previousVy = player.vy;

    if (player.onGround && player.standingPlatform >= 0) {
      const platform = game.platforms[player.standingPlatform];
      if (platform) {
        player.x += platform.dx;
      }
    }

    const direction = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    if (direction !== 0) {
      game.guide.moveDone = true;
    }

    let accel = player.onGround ? GROUND_ACCEL : AIR_ACCEL;
    if (player.powerFrames > 0) accel *= 1.16;
    if (direction !== 0) {
      if (player.vx * direction < 0) accel *= TURN_BOOST;
      player.vx += accel * direction;
      const cap = (player.powerFrames > 0 ? MOVE_SPEED * 1.22 : MOVE_SPEED) * heroSpeed();
      player.vx = clamp(player.vx, -cap, cap);
      player.facingLeft = direction < 0;
    } else {
      player.vx *= player.onGround ? GROUND_FRICTION : AIR_DRAG;
      if (Math.abs(player.vx) < 0.05) player.vx = 0;
    }

    player.walking = Math.abs(player.vx) > 0.2;
    player.rolling = (player.powerFrames > 0 && player.onGround && Math.abs(player.vx) > 1.55) || player.dash > 0;

    if (input.jumpPressed) {
      player.jumpBuffer = JUMP_BUFFER;
    } else {
      player.jumpBuffer = Math.max(0, (player.jumpBuffer || 0) - 1);
    }

    if (player.jumpBuffer > 0 && tryJump()) {
      player.jumpBuffer = 0;
      game.tutorialVisible = false;
    }

    p3PlayerMotion(player);
    if (player.boost > 0) player.boost -= 1;
    const gravity = player.p3NoGravity ? 0 : player.vy < 0 ? (input.jumpHeld || player.boost > 0 ? GRAVITY : GRAVITY + JUMP_CUT) : FALL_GRAVITY;
    player.vy += gravity;
    player.vy = Math.min(player.vy, 16);

    player.x += player.vx;
    player.x = clamp(player.x, 0, game.level.worldWidth - PLAYER_W);

    const previousBottom = player.y + PLAYER_H;
    player.y += player.vy;
    player.onGround = false;
    player.standingPlatform = -1;

    for (let index = 0; index < game.platforms.length; index += 1) {
      const platform = game.platforms[index];
      if (platform.gone) continue;
      if (player.x + PLAYER_W - 4 <= platform.x || player.x + 4 >= platform.x + platform.w) continue;
      if (player.vy >= 0 && previousBottom <= platform.y + 6 && player.y + PLAYER_H >= platform.y) {
        player.y = platform.y - PLAYER_H;
        player.vy = 0;
        player.onGround = true;
        player.airJumps = 1;
        player.standingPlatform = index;
      } else if (player.vy < 0 && player.y <= platform.y + TILE && player.y >= platform.y + TILE - 12) {
        player.y = platform.y + TILE;
        player.vy = 0.8;
      }
    }

    if (player.onGround) {
      player.coyote = COYOTE_FRAMES;
      player.fallStartY = player.y;
      player.stompChain = 0;
    } else {
      if (player.coyote > 0) player.coyote -= 1;
      if (player.vy <= 0 && player.y < player.fallStartY) {
        player.fallStartY = player.y;
      }
    }

    if (!wasOnGround && player.onGround) {
      audio.cue('land', { v: previousVy });
      player.squash = clamp(previousVy * 0.018, 0.08, 0.18);
      emitDust(player.x + PLAYER_W / 2, player.y + PLAYER_H - 4, 9);
    }

    if (player.y > BASE_H + 120) {
      damagePlayer('pit');
      return;
    }

    if (player.walking && player.onGround) {
      player.walkTick += 1;
      if (player.walkTick >= 7) {
        player.walkTick = 0;
        player.walkFrame ^= 1;
        audio.cue('step', { soft: !!player.sneaking });
      }
    } else {
      player.walkTick = 0;
      player.walkFrame = 0;
    }

    if (player.rolling && game.frame % 4 === 0) {
      emitDust(player.x + PLAYER_W / 2, player.y + PLAYER_H - 5, 2);
    }

    player.squash *= 0.78;
    if (Math.abs(player.squash) < 0.01) player.squash = 0;

    if (player.powerFrames > 0) {
      player.powerFrames -= 1;
    }

    if (player.invul > 0) {
      player.invul -= 1;
    }
  }

  function updateBossAI(enemy, grounded) {
    const player = game.player;
    const rage = enemy.maxHp - enemy.hp;
    const playerCenter = player.x + PLAYER_W / 2;
    const bossCenter = enemy.x + enemy.w / 2;
    const toward = playerCenter < bossCenter ? -1 : 1;
    enemy.aiTimer -= 1;
    switch (enemy.ai) {
      case 'patrol': {
        const speed = enemy.vx + rage * 0.25;
        enemy.x += enemy.facingLeft ? -speed : speed;
        if (enemy.aiTimer <= 0 && grounded && Math.abs(playerCenter - bossCenter) < 560) {
          enemy.ai = 'telegraph';
          enemy.aiTimer = 50 - rage * 8;
          enemy.facingLeft = toward < 0;
          enemy.chargeDir = toward;
          audio.cue('meow');
        }
        break;
      }
      case 'telegraph':
        if (enemy.aiTimer <= 0) {
          if (rage >= 1 && Math.random() < 0.45) {
            enemy.ai = 'leap';
            enemy.vy = -10.5;
            enemy.airborne = true;
            enemy.leapVx = toward * (2.3 + rage * 0.4);
            enemy.facingLeft = toward < 0;
          } else {
            enemy.ai = 'charge';
            enemy.aiTimer = 90;
          }
        }
        break;
      case 'charge': {
        enemy.x += enemy.chargeDir * (3.3 + rage * 0.7);
        if (game.frame % 3 === 0) emitDust(enemy.x + (enemy.chargeDir > 0 ? 0 : enemy.w), enemy.y + enemy.h - 4, 2);
        const hitWall = enemy.x <= enemy.minX || enemy.x + enemy.w >= enemy.maxX;
        if (hitWall || enemy.aiTimer <= 0) {
          enemy.ai = 'recover';
          enemy.aiTimer = 54;
          if (hitWall) triggerShake(4, 8);
        }
        break;
      }
      case 'leap':
        enemy.x += enemy.leapVx;
        if (enemy.aiTimer < -200) {
          enemy.ai = 'recover';
          enemy.aiTimer = 40;
        }
        break;
      default:
        if (enemy.aiTimer <= 0) {
          enemy.ai = 'patrol';
          enemy.aiTimer = 130 - rage * 25;
          enemy.facingLeft = toward < 0;
        }
        break;
    }
    if (enemy.x <= enemy.minX) {
      enemy.x = enemy.minX;
      enemy.facingLeft = false;
    }
    if (enemy.x + enemy.w >= enemy.maxX) {
      enemy.x = enemy.maxX - enemy.w;
      enemy.facingLeft = true;
    }
  }

  function updateEnemies() {
    for (const enemy of game.enemies) {
      if (enemy.kind === 'bee') { updateBee(enemy); continue; }
      if (enemy.standingPlatform >= 0) {
        const platform = game.platforms[enemy.standingPlatform];
        if (platform) enemy.x += platform.dx;
      }

      enemy.vy += GRAVITY;
      enemy.vy = Math.min(enemy.vy, 16);
      const previousBottom = enemy.y + enemy.h;
      enemy.y += enemy.vy;
      enemy.standingPlatform = -1;

      for (let index = 0; index < game.platforms.length; index += 1) {
        const platform = game.platforms[index];
        if (platform.gone) continue;
        if (enemy.x + enemy.w <= platform.x || enemy.x >= platform.x + platform.w) continue;
        if (enemy.vy >= 0 && previousBottom <= platform.y + 4 && enemy.y + enemy.h >= platform.y) {
          enemy.y = platform.y - enemy.h;
          enemy.vy = 0;
          enemy.standingPlatform = index;
        }
      }

      const grounded = enemy.standingPlatform >= 0;
      if (grounded && !enemy.wasGrounded && enemy.airborne) {
        enemy.airborne = false;
        emitDust(enemy.x + enemy.w / 2, enemy.y + enemy.h - 4, enemy.boss ? 16 : 6);
        if (enemy.boss) {
          triggerShake(7, 16);
          audio.cue('stomp');
          if (enemy.ai === 'leap') {
            enemy.ai = 'recover';
            enemy.aiTimer = 46;
          }
        }
      }
      enemy.wasGrounded = grounded;

      if (enemy.y > BASE_H + 200) {
        enemy.hp = 0;
        continue;
      }

      if (enemy.pooped) {
        enemy.poopTimer -= 1;
        enemy.walkTick += 1;
        if (enemy.walkTick >= 14) {
          enemy.walkTick = 0;
          enemy.walkFrame ^= 1;
        }
        if (enemy.poopTimer <= 0) {
          enemy.pooped = false;
        }
        continue;
      }

      if (enemy.hitPause > 0) {
        enemy.hitPause -= 1;
        continue;
      }

      if (enemy.boss) {
        updateBossAI(enemy, grounded);
      } else if (enemy.kind === 'sleeper') {
        updateSleeper(enemy);
        if (enemy.sleepState !== 'chase') {
          enemy.walkTick += 1;
          if (enemy.walkTick >= 40) {
            enemy.walkTick = 0;
            enemy.walkFrame ^= 1;
          }
          continue;
        }
      } else {
        if (enemy.sitTimer > 0) {
          enemy.sitTimer -= 1;
          continue;
        }
        if (enemy.kind === 'hopper') {
          enemy.hopTimer -= 1;
          if (grounded && enemy.hopTimer <= 0) {
            enemy.vy = -8.8;
            enemy.airborne = true;
            enemy.hopTimer = 80 + Math.floor(Math.random() * 60);
          }
        }
        if (enemy.kind === 'squirrel') updateSquirrel(enemy, grounded);
        enemy.x += enemy.facingLeft ? -enemy.vx : enemy.vx;
        let turned = false;
        if (enemy.x <= enemy.minX) {
          enemy.x = enemy.minX;
          enemy.facingLeft = false;
          turned = true;
        }
        if (enemy.x + enemy.w >= enemy.maxX) {
          enemy.x = enemy.maxX - enemy.w;
          enemy.facingLeft = true;
          turned = true;
        }
        if (turned && enemy.kind === 'walker' && grounded && Math.random() < 0.35) enemy.sitTimer = 90;
      }

      enemy.walkTick += 1;
      const animRate = (enemy.boss && enemy.ai === 'charge') || enemy.sleepState === 'chase' ? 5 : (enemy.boss ? 11 : 10);
      if (enemy.walkTick >= animRate) {
        enemy.walkTick = 0;
        enemy.walkFrame ^= 1;
      }
    }

    game.enemies = game.enemies.filter((enemy) => enemy.hp > 0);
  }

  function updateDefeated() {
    game.defeated = game.defeated.filter((body) => {
      body.x += body.vx;
      body.y += body.vy;
      body.vy += 0.42;
      body.rot += body.spin;
      return body.y < BASE_H + 140;
    });
  }

  function stompEnemy(enemy, points, popupText, color) {
    const player = game.player;
    if (player.pounding) {
      player.pounding = false;
      points *= 2;
      popupText = `TUP! ${popupText}`;
    }
    enemy.hp -= 1;
    enemy.hitPause = enemy.boss ? 56 : 44;
    enemy.pooped = false;
    if (enemy.boss) {
      enemy.ai = 'recover';
      enemy.aiTimer = 24;
    }
    game.guide.enemyResolved = true;
    player.stompChain = (player.stompChain || 0) + 1;
    const multiplier = Math.min(4, player.stompChain);
    game.hitStop = enemy.boss ? 8 : 4;
    audio.cue(enemy.boss ? 'bossHit' : 'stomp');
    triggerShake(enemy.boss ? 6 : 3, 8);
    emitSpark(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, color, enemy.boss ? 16 : 12);
    popup(enemy.x - game.cameraX + enemy.w / 2, enemy.y - 8, multiplier > 1 ? `${popupText} x${multiplier}` : popupText, color);
    if (multiplier > 1) audio.tone(600 + multiplier * 120, 0.08, 'triangle', 0.1, 900 + multiplier * 160, 0.04);
    game.score += points * multiplier;
    saveHiScore();
    if (enemy.hp <= 0) {
      p3Disenchant(enemy);
      game.defeated.push({
        kind: enemy.kind,
        sprite: enemy.kind === 'hopper' ? HOP_1 : CAT_1,
        x: enemy.x,
        y: enemy.y,
        w: enemy.w,
        h: enemy.h,
        scale: PIXEL * enemy.scale,
        flip: enemy.facingLeft,
        vx: (player.x < enemy.x ? 1.6 : -1.6),
        vy: -5.5,
        rot: 0,
        spin: player.x < enemy.x ? 0.14 : -0.14
      });
    }
    if (enemy.hp <= 0 && enemy.boss) {
      game.guide.bossResolved = true;
      game.score += 500;
      saveHiScore();
      popup(enemy.x - game.cameraX + enemy.w / 2, enemy.y - 24, 'BOSS +500!', '#FFD700');
      emitSpark(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, '#CC66FF', 26);
      setFlash('rgba(255,240,180,0.35)', 0.35);
      audio.cue('bossDown');
      setNotice('Grzybowy Król odczarowany! Ścieżka wolna.', '#FFE082', 220, 4, 'BRAWO');
    }
  }

  function updateEnemyContact() {
    const player = game.player;
    for (const enemy of game.enemies) {
      if (enemy.hp <= 0) continue;
      if (enemy.hitPause > 0 && !enemy.pooped) continue;
      if (!overlap(player.x + 4, player.y + 4, PLAYER_W - 8, PLAYER_H - 8, enemy.x, enemy.y, enemy.w, enemy.h)) continue;
      const falling = player.vy > 0.8 && player.y + PLAYER_H < enemy.y + enemy.h * 0.6;
      if (enemy.kind === 'sleeper' && !enemy.pooped && enemy.sleepState !== 'chase') {
        if (falling) {
          player.vy = -10;
          player.airJumps = 1;
          player.coyote = 0;
          stompEnemy(enemy, 150, 'DOBRANOC +150', '#C8B8FF');
          return;
        }
        if (player.sneaking && enemy.sleepState === 'asleep') {
          if (!enemy.snuck) {
            enemy.snuck = true;
            game.score += 50;
            saveHiScore();
            popup(enemy.x - game.cameraX + enemy.w / 2, enemy.y - 18, 'CICHUTKO +50', '#D8CCFF');
            audio.cue('sneak');
          }
          continue;
        }
        if (enemy.sleepState === 'asleep' || enemy.sleepState === 'yawn') wakeSleeper(enemy);
        player.vx = player.x < enemy.x ? -3 : 3;
        continue;
      }

      if (enemy.pooped) {
        if (falling) {
          player.vy = -10;
          player.airJumps = 1;
          player.coyote = 0;
          stompEnemy(enemy, enemy.boss ? 250 : 100, enemy.boss ? '+250' : '+100', '#FFF2A8');
          return;
        }
        continue;
      }

      if (enemy.boss && player.dash > 0) {
        player.dash = 0;
        player.vx = player.x < enemy.x ? -5 : 5;
        player.vy = -6;
        if (!game.guide.bossDashShown) {
          game.guide.bossDashShown = true;
          setNotice('Król jest za duży na zryw – skacz mu na kapelusz!', '#FFB5B5', 180, 3, 'HMM');
        }
        continue;
      }

      if (player.rolling) {
        player.vy = -7;
        player.vx *= 0.96;
        stompEnemy(enemy, enemy.boss ? 160 : 80, 'TARAN!', '#FFD700');
        return;
      }

      if (enemy.kind === 'hedgehog' && !player.pounding) {
        if (player.invul <= 0) damagePlayer('jez');
        player.vy = -7;
        return;
      }

      if (falling) {
        player.vy = -10;
        player.airJumps = 1;
        player.coyote = 0;
        stompEnemy(enemy, enemy.boss ? 200 : 50, `+${enemy.boss ? 200 : 50}`, '#FFB347');
        return;
      }

      damagePlayer('persi');
      return;
    }
  }

  function updateBullets() {
    game.bullets = game.bullets.filter((bullet) => {
      bullet.x += bullet.vx;
      bullet.y += bullet.vy;
      bullet.vy += 0.34;

      if (bullet.y - bullet.radius > BASE_H + 40 || bullet.x + bullet.radius < 0 || bullet.x - bullet.radius > game.level.worldWidth) {
        return false;
      }

      for (const platform of game.platforms) {
        if (platform.gone) continue;
        if (overlap(bullet.x - bullet.radius, bullet.y - bullet.radius, bullet.radius * 2, bullet.radius * 2, platform.x, platform.y, platform.w, TILE)) {
          emitSpark(bullet.x, bullet.y, '#8B5A2B', 5);
          return false;
        }
      }

      for (const enemy of game.enemies) {
        if (enemy.pooped || enemy.hp <= 0) continue;
        if (overlap(bullet.x - bullet.radius, bullet.y - bullet.radius, bullet.radius * 2, bullet.radius * 2, enemy.x, enemy.y, enemy.w, enemy.h)) {
          enemy.pooped = true;
          enemy.poopTimer = enemy.boss ? 140 : 180;
          enemy.hitPause = 12;
          game.guide.enemyResolved = true;
          audio.cue('splat');
          audio.cue('meow');
          emitSpark(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, '#FFD95A', 10);
          popup(enemy.x - game.cameraX + enemy.w / 2, enemy.y - 8, 'BOBEK!', '#FFF2A8');
          setNotice('Ogłuszony! Wskocz mu na głowę za +100.', '#FFF2A8', 140, 2, 'TRAFIONY');
          return false;
        }
      }

      return true;
    });
  }

  function collectPickup(item) {
    item.taken = true;
    const stats = game.stats;
    const cx = item.x + 12;
    const cy = item.y + 14;
    let points = 0;
    switch (item.kind) {
      case 'carrot':
      case 'golden': {
        const golden = item.kind === 'golden';
        points = golden ? 50 : 10;
        game.ammo = Math.min(MAX_AMMO, game.ammo + (golden ? 2 : 1));
        audio.cue(golden ? 'golden' : 'collect', { streak: game.pickupStreakTimer > 0 ? game.pickupStreak + 1 : 1 });
        emitSpark(cx, cy, golden ? '#FFD700' : '#FFE680', golden ? 14 : 8);
        if (stats) stats.carrots += 1;
        game.pickupStreak = game.pickupStreakTimer > 0 ? game.pickupStreak + 1 : 1;
        game.pickupStreakTimer = 70;
        if (game.pickupStreak >= 3) {
          const bonus = 5 * game.pickupStreak;
          points += bonus;
          popup(cx - game.cameraX, cy - 22, `SERIA x${game.pickupStreak}!`, '#FFB347');
        }
        if (!game.guide.ammoIntroShown) {
          game.guide.ammoIntroShown = true;
          setNotice('Żołędzie to punkty – a Puszkowi dają bobki do rzucania.', '#FFE082', 170, 2, 'AMUNICJA');
        }
        break;
      }
      case 'diamond':
        points = 100;
        audio.cue('diamond');
        emitSpark(cx, cy, '#67B8FF', 16);
        if (stats) {
          stats.diamonds += 1;
          if (stats.diamonds === stats.diamondsTotal) {
            setNotice('Wszystkie słoiki ze świetlikami!', '#9AD8FF', 160, 3, '★ GWIAZDKA');
          }
        }
        break;
      case 'lettuce':
        points = 75;
        game.player.powerFrames = 60 * 8;
        game.guide.powerIntroShown = true;
        audio.cue('power');
        triggerShake(3, 8);
        emitSpark(cx, cy, '#E8FF8B', 20);
        popup(cx - game.cameraX, cy - 18, 'SUPER MOC!', '#E8FF8B');
        setNotice('Turbo! Skaczesz wyżej, a rozpędzony wpadasz we wrogów jak taran.', '#E8FF8B', 260, 3, 'TURBO-MARCHEW');
        break;
      case 'magnet':
        points = 25;
        game.magnet = 60 * 9;
        audio.cue('power');
        emitSpark(cx, cy, '#FF8A9A', 14);
        setNotice('Żołędzie same lecą do ciebie przez 9 sekund!', '#FFC8D0', 180, 3, 'MAGNES');
        break;
      case 'bubble':
        points = 25;
        game.player.bubble = 60 * 14;
        audio.cue('power');
        emitSpark(cx, cy, '#A8E0FF', 14);
        setNotice('Bańka obroni cię przed jednym trafieniem.', '#C8ECFF', 180, 3, 'BAŃKA');
        break;
      case 'heart':
        if (game.lives < MAX_LIVES) {
          game.lives += 1;
          audio.cue('heart');
          emitSpark(cx, cy, '#FF6666', 10);
          popup(cx - game.cameraX, item.y, '+1 SERCE', '#FF6666');
          return;
        }
        points = 25;
        audio.cue('collect');
        emitSpark(cx, cy, '#FF9999', 10);
        break;
    }
    game.score += points;
    saveHiScore();
    popup(cx - game.cameraX, item.y, `+${points}`);
  }

  function updatePickups() {
    const player = game.player;
    const pcx = player.x + PLAYER_W / 2;
    const pcy = player.y + PLAYER_H / 2;
    for (const item of game.pickups) {
      if (item.taken) continue;
      const icx = item.x + 12;
      const icy = item.y + 14;
      const dist = distance(pcx, pcy, icx, icy);
      const reach = game.magnet > 0 ? 240 : 56;
      if (dist < reach && dist > 1) {
        const pull = Math.min(1, (game.magnet > 0 ? 9 : 3.4) / dist);
        item.x += (pcx - icx) * pull;
        item.y += (pcy - icy) * pull;
      }
      const itemHeight = item.kind === 'heart' ? 7 * PIXEL : 10 * PIXEL;
      if (!overlap(player.x + 8, player.y + 8, PLAYER_W - 16, PLAYER_H - 16, item.x, item.y, 8 * PIXEL, itemHeight)) continue;
      collectPickup(item);
    }
  }

  function updateSpikes() {
    const player = game.player;
    for (const spike of game.spikes) {
      if (overlap(player.x + 4, player.y + 8, PLAYER_W - 8, PLAYER_H - 10, spike.x, spike.y, 8 * PIXEL, 5 * PIXEL)) {
        damagePlayer('kolce');
        return;
      }
    }
  }

  function updateCheckpoint() {
    if (!game.checkpoint || game.checkpointActive) return;
    const checkpointX = game.checkpoint.x + 10;
    const checkpointY = game.checkpoint.y + 20;
    const playerX = game.player.x + PLAYER_W / 2;
    const playerY = game.player.y + PLAYER_H / 2;
    if (Math.abs(playerX - checkpointX) < 24 && Math.abs(playerY - checkpointY) < 32) {
      game.checkpointActive = true;
      game.guide.checkpointResolved = true;
      game.respawnX = game.checkpoint.respawnX || game.checkpoint.x - 12;
      game.respawnY = game.checkpoint.respawnY || (game.checkpoint.y + TILE - PLAYER_H);
      audio.cue('checkpoint');
      emitSpark(game.checkpoint.x + 8, game.checkpoint.y + 10, '#FFD700', 16);
      popup(game.checkpoint.x - game.cameraX + 6, game.checkpoint.y - 12, 'CHECKPOINT!', '#FFD700');
      setNotice('Flaga zapamiętała postęp.', '#FFD700', 170, 3, 'CHECKPOINT');
    }
  }

  function updateSecrets() {
    const player = game.player;
    for (const secret of game.secrets) {
      if (secret.found) continue;
      if (!overlap(player.x + 4, player.y + 6, PLAYER_W - 8, PLAYER_H - 12, secret.x, secret.y, secret.w, secret.h)) continue;
      secret.found = true;
      game.guide.secretResolved = true;
      if (game.stats) game.stats.secrets += 1;
      audio.cue('secret');
      triggerShake(5, 14);
      game.hitStop = 6;
      setFlash('rgba(255,230,130,0.24)', 0.24);
      emitSpark(secret.x + secret.w / 2, secret.y + secret.h / 2, '#FFE680', 26);
      const names = [];
      secret.rewards.forEach((kind, index) => {
        applySecretReward(kind);
        names.push(rewardLabel(kind).toLowerCase());
        popup(secret.x - game.cameraX + secret.w / 2 + (index - (secret.rewards.length - 1) / 2) * 60, secret.y - 34, rewardLabel(kind), rewardGlow(kind));
      });
      popup(secret.x - game.cameraX + secret.w / 2, secret.y - 12, secret.text, '#FFE680');
      setNotice(`Sekretna skrytka! W środku: ${names.join(' i ')}.`, '#FFE680', 210, 3, 'SEKRET');
      return;
    }
  }

  function updateGuidePrompts() {
    const onScreen = (enemy) => enemy.x + enemy.w > game.cameraX + 80 && enemy.x < game.cameraX + BASE_W - 60;
    if (!game.guide.enemyIntroShown && game.enemies.some((enemy) => !enemy.boss && onScreen(enemy))) {
      game.guide.enemyIntroShown = true;
      setNotice('Zaczarowany muchomorek! Wskocz mu na głowę – odczarujesz go.', '#FFD6B8', 200, 2, 'UWAGA');
    }
    if (!game.guide.hopperIntroShown && game.enemies.some((enemy) => enemy.kind === 'hopper' && onScreen(enemy))) {
      game.guide.hopperIntroShown = true;
      setNotice('Żabka skacze. Przebiegnij pod nią, gdy jest w górze.', '#D9E2FF', 200, 2, 'SKOCZEK');
    }

    if (!game.guide.sleeperIntroShown && game.enemies.some((enemy) => enemy.kind === 'sleeper' && enemy.sleepState === 'asleep' && onScreen(enemy))) {
      game.guide.sleeperIntroShown = true;
      setNotice(SHOW_TOUCH_UI ? 'Śpiący Persi. Przejdź obok, trzymając ▼ – albo wskocz mu na głowę.' : 'Śpiący Persi. Przejdź obok, trzymając ↓ (S) – albo wskocz mu na głowę.', '#D8CCFF', 260, 2, 'CICHO…');
    }
    if (game.checkpoint && !game.checkpointActive && !game.guide.checkpointIntroShown) {
      const checkpointX = game.checkpoint.x - game.cameraX;
      if (checkpointX > 100 && checkpointX < BASE_W - 140) {
        game.guide.checkpointIntroShown = true;
        setNotice('Dotknij flagi – zapamięta, dokąd doszedłeś.', '#FFE082', 180, 2, 'FLAGA');
      }
    }

    if (!game.guide.secretIntroShown) {
      const visibleSecret = game.secrets.find((secret) => !secret.found && secret.x - game.cameraX > 140 && secret.x - game.cameraX < BASE_W - 100);
      if (visibleSecret) {
        game.guide.secretIntroShown = true;
        setNotice('Pęknięty blok? Wbiegnij w niego – coś tam jest!', '#FFE6B8', 180, 2, 'SEKRET');
      }
    }

    if (game.level.isBoss && game.enemies.length > 0 && !game.guide.bossIntroShown) {
      game.guide.bossIntroShown = true;
      setNotice('Gdy pojawi się „!”, szykuje szarżę. Przeskocz go i wskocz mu na głowę 3 razy.', '#FFB5B5', 260, 4, 'FINAŁ');
    }
  }

  function updateCamera() {
    const player = game.player;
    const wanted = Math.abs(player.vx) > 0.6 ? (player.vx > 0 ? 70 : -70) : game.lookahead * 0.98;
    game.lookahead = lerp(game.lookahead, wanted, 0.035);
    const target = player.x - BASE_W * 0.38 + game.lookahead;
    game.cameraX = lerp(game.cameraX, target, 0.1);
    if (game.level.chase) game.cameraX = Math.max(game.cameraX, game.chaseX - 80);
    game.cameraX = clamp(game.cameraX, 0, game.level.worldWidth - BASE_W);
  }

  function tryFinishLevel() {
    if (game.celebrate > 0) return;
    if (game.level.isBoss && game.enemies.length > 0) return;
    const exitX = game.level.exitX + TILE / 2;
    const exitY = BASE_H - TILE - TILE;
    const player = game.player;
    if (distance(player.x + PLAYER_W / 2, player.y + PLAYER_H / 2, exitX, exitY) >= TILE * 1.6) return;
    game.celebrate = 66;
    game.binkyY = 0;
    player.vx = 0;
    player.pounding = false;
    input.resetAll();
    audio.cue('level');
  }

  function updateCelebrate() {
    game.celebrate -= 1;
    const k = 1 - game.celebrate / 66;
    const air = clamp(k / 0.7, 0, 1);
    game.binkyY = k < 0.7 ? -Math.sin(air * Math.PI) * 78 : 0;
    const player = game.player;
    if (game.celebrate === 40 || game.celebrate === 34) player.facingLeft = !player.facingLeft;
    if (game.celebrate % 5 === 0 && k < 0.75) {
      emitSpark(player.x + PLAYER_W / 2, player.y + PLAYER_H / 2 + game.binkyY, ['#FFD94A', '#FF9CCF', '#FFFFFF', '#9AD8FF'][game.celebrate % 4], 4);
    }
    if (game.celebrate === 18) {
      player.squash = 0.18;
      emitDust(player.x + PLAYER_W / 2, player.y + PLAYER_H - 4, 10);
    }
    if (game.celebrate <= 0) {
      game.binkyY = 0;
      finishLevelNow();
    }
  }

  function finishLevelNow() {
    const stats = game.stats;
    const earned = [
      true,
      stats.diamondsTotal === 0 || stats.diamonds >= stats.diamondsTotal,
      stats.heartsLost === 0
    ];
    const stars = earned.filter(Boolean).length;
    const seconds = game.levelFrames / 60;
    const idx = String(game.levelIndex);
    const previousStars = Number(game.progress.s[idx]) || 0;
    const previousTime = Number(game.progress.t[idx]) || 0;
    if (stars > previousStars) game.progress.s[idx] = stars;
    if (!previousTime || seconds < previousTime) game.progress.t[idx] = Math.round(seconds * 10) / 10;
    game.progress.u = Math.max(Number(game.progress.u) || 0, Math.min(LEVELS.length - 1, game.levelIndex + 1));
    saveProgress();
    game.lastClear = {
      earned,
      stars,
      seconds,
      newBestStars: stars > previousStars && previousStars > 0,
      newBestTime: previousTime > 0 && seconds < previousTime,
      carrots: stats.carrots,
      carrotsTotal: stats.carrotsTotal,
      diamonds: stats.diamonds,
      diamondsTotal: stats.diamondsTotal,
      heartsLost: stats.heartsLost
    };
    saveHiScore();
    spawnConfetti(70);
    setScene('LEVEL_CLEAR');
    input.resetAll();
  }

  function forEachRepeat(parallax, spacing, fn) {
    const offset = game.cameraX * parallax;
    const first = Math.floor((offset - 180) / spacing);
    const last = Math.ceil((offset + BASE_W + 180) / spacing);
    for (let index = first; index <= last; index += 1) {
      const x = index * spacing - offset + (hash01(index * 3.7 + spacing) - 0.5) * spacing * 0.5;
      fn(x, index);
    }
  }

  function drawHillLayer(color, offset, baseY, amp, freq, seed) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, BASE_H);
    for (let x = 0; x <= BASE_W + 8; x += 8) {
      const wx = x + offset;
      const y = baseY + Math.sin(wx * freq + seed) * amp + Math.sin(wx * freq * 2.7 + seed * 2) * amp * 0.35;
      ctx.lineTo(x, Math.round(y / 3) * 3);
    }
    ctx.lineTo(BASE_W + 8, BASE_H);
    ctx.closePath();
    ctx.fill();
  }

  function drawRoundTree(x, baseY, s, th, seed) {
    ctx.fillStyle = th.trunk;
    ctx.fillRect(Math.round(x - 4 * s), Math.round(baseY - 46 * s), Math.max(3, Math.round(8 * s)), Math.round(46 * s) + 60);
    ctx.fillStyle = th.leaf;
    fillCircle(x, baseY - 64 * s, 28 * s);
    fillCircle(x - 22 * s, baseY - 46 * s, 20 * s);
    fillCircle(x + 22 * s, baseY - 48 * s, 21 * s);
    ctx.fillStyle = th.leafHi;
    fillCircle(x - 9 * s, baseY - 74 * s, 11 * s);
    fillCircle(x + 14 * s, baseY - 58 * s, 6 * s);
    if (th.fruit) {
      ctx.fillStyle = th.fruit;
      for (let k = 0; k < 4; k += 1) {
        ctx.fillRect(Math.round(x + (hash01(seed * 7 + k) - 0.5) * 44 * s), Math.round(baseY - 40 * s - hash01(seed * 3 + k * 5) * 36 * s), 4, 5);
      }
    }
  }

  function drawPine(x, baseY, s, color, trunk) {
    ctx.fillStyle = trunk;
    ctx.fillRect(Math.round(x - 3 * s), Math.round(baseY - 22 * s), Math.max(3, Math.round(6 * s)), Math.round(22 * s) + 60);
    ctx.fillStyle = color;
    for (let k = 0; k < 3; k += 1) {
      const halfW = (32 - k * 8) * s;
      const yb = baseY - 18 * s - k * 22 * s;
      ctx.beginPath();
      ctx.moveTo(x - halfW, yb);
      ctx.lineTo(x + halfW, yb);
      ctx.lineTo(x, yb - 36 * s);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawTower(x, baseY, s, color, lit, seed) {
    const w = 46 * s;
    const h = (130 + hash01(seed) * 60) * s;
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x - w / 2), Math.round(baseY - h), Math.round(w), Math.round(h) + 80);
    for (let k = 0; k < 4; k += 1) {
      ctx.fillRect(Math.round(x - w / 2 + k * (w / 3.4)), Math.round(baseY - h - 10 * s), Math.round(w / 7), Math.round(10 * s));
    }
    if (hash01(seed + 4) > 0.5) {
      ctx.beginPath();
      ctx.moveTo(x - w / 2 - 4 * s, baseY - h - 10 * s);
      ctx.lineTo(x + w / 2 + 4 * s, baseY - h - 10 * s);
      ctx.lineTo(x, baseY - h - 56 * s);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = lit;
    ctx.fillRect(Math.round(x - 4 * s), Math.round(baseY - h * 0.72), Math.round(8 * s), Math.round(13 * s));
    if (hash01(seed + 9) > 0.4) ctx.fillRect(Math.round(x - 4 * s), Math.round(baseY - h * 0.42), Math.round(8 * s), Math.round(13 * s));
  }

  function drawBush(x, baseY, s, color) {
    ctx.fillStyle = color;
    fillCircle(x, baseY - 14 * s, 18 * s);
    fillCircle(x - 18 * s, baseY - 6 * s, 14 * s);
    fillCircle(x + 18 * s, baseY - 8 * s, 15 * s);
    ctx.fillRect(Math.round(x - 32 * s), Math.round(baseY - 6 * s), Math.round(64 * s), Math.round(40 * s));
  }

  function drawBackground() {
    drawSceneryBackdrop(theme(), game.cameraX, game.frame);
  }

  function drawWater() {
    drawWaterPixel();
  }

  function drawStoneBody(sx, w, x0, x1, top, bottom, th) {
    ctx.fillStyle = th.stone;
    ctx.fillRect(x0, top, x1 - x0, bottom - top);
    ctx.fillStyle = th.dirtDark;
    let row = 0;
    for (let y = top + 10; y < bottom + 12; y += 12, row += 1) {
      if (y < bottom) ctx.fillRect(x0, y, x1 - x0, 2);
      const shift = row % 2 ? 14 : 0;
      const startW = Math.floor((x0 + game.cameraX - shift) / 28) * 28 + shift;
      for (let wx = startW; wx < x1 + game.cameraX; wx += 28) {
        const xx = wx - game.cameraX;
        if (xx > sx + 2 && xx < sx + w - 2) ctx.fillRect(Math.round(xx), y - 10, 2, Math.min(10, bottom - (y - 10)));
      }
    }
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.fillRect(x0, top, x1 - x0, 2);
  }

  function drawGrassTop(sx, w, x0, x1, top, th, flowers) {
    ctx.fillStyle = th.grassDark;
    ctx.fillRect(x0, top + 5, x1 - x0, 4);
    ctx.fillStyle = th.grass;
    ctx.fillRect(x0, top, x1 - x0, 7);
    ctx.fillStyle = th.grassHi;
    ctx.fillRect(x0, top, x1 - x0, 2);
    const startW = Math.floor((x0 + game.cameraX) / 6) * 6;
    for (let wx = startW; wx < x1 + game.cameraX; wx += 6) {
      const xx = wx - game.cameraX;
      if (xx < sx + 2 || xx > sx + w - 4) continue;
      const h = hash01(wx * 1.13);
      if (h > 0.55) {
        ctx.fillStyle = th.grass;
        const tall = h > 0.86 ? 3 : 0;
        ctx.fillRect(Math.round(xx), top - 2 - tall, 2, 3 + tall);
      }
      if (flowers && h > 0.94) {
        ctx.fillStyle = th.grassDark;
        ctx.fillRect(Math.round(xx) + 1, top - 7, 1, 6);
        ctx.fillStyle = hash01(wx * 0.7) > 0.5 ? '#FFE36E' : '#FF9CCF';
        ctx.fillRect(Math.round(xx), top - 9, 3, 3);
      }
    }
    ctx.fillStyle = th.grass;
    if (sx > x0 - 2) ctx.fillRect(Math.round(sx) - 2, top + 1, 3, 6);
    if (sx + w < x1 + 2) ctx.fillRect(Math.round(sx + w) - 1, top + 1, 3, 6);
  }

  function drawGroundBlock(platform, sx, th) {
    const top = platform.y;
    const bottom = BASE_H;
    const x0 = Math.max(Math.round(sx), -8);
    const x1 = Math.min(Math.round(sx + platform.w), BASE_W + 8);
    if (th.stoneBlocks) {
      drawStoneBody(sx, platform.w, x0, x1, top + 4, bottom, th);
    } else {
      ctx.fillStyle = th.dirt;
      ctx.fillRect(x0, top + 6, x1 - x0, bottom - top - 6);
      const startW = Math.floor((x0 + game.cameraX) / 17) * 17;
      for (let wx = startW; wx < x1 + game.cameraX; wx += 17) {
        const h = hash01(wx * 0.37);
        if (h < 0.45) continue;
        const xx = wx - game.cameraX + Math.floor(hash01(wx) * 8);
        if (xx < sx + 2 || xx > sx + platform.w - 8) continue;
        const yy = top + 12 + Math.floor(hash01(wx + 5) * Math.max(1, bottom - top - 16));
        ctx.fillStyle = h > 0.82 ? th.stone : th.dirtDark;
        ctx.fillRect(Math.round(xx), yy, h > 0.7 ? 6 : 4, 3);
      }
    }
    drawGrassTop(sx, platform.w, x0, x1, top, th, !th.stoneBlocks);
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    if (sx > -4) ctx.fillRect(Math.round(sx), top + 8, 3, bottom - top);
    if (sx + platform.w < BASE_W + 4) ctx.fillRect(Math.round(sx + platform.w) - 3, top + 8, 3, bottom - top);
  }

  function drawFloatingPlatform(platform, sx, th) {
    const top = platform.y;
    const w = platform.w;
    const x0 = Math.round(sx);
    const x1 = Math.round(sx + w);
    if (th.stoneBlocks) {
      drawStoneBody(sx, w, x0, x1, top + 3, top + TILE, th);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(x0, top + TILE - 3, x1 - x0, 3);
    } else {
      ctx.fillStyle = th.dirt;
      ctx.fillRect(x0 + 2, top + 6, w - 4, TILE - 8);
      for (let x = 6; x < w - 10; x += 12) {
        const k = hash01(platform.baseX + x);
        ctx.fillRect(x0 + x, top + TILE - 2, 8, 3 + Math.floor(k * 5));
      }
      ctx.fillStyle = th.dirtDark;
      ctx.fillRect(x0 + 2, top + TILE - 5, w - 4, 3);
      for (let x = 10; x < w - 10; x += 22) {
        if (hash01(platform.baseX * 0.3 + x) > 0.5) ctx.fillRect(x0 + x, top + 12, 5, 3);
      }
      ctx.fillStyle = 'rgba(70,40,20,0.6)';
      for (let x = 14; x < w - 10; x += 30) {
        const len = 4 + Math.floor(hash01(platform.baseX + x * 2) * 8);
        ctx.fillRect(x0 + x, top + TILE, 2, len);
      }
    }
    drawGrassTop(sx, w, x0, x1, top, th, false);
  }

  function drawCloudPlatform(platform, sx) {
    const top = platform.y;
    const w = platform.w;
    ctx.fillStyle = '#C6DBF2';
    for (let x = 8; x <= w - 8; x += 15) fillCircle(sx + x, top + 15, 10);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(Math.round(sx) + 4, top + 2, w - 8, 12);
    for (let x = 10; x <= w - 10; x += 17) fillCircle(sx + x, top + 6, 9);
    ctx.fillStyle = '#EAF4FF';
    ctx.fillRect(Math.round(sx) + 6, top + 12, w - 12, 3);
  }

  function drawMovingPlatform(platform, sx) {
    const top = platform.y;
    const w = platform.w;
    const x0 = Math.round(sx);
    ctx.strokeStyle = 'rgba(80,55,30,0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x0 + 8, top);
    ctx.lineTo(x0 + 8 - Math.sin(platform.phase) * 6, 0);
    ctx.moveTo(x0 + w - 8, top);
    ctx.lineTo(x0 + w - 8 - Math.sin(platform.phase) * 6, 0);
    ctx.stroke();
    ctx.fillStyle = '#5E3A1C';
    ctx.fillRect(x0, top + 4, w, 14);
    ctx.fillStyle = '#A8733D';
    ctx.fillRect(x0, top, w, 13);
    ctx.fillStyle = '#C99256';
    ctx.fillRect(x0, top, w, 3);
    ctx.fillStyle = '#6B4220';
    for (let x = 24; x < w - 4; x += 24) ctx.fillRect(x0 + x, top + 2, 2, 11);
    ctx.fillStyle = '#3A2A1A';
    for (let x = 6; x < w - 4; x += 24) {
      ctx.fillRect(x0 + x, top + 5, 2, 2);
      ctx.fillRect(x0 + x + 12, top + 9, 2, 2);
    }
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    const mid = top + 22;
    ctx.beginPath();
    ctx.moveTo(x0 + 4, mid); ctx.lineTo(x0 + 10, mid - 4); ctx.lineTo(x0 + 10, mid + 4); ctx.closePath();
    ctx.moveTo(x0 + w - 4, mid); ctx.lineTo(x0 + w - 10, mid - 4); ctx.lineTo(x0 + w - 10, mid + 4); ctx.closePath();
    ctx.fill();
  }

  function drawPlatforms() {
    const th = theme();
    for (const p of game.platforms) {
      if (p.gone) continue;
      const sx = p.x - game.cameraX;
      if (sx + p.w < -40 || sx > BASE_W + 40) continue;
      const art = platformArt(p, th);
      if (p.moving) {
        ctx.fillStyle = '#5E3A1C';
        const sway = snap(Math.sin(p.phase) * 6);
        for (const rx of [8, p.w - 10]) {
          for (let ry = 0; ry < p.y; ry += 4) {
            const k = 1 - ry / p.y;
            ctx.fillRect(snap(sx + rx - sway * k), ry, 2, 4);
          }
        }
      }
      const shake = p.pstate === 'shake' ? (Math.floor(game.frame / 2) % 2 ? 2 : -2) : 0;
      if (p.fade < 1) ctx.globalAlpha = p.fade;
      ctx.drawImage(art.canvas, snap(sx) - art.ox + shake, snap(p.y) - art.oy, art.canvas.width * ART, art.canvas.height * ART);
      ctx.globalAlpha = 1;
      if (p.kind === 'lily' && p.sink > 12 && game.frame % 10 < 6) {
        ctx.fillStyle = '#D6F0FF';
        for (let k = 0; k < 4; k += 1) ctx.fillRect(snap(sx + 4 + k * 12 + (game.frame % 3) * 2), snap(p.y - 4 - (k % 2) * 4), 2, 2);
      }
      if (p.pstate === 'shake' && game.frame % 4 === 0) {
        game.particles.push({ x: p.x + Math.random() * p.w, y: p.y + 20, vx: 0, vy: 1, color: p.kind === 'log' ? '#6E4424' : theme().stone, life: 16, size: 2 });
      }
    }
  }

  function drawSecrets() {
    const th = theme();
    for (const secret of game.secrets) {
      const x = Math.round(secret.x - game.cameraX);
      if (x + secret.w < -10 || x > BASE_W + 10) continue;
      if (secret.found) {
        ctx.fillStyle = 'rgba(20,12,6,0.35)';
        ctx.fillRect(x + 4, secret.y + 8, secret.w - 8, secret.h - 8);
        continue;
      }
      ctx.fillStyle = th.stone;
      ctx.fillRect(x, secret.y, secret.w, secret.h);
      ctx.fillStyle = th.dirtDark;
      ctx.fillRect(x, secret.y + 15, secret.w, 2);
      ctx.fillRect(x, secret.y + 31, secret.w, 2);
      ctx.fillRect(x + 12, secret.y, 2, 15);
      ctx.fillRect(x + 6, secret.y + 17, 2, 14);
      ctx.fillStyle = '#2A1A10';
      ctx.fillRect(x + 8, secret.y + 4, 2, 6);
      ctx.fillRect(x + 10, secret.y + 9, 2, 8);
      ctx.fillRect(x + 12, secret.y + 16, 2, 6);
      ctx.fillRect(x + 15, secret.y + 21, 2, 9);
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.fillRect(x, secret.y, secret.w, 2);
      const t = (game.frame + secret.x) % 110;
      if (t < 24) {
        const a = Math.sin(t / 24 * Math.PI);
        ctx.fillStyle = `rgba(255,236,150,${a.toFixed(2)})`;
        const sx = x + secret.w / 2 + 4;
        const sy = secret.y + 10;
        ctx.fillRect(sx - 1, sy - 5, 2, 10);
        ctx.fillRect(sx - 5, sy - 1, 10, 2);
      }
    }
  }

  function drawCheckpoint() {
    if (!game.checkpoint) return;
    const x = snap(game.checkpoint.x - game.cameraX);
    const y = game.checkpoint.y;
    if (x < -60 || x > BASE_W + 60) return;
    const active = game.checkpointActive;
    ctx.fillStyle = '#2A2238';
    ctx.fillRect(x - 8, y - 8, 20, 8);
    ctx.fillStyle = '#7E7890';
    ctx.fillRect(x - 6, y - 8, 16, 6);
    ctx.fillStyle = '#A8A2B8';
    ctx.fillRect(x - 6, y - 8, 16, 2);
    ctx.fillStyle = '#2A1A10';
    ctx.fillRect(x - 2, y - 60, 8, 54);
    ctx.fillStyle = '#8A5A30';
    ctx.fillRect(x, y - 58, 4, 52);
    ctx.fillStyle = '#C08A50';
    ctx.fillRect(x, y - 58, 2, 52);
    ctx.fillStyle = active ? '#FFE082' : '#D0D6E2';
    ctx.fillRect(x - 2, y - 64, 8, 6);
    const cloth = active ? ['#FF9C4A', '#E06A2A', '#FFC07A'] : ['#9FB0C8', '#7A8AA6', '#C6D2E4'];
    const wave = game.frame * 0.16;
    for (let i = 0; i < 9; i += 1) {
      const off = snap(Math.sin(wave - i * 0.7) * 2 * (i / 8) + 1);
      const height = 22 - Math.floor(i * 0.9) * 2;
      const cx = x + 4 + i * 4;
      ctx.fillStyle = '#2A1A10';
      ctx.fillRect(cx, y - 58 + off, 4, height + 2);
      ctx.fillStyle = cloth[(i + Math.floor(game.frame / 12)) % 3 === 0 ? 2 : i % 2];
      ctx.fillRect(cx, y - 56 + off, 4, height - 2);
    }
    if (active) {
      drawItemArt('carrot', x + 12, y - 54, 1);
      for (let index = 0; index < 4; index += 1) {
        const a = game.frame * 0.05 + index * 1.57;
        ctx.fillStyle = index % 2 ? '#FFFFFF' : '#FFE680';
        ctx.fillRect(snap(x + 18 + Math.cos(a) * 30), snap(y - 44 + Math.sin(a) * 20), 2, 2);
      }
    }
  }

  function drawPortal() {
    if (game.level.isBoss && game.enemies.length > 0) return;
    const cx = snap(game.level.exitX - game.cameraX + TILE / 2);
    const groundY = BASE_H - TILE;
    const cy = groundY - 36;
    if (cx < -100 || cx > BASE_W + 100) return;
    const t = game.portalTick;
    for (let y = -32; y < 32; y += 2) {
      const half = snap(20 * Math.sqrt(Math.max(0, 1 - (y / 32) * (y / 32))));
      const k = Math.abs(y) / 32;
      ctx.fillStyle = k < 0.35 ? '#F6E8FF' : k < 0.6 ? '#C8A2FF' : k < 0.82 ? '#8A5CE8' : '#4E2CA8';
      const swirl = snap(Math.sin(t * 0.08 + y * 0.2) * 2);
      ctx.fillRect(cx - half + swirl, cy + y, half * 2, 2);
    }
    for (let ring = 0; ring < 2; ring += 1) {
      const rx = 26 + ring * 8;
      const ry = 38 + ring * 8;
      const dir = ring ? -1 : 1;
      for (let k = 0; k < 28; k += 1) {
        if ((k + Math.floor(t / 4)) % 3 === 0) continue;
        const a = k / 28 * Math.PI * 2 + t * 0.03 * dir;
        ctx.fillStyle = ring ? '#B08CFF' : '#FFFFFF';
        ctx.fillRect(snap(cx + Math.cos(a) * rx) - 2, snap(cy + Math.sin(a) * ry) - 2, ring ? 2 : 4, ring ? 2 : 4);
      }
    }
    const signX = cx - 70;
    ctx.fillStyle = '#2A1A10';
    ctx.fillRect(signX + 16, groundY - 36, 8, 36);
    ctx.fillStyle = '#8A5A30';
    ctx.fillRect(signX + 18, groundY - 36, 4, 36);
    drawPanel(signX, groundY - 56, 40, 22, '#B57A40', '#E0A866', 4);
    ctx.fillStyle = '#FFF4D6';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('META', signX + 20, groundY - 40);
    ctx.textAlign = 'left';
  }

  function rabbitBlinking() {
    const player = game.player;
    if (game.frame >= player.nextBlink) {
      player.blinkUntil = game.frame + 8;
      player.nextBlink = game.frame + 150 + Math.random() * 180;
    }
    return game.frame < player.blinkUntil;
  }

  function rabbitPanicking() {
    const player = game.player;
    return !player.onGround && (player.y - player.fallStartY > 120 || player.vy > 9);
  }

  function drawPowerAura(drawX, drawY) {
    if (game.player.powerFrames <= 0) return;
    const pulse = 0.45 + Math.sin(game.frame * 0.18) * 0.18;
    ctx.fillStyle = `rgba(255,215,90,${pulse})`;
    ctx.beginPath();
    ctx.arc(drawX + PLAYER_W / 2, drawY + PLAYER_H / 2, 10 + Math.sin(game.frame * 0.2) * 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawRabbitTail(drawX, drawY) {
    const player = game.player;
    const tailBaseX = player.facingLeft ? drawX + PLAYER_W - 3 : drawX + 3;
    const tailX = tailBaseX + Math.sin(game.frame * 0.28 + (player.walking ? 0.8 : 0)) * 2;
    const tailY = drawY + 26 + (player.walking ? Math.sin(game.frame * 0.34) * 2 : 0);
    ctx.fillStyle = '#F7F7FF';
    ctx.fillRect(tailX - 4, tailY - 4, 10, 10);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(tailX - 2, tailY - 6, 8, 8);
    ctx.fillStyle = '#DDDDDD';
    ctx.fillRect(tailX + 2, tailY + 1, 4, 4);
  }

  function drawRabbitFace(drawX, drawY) {
    const player = game.player;
    const blinking = rabbitBlinking();
    const panicking = rabbitPanicking();
    const baseX = drawX + (player.facingLeft ? 11 : 15);
    const eyeY = drawY + 16;
    if (blinking) {
      ctx.fillStyle = '#666666';
      ctx.fillRect(baseX - 7, eyeY + 1, 5, 1);
      ctx.fillRect(baseX + 4, eyeY + 1, 5, 1);
      return;
    }
    if (panicking) {
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(baseX - 8, eyeY - 1, 4, 4);
      ctx.fillRect(baseX + 4, eyeY - 1, 4, 4);
      ctx.fillStyle = Q;
      ctx.fillRect(baseX - 7, eyeY, 2, 2);
      ctx.fillRect(baseX + 5, eyeY, 2, 2);
      ctx.fillStyle = QD;
      ctx.fillRect(baseX - 6, eyeY, 1, 2);
      ctx.fillRect(baseX + 6, eyeY, 1, 2);
      return;
    }
    ctx.fillStyle = Q;
    ctx.fillRect(baseX - 7, eyeY, 3, 2);
    ctx.fillRect(baseX + 4, eyeY, 3, 2);
    ctx.fillStyle = QD;
    ctx.fillRect(baseX - 6, eyeY, 1, 2);
    ctx.fillRect(baseX + 5, eyeY, 1, 2);
  }

  function updateRabbitAnim(player) {
    if (player.earA === undefined) {
      player.earA = -0.2;
      player.earV = 0;
      player.runPhase = 0;
      player.wasGround = true;
    }
    const speed = Math.abs(player.vx);
    let target = -0.12 - speed * 0.1;
    if (!player.onGround) target += clamp(player.vy * 0.07, -0.55, 0.5);
    if (player.sneaking) target = -1.05;
    if (player.pounding) target = 0.5;
    target = clamp(target, -1.1, 0.5);
    if (player.onGround && !player.wasGround) player.earV += 0.28;
    player.wasGround = player.onGround;
    player.earV += (target - player.earA) * 0.16;
    player.earV *= 0.8;
    player.earA += player.earV;
    if (player.onGround && player.walking) player.runPhase = (player.runPhase + (player.sneaking ? 0.02 : 0.035) + speed * 0.02) % 1;
    else if (player.onGround) player.runPhase = 0;
  }

  function rabbitPoseFor(player) {
    let state = 'idle';
    if (player.rolling) state = 'roll';
    else if (player.invul > 120) state = 'hurt';
    else if (game.celebrate > 0) state = game.binkyY < -2 ? 'jump' : 'idle';
    else if (!player.onGround) state = player.vy < 0 ? 'jump' : 'fall';
    else if (player.walking) state = 'run';
    let sx = clamp(1 + player.squash * 1.3, 0.85, 1.22);
    let sy = clamp(1 - player.squash * 1.3, 0.82, 1.2);
    let ear = player.earA === undefined ? -0.2 : player.earA;
    if (state === 'idle') sy *= 1 + Math.sin(game.frame * 0.07) * 0.03;
    if (state === 'jump') {
      sx *= 0.95;
      sy *= 1.05;
    }
    if (player.sneaking) {
      sx *= 1.1;
      sy *= 0.84;
    }
    if (player.pounding) {
      sx = 0.9;
      sy = 1.12;
    }
    if (game.celebrate > 0) ear = Math.sin(game.frame * 0.6) * 0.5;
    return {
      state,
      phase: player.runPhase || 0,
      ear,
      blink: game.celebrate > 0 ? false : rabbitBlinking(),
      sx,
      sy,
      roll: state === 'roll' ? (game.frame * 0.35) % (Math.PI * 2) : 0
    };
  }

  function drawPlayer() {
    const player = game.player;
    const ghost = player.invul > 0 && Math.floor(player.invul / 4) % 2 === 0;
    const drawX = snap(player.x - game.cameraX);
    const lift = game.binkyY || 0;
    const drawY = snap(player.y + lift);
    if (player.onGround || lift < 0) {
      const shrink = clamp(-lift / 100, 0, 0.6);
      ctx.fillStyle = 'rgba(20,12,40,0.25)';
      ctx.fillRect(snap(drawX + 8 + 16 * shrink), snap(player.y) + PLAYER_H - 2, snap(32 * (1 - shrink)), 4);
    }
    if (player.powerFrames > 0) {
      for (let index = 0; index < 8; index += 1) {
        const a = game.frame * 0.12 + index * Math.PI / 4;
        ctx.fillStyle = index % 2 ? '#FFF6A8' : '#E8FF8B';
        ctx.fillRect(snap(drawX + 24 + Math.cos(a) * 30) - 2, snap(drawY + 24 + Math.sin(a) * 26) - 2, 4, 4);
      }
    }
    if (player.pounding) {
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      for (let index = 0; index < 4; index += 1) ctx.fillRect(drawX + 6 + index * 12, drawY - 10 - (index % 2) * 10, 2, 14);
    }
    if (HERO === 'C') {
      drawPersiHero(player, drawX, drawY, ghost);
    } else {
      const canvasArt = buildRabbit(rabbitPoseFor(player));
      ctx.save();
      if (ghost) ctx.globalAlpha = 0.4;
      drawArtFootprint({ c: canvasArt, ox: RABBIT_CANVAS.ox, oy: RABBIT_CANVAS.oy, fw: 24, fh: 24 }, drawX, drawY, PLAYER_W, PLAYER_H, player.facingLeft);
      ctx.restore();
    }
    if (player.sneaking && game.frame % 30 < 15) {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = 'bold 12px monospace';
      ctx.fillText('ćśś', drawX + (player.facingLeft ? -18 : 46), drawY + 10);
    }

    if (game.nameTagTimer > 0 && game.playerName) {
      ctx.save();
      ctx.globalAlpha = clamp(game.nameTagTimer / 30, 0, 1);
      ctx.font = 'bold 12px monospace';
      const width = ctx.measureText(game.playerName).width;
      const cx = drawX + PLAYER_W / 2;
      drawPanel(cx - width / 2 - 8, drawY - 40, width + 16, 20, 'rgba(14,10,30,0.82)', 'rgba(255,255,255,0.28)', 4);
      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'center';
      ctx.fillText(game.playerName, cx, drawY - 26);
      ctx.fillStyle = 'rgba(14,10,30,0.82)';
      ctx.fillRect(snap(cx) - 4, drawY - 20, 8, 2);
      ctx.fillRect(snap(cx) - 2, drawY - 18, 4, 2);
      ctx.restore();
    }
  }

  function drawEnemies() {
    for (const enemy of game.enemies) {
      if (!enemy.pooped && enemy.hitPause > 0 && Math.floor(enemy.hitPause / 3) % 2 === 0) continue;
      const hopper = enemy.kind === 'hopper';
      const grounded = enemy.standingPlatform >= 0;
      const bossWarn = enemy.boss && enemy.ai === 'telegraph' && !enemy.pooped;
      const hopWarn = hopper && grounded && enemy.hopTimer < 14 && !enemy.pooped && enemy.hitPause <= 0;
      let drawX = enemy.x - game.cameraX;
      const drawY = snap(enemy.y);
      if (bossWarn || hopWarn) drawX += (Math.floor(game.frame / 2) % 2 ? 2 : -2);
      drawX = snap(drawX);
      if (drawX + enemy.w < -40 || drawX > BASE_W + 40) continue;
      if (grounded) {
        ctx.fillStyle = 'rgba(20,12,40,0.25)';
        ctx.fillRect(drawX + 6 * enemy.scale, drawY + enemy.h - 2, enemy.w - 12 * enemy.scale, 4);
      } else if (enemy.kind === 'bee') {
        ctx.fillStyle = 'rgba(20,12,40,0.12)';
        ctx.fillRect(drawX + 12, drawY + enemy.h + 30, enemy.w - 24, 3);
      }
      const kind = enemy.boss ? 'boss' : enemy.kind;
      let state = 'walk';
      if (enemy.pooped) state = 'stun';
      else if (bossWarn || hopWarn || enemy.throwWarn) state = 'warn';
      else if (!grounded && enemy.kind !== 'bee') state = 'air';
      const surface = buildForestEnemy(kind, enemy.walkFrame, state);
      if (enemy.boss && enemy.ai === 'charge') {
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        for (let index = 0; index < 4; index += 1) {
          ctx.fillRect(snap(drawX + (enemy.chargeDir > 0 ? -20 - index * 16 : enemy.w + 8 + index * 16)), snap(drawY + 20 + index * 14), 12, 4);
        }
      }
      drawArtFootprint({ c: surface, ox: 5, oy: 7, fw: 24, fh: 21 }, drawX, drawY, enemy.w, enemy.h, enemy.kind === 'bee' || enemy.kind === 'hedgehog' || enemy.kind === 'squirrel' ? enemy.facingLeft : enemy.facingLeft);
      if (enemy.pooped) {
        for (let index = 0; index < 3; index += 1) {
          const angle = game.frame * 0.11 + index * 2.1;
          const sx = snap(drawX + enemy.w / 2 + Math.cos(angle) * 18 * enemy.scale);
          const sy = snap(drawY - 8 + Math.sin(angle) * 5);
          ctx.fillStyle = '#FFE36E';
          ctx.fillRect(sx - 2, sy - 6, 4, 12);
          ctx.fillRect(sx - 6, sy - 2, 12, 4);
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(sx - 2, sy - 2, 4, 4);
        }
      }
      if (bossWarn) {
        const bx = snap(drawX + enemy.w / 2);
        const by = drawY - 60;
        const pulse = Math.floor(game.frame / 6) % 2 ? 2 : 0;
        drawPanel(bx - 14 - pulse, by - 18 - pulse, 28 + pulse * 2, 34 + pulse * 2, '#FF4A4A', '#FFB0B0', 4);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(bx - 2, by - 12, 4, 14);
        ctx.fillRect(bx - 2, by + 6, 4, 4);
      }
      if (enemy.boss) {
        const lx = snap(drawX + enemy.w / 2);
        const ly = drawY - 34;
        const pw = enemy.maxHp * 28 + 12;
        drawPanel(lx - pw / 2, ly - 14, pw, 30, 'rgba(14,10,30,0.82)', 'rgba(255,180,180,0.35)', 4);
        for (let index = 0; index < enemy.maxHp; index += 1) {
          drawItemArt(index < enemy.hp ? 'heart' : 'heartEmpty', lx - pw / 2 + 8 + index * 28, ly - 10, 2);
        }
      }
    }
  }

  function drawDefeated() {
    for (const body of game.defeated) {
      const surface = buildForestEnemy(body.kind === 'boss' ? 'boss' : (body.kind || 'walker'), 0, 'stun');
      ctx.save();
      ctx.translate(body.x - game.cameraX + body.w / 2, body.y + body.h / 2);
      ctx.rotate(body.rot);
      ctx.globalAlpha = 0.75;
      const k = body.w / 24;
      ctx.drawImage(surface, -body.w / 2 - 5 * k, -body.h / 2 - 7 * k, surface.width * k, surface.height * k);
      ctx.restore();
      if (game.frame % 3 === 0) {
        game.particles.push({ x: body.x + body.w / 2 + (Math.random() - 0.5) * body.w, y: body.y + body.h / 2, vx: 0, vy: -1, color: '#FFF6A8', life: 18, size: 3 });
      }
    }
  }

  function drawBullets() {
    for (const bullet of game.bullets) {
      drawItemArt('bobek', snap(bullet.x - game.cameraX) - 10, snap(bullet.y) - 10, 2);
    }
  }

  function drawPickups() {
    for (const item of game.pickups) {
      if (item.taken) continue;
      const x = item.x - game.cameraX;
      if (x < -40 || x > BASE_W + 40) continue;
      const bob = snap(Math.sin(game.frame * 0.06 + item.bobPhase) * 4);
      const special = item.kind === 'golden' || item.kind === 'diamond' || item.kind === 'lettuce';
      if (special) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const color = item.kind === 'golden' ? '255,200,60' : item.kind === 'lettuce' ? '200,255,120' : '90,170,255';
        const r = 30 + Math.sin(game.frame * 0.1 + item.bobPhase) * 4;
        const glow = ctx.createRadialGradient(x + 12, item.y + bob + 14, 2, x + 12, item.y + bob + 14, r);
        glow.addColorStop(0, `rgba(${color},0.45)`);
        glow.addColorStop(1, `rgba(${color},0)`);
        ctx.fillStyle = glow;
        ctx.fillRect(x + 12 - r, item.y + bob + 14 - r, r * 2, r * 2);
        ctx.restore();
      }
      const name = item.kind === 'golden' ? 'golden' : item.kind;
      const yy = item.y + bob + (item.kind === 'heart' || item.kind === 'diamond' ? 4 : item.kind === 'lettuce' ? 3 : 0);
      drawItemArt(name, snap(x), snap(yy), ART);
      if (special) {
        const phase = (game.frame + Math.floor(item.bobPhase * 40)) % 50;
        if (phase < 12) {
          const sx = snap(x + 4 + hash01(item.bobPhase * 10 + Math.floor((game.frame + item.bobPhase * 40) / 50)) * 16);
          const sy = snap(yy - 2);
          const len = phase < 6 ? 4 : 2;
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(sx - 1, sy - len, 2, len * 2);
          ctx.fillRect(sx - len, sy - 1, len * 2, 2);
        }
      }
    }
  }

  function drawSpikes() {
    for (const spike of game.spikes) {

      return {
        title: 'IDZIEMY!',

          : ['A / D albo strzałki prowadzą ' + (HERO === 'C' ? 'Persiego.' : 'Puszka.'), 'Spokojnie – nic tu nie goni.']

      return {
        title: 'SKOK',
        lines: SHOW_TOUCH_UI
          ? ['SKOK ▲ – im dłużej trzymasz, tym wyżej.', 'Działa też chwilę po zejściu z krawędzi.']
          : ['Spacja lub W – im dłużej trzymasz, tym wyżej.', 'Działa też chwilę po zejściu z krawędzi.']

      return { title: 'ZRYW Z PAZURKAMI', lines: SHOW_TOUCH_UI ? ['BOBEK – u Persiego to zryw do przodu.', 'Zryw przebija wrogów i szyszki.'] : ['X albo Shift – zryw z pazurkami.', 'Zryw przebija wrogów i szyszki.'] };

          : ['W locie ↓ lub S – ' + HERO_NAME() + ' tupie w ziemię.', 'Fala ogłusza wrogów. Na ziemi ↓ = skradanie.']

  }

  function drawHud() {
    const top = 6;
    const fill = 'rgba(16,12,34,0.78)';
    const rim = 'rgba(255,255,255,0.16)';
    const heartsW = 18 + MAX_LIVES * 26;
    drawPanel(6, top, heartsW, 34, fill, rim, 8);
    if (game.hudLives === undefined) game.hudLives = game.lives;
    if (game.lives !== game.hudLives) {
      game.heartAnim = { index: Math.min(game.lives, game.hudLives), t: 24, gained: game.lives > game.hudLives };
      game.hudLives = game.lives;
    }
    for (let index = 0; index < MAX_LIVES; index += 1) {
      const active = index < game.lives;
      let hy = top + 6;
      let scale = ART;
      if (game.heartAnim && game.heartAnim.index === index && game.heartAnim.t > 0) {
        hy -= snap(Math.sin(game.heartAnim.t / 24 * Math.PI) * 8);
      }
      if (active && game.lives === 1 && Math.floor(game.frame / 20) % 2) hy -= 2;
      drawItemArt(active ? 'heart' : 'heartEmpty', 14 + index * 26, hy, scale);
    }
    if (game.heartAnim && game.heartAnim.t > 0) game.heartAnim.t -= 1;

    let x = 6 + heartsW + 8;
    drawPanel(x, top, 96, 34, fill, game.ammo === 0 ? 'rgba(255,140,120,0.45)' : rim, 8);

      drawItemArt('lettuce', x + 6, top + 44, 1.5);
      drawPanel(x + 30, top + 50, 58, 8, 'rgba(0,0,0,0.5)', null, 2);
      if (!low) drawPanel(x + 30, top + 50, Math.max(4, 58 * ratio), 8, '#E8FF8B', null, 2);

    const px = 300;

    const trackW = px + pw - 22 - trackX;
    const trackY = top + 16;
    const startX = game.level.startX;
    const span = Math.max(1, game.level.exitX - startX);
    const ratio = clamp((game.player.x - startX) / span, 0, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.16)';

    if (game.checkpoint) {
      const cpx = snap(trackX + trackW * clamp((game.checkpoint.x - startX) / span, 0, 1));

      ctx.fillRect(cpx, trackY - 8, 2, 14);

    const rabbitIcon = HERO === 'C' ? buildCat('walker', Math.floor(game.frame / 8) % 2, 'walk') : buildRabbit({ state: 'run', phase: (game.frame % 32) / 32, ear: -0.4, blink: false, sx: 1, sy: 1 });
    ctx.drawImage(rabbitIcon, snap(trackX + trackW * ratio) - 12, top + 2, rabbitIcon.width, rabbitIcon.height);

    const sw = 152;

    drawItemArt('carrot', sx + 10, top + 5, 1.6);

    ctx.font = 'bold 19px monospace';

    drawPanel(sx, dy, 74, 28, fill, allD ? 'rgba(140,200,255,0.75)' : rim, 4);
    drawItemArt('diamond', sx + 6, dy + 3, 1.6);
    ctx.fillStyle = '#BFE4FF';
    ctx.font = 'bold 14px monospace';
    ctx.fillText(`${stats.diamonds}/${stats.diamondsTotal}`, sx + 32, dy + 19);

    if (!SHOW_TOUCH_UI) {
