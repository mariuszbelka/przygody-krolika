  function currentFocusBanner() {
    if (game.scene !== 'PLAYING') return null;
    if (game.orientationRecommended) {
      return { title: 'TELEFON', text: 'Obróć go poziomo – będzie wygodniej.', color: '#D7F6FF' };
    }
    if (game.notice) {
      return game.notice;
    }
    if (game.titleCard > 0) return null;
    if (game.level.isBoss && game.enemies.length > 0) {
      return { title: 'FINAŁ', text: '„!” = szarża. Przeskocz go i wskocz mu na głowę.', color: '#FFB5B5' };
    }
    if (game.player.powerFrames > 0) {
      return {
        title: 'MOC',
        text: game.player.rolling ? 'Taran! Wpadaj we wrogów z boku.' : (game.player.powerFrames < 120 ? 'Moc zaraz zgaśnie.' : 'Rozpędź się po ziemi – włączy się taran.'),
        color: '#E8FF8B'

    }
    return null;
  }

  function drawSceneButton(button) {
    const palette = {
      primary: ['#86EA74', '#3E9A38', '#0F2A0C'],
      danger: ['#F48270', '#A63A30', '#2A0B08'],
      secondary: ['#FFE07A', '#C9962E', '#2A1F06'],

    }[button.tone] || ['rgba(255,255,255,0.14)', null, '#F0F7FF'];
    const hovered = game.hover && pointInRect(game.hover.x, game.hover.y, button);
    const lift = hovered ? -1 : 0;
    if (palette[1]) drawPanel(button.x, button.y + 4, button.w, button.h, palette[1], null, 10);
    drawPanel(button.x, button.y + lift, button.w, button.h, palette[0], button.tone === 'ghost' ? 'rgba(255,255,255,0.32)' : 'rgba(255,255,255,0.4)', 10);
    if (hovered) drawPanel(button.x, button.y + lift, button.w, button.h, 'rgba(255,255,255,0.16)', null, 10);

      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fillRect(button.x + 8, button.y + lift + 4, button.w - 16, 3);
    }
    ctx.fillStyle = palette[2];

  function wrapTextLines(text, maxWidth) {
    const words = text.split(' ');
    const lines = [];
    let current = '';
    for (const word of words) {
      const next = current ? `${current} ${word}` : word;
      if (!current || ctx.measureText(next).width <= maxWidth) {
        current = next;
      } else {
        lines.push(current);
        current = word;
      }
    }
    if (current) lines.push(current);
    return lines;
  }

  function drawWrappedParagraphs(paragraphs, x, y, maxWidth, lineHeight = 14, paragraphGap = 0) {
    let cursorY = y;
    for (let index = 0; index < paragraphs.length; index += 1) {
      const lines = wrapTextLines(paragraphs[index], maxWidth);
      for (const line of lines) {
        ctx.fillText(line, x, cursorY);
        cursorY += lineHeight;
      }
      if (index < paragraphs.length - 1) {
        cursorY += paragraphGap;
      }
    }
    return cursorY;
  }

  function drawLeaderboardPanel(x, y, w, h, title = 'HALL OF FAME') {
    drawPanel(x, y, w, h, 'rgba(7,12,22,0.74)', 'rgba(255,255,255,0.14)');

    ctx.fillStyle = '#FFE082';
    ctx.font = 'bold 14px monospace';

    if (!EKIPA) {
      ctx.fillStyle = '#D7F6FF';
      ctx.font = '12px monospace';
      drawWrappedParagraphs(['Ranking działa z linku od znajomych (…?ekipa=KOD).'], x + 12, y + 44, w - 24, 14, 0);
      ctx.restore();
      return;
    }
    if (game.leaderboardLoading && !game.leaderboardLoaded) {
      ctx.fillStyle = '#D7F6FF';
      ctx.font = '12px monospace';
      ctx.fillText('Ładuję ranking…', x + 12, y + 44);
      ctx.restore();
      return;
    }
    if (game.leaderboardError && !game.leaderboard.length) {

      ctx.font = '12px monospace';
      drawWrappedParagraphs([game.leaderboardError], x + 12, y + 44, w - 24, 13, 0);

      ctx.restore();
      return;
    }
    const top = game.leaderboard.slice(0, LEADERBOARD_LIMIT);
    for (let index = 0; index < top.length; index += 1) {
      const row = top[index];

      const player = normalizePlayerName(row.player_name) || 'Anon';

      ctx.fillText(`${index + 1}. ${shortName}`, x + 12, rowY);
      ctx.textAlign = 'right';

      ctx.textAlign = 'left';

  function drawSecretScenePreview(x, y, w, h, rewards) {
    const floorY = y + h - 24;
    const rabbitHop = Math.sin(game.frame * 0.18) * 2;

    const catY = floorY - CAT_H * 2;

    ctx.beginPath();
    ctx.rect(x + 1, y + 1, w - 2, h - 2);
    ctx.clip();

    const bg = ctx.createLinearGradient(0, y, 0, y + h);
    bg.addColorStop(0, '#0C1A2A');

    ctx.fillRect(x, y, w, h);

    ctx.fillStyle = 'rgba(255,255,255,0.10)';

    ctx.fillRect(x, floorY, w, 8);
    ctx.fillStyle = '#6B4423';
    ctx.fillRect(x, floorY + 8, w, 18);

  function drawPowerHelpPreview(x, y, w, h) {
    const phase = (game.frame % 180) / 180;
    const floorY = y + h - 24;
    const catX = x + w - 132;
    const catY = floorY - CAT_H * 2;
    const speedup = clamp((phase - 0.18) / 0.36, 0, 1);
    const hitMoment = phase > 0.58 && phase < 0.80;
    const rabbitX = x + 44 + speedup * 230 + (hitMoment ? Math.sin(game.frame * 0.55) * 3 : 0);
    const rabbitY = floorY - PLAYER_H + (hitMoment ? 1 : Math.sin(game.frame * 0.22) * 3);
    const rabbitSprite = hitMoment ? RB_STAND : (Math.floor(game.frame / 8) % 2 ? RB_WALK_1 : RB_WALK_2);

    ctx.save();
    ctx.beginPath();
    ctx.rect(x + 1, y + 1, w - 2, h - 2);
    ctx.clip();

    const bg = ctx.createLinearGradient(0, y, 0, y + h);
    bg.addColorStop(0, '#122412');
    bg.addColorStop(1, '#203818');
    ctx.fillStyle = bg;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    cloud(x + 26, y + 16);
    cloud(x + 210, y + 8);

    ctx.fillStyle = '#67B85C';
    ctx.fillRect(x, floorY, w, 8);
    ctx.fillStyle = '#6B4423';
    ctx.fillRect(x, floorY + 8, w, 18);

    const lettuceX = x + 266;
    const lettuceY = y + 14 + Math.sin(game.frame * 0.16) * 4;
    drawSprite(GOLD_LETTUCE, lettuceX, lettuceY, PIXEL * 2.1);
    ctx.fillStyle = 'rgba(232,255,139,0.24)';
    ctx.beginPath();
    ctx.arc(lettuceX + 18, lettuceY + 18, 26 + Math.sin(game.frame * 0.18) * 4, 0, Math.PI * 2);
    ctx.fill();

    if (speedup > 0.1) {
      for (let index = 0; index < 3; index += 1) {
        const lineX = rabbitX - 14 - index * 14;
        const lineY = rabbitY + 18 + index * 8;
        ctx.fillStyle = `rgba(255,255,255,${0.22 - index * 0.05})`;
        ctx.fillRect(lineX, lineY, 8, 3);
      }
    }

    if (hitMoment) {
      const pulse = 0.42 + Math.sin(game.frame * 0.36) * 0.14;
      ctx.fillStyle = `rgba(255,215,90,${pulse})`;
      ctx.beginPath();
      ctx.arc(rabbitX + PLAYER_W / 2, rabbitY + PLAYER_H / 2, 24, 0, Math.PI * 2);
      ctx.fill();
      for (let index = 0; index < 3; index += 1) {
        const angle = game.frame * 0.22 + index * 2.1;
        const starX = catX + 38 + Math.cos(angle) * 18;
        const starY = catY + 8 + Math.sin(angle) * 8;
        ctx.fillStyle = '#FFD95A';
        ctx.fillRect(starX - 2, starY - 2, 4, 4);
        ctx.fillRect(starX - 5, starY, 10, 2);
        ctx.fillRect(starX, starY - 5, 2, 10);
      }
    }

    ctx.save();
    ctx.translate(rabbitX + PLAYER_W / 2, rabbitY + PLAYER_H / 2);
    ctx.scale(hitMoment ? 1.08 : 1, hitMoment ? 0.88 : 1);
    if (hitMoment) ctx.rotate(Math.sin(game.frame * 0.45) * 0.18);
    ctx.translate(-(rabbitX + PLAYER_W / 2), -(rabbitY + PLAYER_H / 2));
    drawSprite(rabbitSprite, rabbitX, rabbitY, PIXEL * 2);
    drawPreviewRabbitDetails(rabbitX, rabbitY, false, hitMoment);
    ctx.restore();

    drawSprite(CAT_1, catX, catY, PIXEL * 2, true);
    ctx.fillStyle = '#E8FF8B';
    ctx.font = 'bold 12px monospace';
    ctx.fillText(hitMoment ? 'TARAN!' : 'ROZPED...', x + 26, y + 24);

    ctx.restore();
  }

  function drawMenuHeroAnimation(x, y, w, h) {
    const phase = (game.frame % 240) / 240;

    let rabbitFlip = false;
    let catX = x + w - CAT_W - 18;
    let catY = floorY - CAT_H * 2;
    let catSprite = walkFrame ? CAT_2 : CAT_1;
    let carrotX = x + 120;
    let carrotY = floorY - 54;
    let bobek = null;
    let stunned = false;
    let heartX = null;

    if (phase < 0.28) {
      const t = phase / 0.28;
      rabbitX = x + 28 + Math.sin(game.frame * 0.12) * 2;
      rabbitSprite = RB_STAND;
      catX = lerp(x + w + 20, x + w - 114, t);
      carrotX = rabbitX + 68;
      carrotY = floorY - 54 + Math.sin(game.frame * 0.15) * 2;
      heartX = catX + 34;
    } else if (phase < 0.55) {
      const t = (phase - 0.28) / 0.27;
      rabbitX = lerp(x + 28, x + 48, t);
      rabbitSprite = t < 0.34 ? RB_STAND : (walkFrame ? RB_WALK_1 : RB_WALK_2);
      catX = x + w - 114 + Math.sin(t * Math.PI) * 4;
      carrotX = rabbitX + 62;
      carrotY = floorY - 52;
      bobek = {
        x: lerp(rabbitX + 74, catX + 24, t),
        y: floorY - 42 - Math.sin(t * Math.PI) * 34,
        scale: 0.65
      };
    } else if (phase < 0.78) {
      const t = (phase - 0.55) / 0.23;
      rabbitX = lerp(x + 48, x + 126, t);
      rabbitSprite = walkFrame ? RB_WALK_1 : RB_WALK_2;
      catX = x + w - 112 + Math.sin(game.frame * 0.42) * 3;
      carrotX = rabbitX + 52;
      carrotY = floorY - 56 + Math.sin(game.frame * 0.2) * 2;
      stunned = true;
    } else {
      const t = (phase - 0.78) / 0.22;
      rabbitX = lerp(x + 126, x + 64, t);
      rabbitSprite = walkFrame ? RB_WALK_2 : RB_WALK_1;
      rabbitFlip = true;
      catX = lerp(x + w - 112, x + w - 78, t);
      carrotX = rabbitX - 12;
      carrotY = floorY - 54;
      heartX = rabbitX + 24;
    }

    ctx.save();
    ctx.beginPath();
    ctx.rect(x + 1, y + 1, w - 2, h - 2);
    ctx.clip();

    const glow = ctx.createRadialGradient(x + 110, y + 18, 8, x + 110, y + 24, 90);
    glow.addColorStop(0, 'rgba(255,215,120,0.18)');
    glow.addColorStop(1, 'rgba(255,215,120,0)');
    ctx.fillStyle = 'rgba(6,10,18,0.42)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = glow;
    ctx.fillRect(x, y, w, h);

    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    cloud(x + 18, y + 16);
    ctx.globalAlpha = 0.42;
    carrotCloud(x + 198, y + 8);
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#4A9A54';
    ctx.fillRect(x, floorY, w, 7);
    ctx.fillStyle = '#775516';
    ctx.fillRect(x, floorY + 7, w, 13);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(x + 154, floorY - 22, 58, 6);
    ctx.fillRect(x + 164, floorY - 16, 40, 6);

    drawSprite(CARROT, carrotX, carrotY, PIXEL * 1.5, false, OUTLINE);
    if (bobek) {
      drawBobekPreview(bobek.x, bobek.y, bobek.scale);
    }

    drawSprite(rabbitSprite, rabbitX, rabbitY, PIXEL * 2, rabbitFlip, OUTLINE);

    drawSprite(catSprite, catX, catY, PIXEL * 2, true, OUTLINE);
    if (stunned) {
      ctx.fillStyle = 'rgba(230,230,230,0.22)';
      ctx.fillRect(catX + 8, catY + 10, 68, 62);
      for (let index = 0; index < 3; index += 1) {
        const angle = game.frame * 0.18 + index * 2.1;
        const starX = catX + 40 + Math.cos(angle) * 18;
        const starY = catY - 2 + Math.sin(angle) * 6;
        ctx.fillStyle = '#FFD95A';
        ctx.fillRect(starX - 2, starY - 2, 4, 4);
        ctx.fillRect(starX - 5, starY, 10, 2);
        ctx.fillRect(starX, starY - 5, 2, 10);
      }
    }

    if (heartX !== null) {
      ctx.fillStyle = '#FF7A9E';
      ctx.fillRect(heartX, y + 18, 10, 4);
      ctx.fillRect(heartX - 2, y + 22, 14, 8);
      ctx.fillRect(heartX, y + 30, 10, 4);
      ctx.fillRect(heartX + 2, y + 34, 6, 4);
    }

    for (let index = 0; index < 3; index += 1) {
      const dustX = rabbitX + 14 - index * 10;
      const dustY = floorY + 4 - Math.abs(Math.sin(game.frame * 0.22 + index)) * 6;
      ctx.fillStyle = `rgba(255,245,215,${0.12 + index * 0.08})`;
      ctx.fillRect(dustX, dustY, 8 - index * 2, 4);
    }

    ctx.restore();
  }

  function drawMenu() {
    const cam = game.frame * 1.6;
    drawMenuStage(cam);

    // Puszek runs, Persi trots sleepily behind, carrots drift in
    const groundY = 262;
    menuState.carrotX -= 1.6;

    const rabbitX = 360;
    if (menuState.hop <= 0 && menuState.carrotX - rabbitX < 70 && menuState.carrotX - rabbitX > 40) menuState.hop = 44;
    let hopY = 0;
    let state = 'run';
    if (menuState.hop > 0) {
      const k = 1 - menuState.hop / 44;
      hopY = Math.sin(k * Math.PI) * 54;
      state = k < 0.5 ? 'jump' : 'fall';
      menuState.hop -= 1;
    }
    const rabbitY = groundY - 48 - hopY;
    const carrotY = groundY - 92;
    if (menuState.carrotX > -30 && Math.abs(menuState.carrotX - (rabbitX + 12)) < 26 && Math.abs(carrotY - rabbitY) < 46) {
      burstUi(menuState.carrotX + 12, carrotY + 14, ['#FFE680', '#FFFFFF', '#FF9C3A'], 16, 3);

      menuState.got += 1;
    }
    drawItemArt(menuState.got % 4 === 3 ? 'golden' : 'carrot', snap(menuState.carrotX), snap(carrotY + Math.sin(game.frame * 0.08) * 4), ART);
    const earA = state === 'run' ? -0.45 + Math.sin(game.frame * 0.25) * 0.12 : state === 'jump' ? -0.8 : 0.3;
    const rabbit = buildRabbit({ state, phase: (game.frame % 22) / 22, ear: earA, blink: false, sx: 1, sy: 1 });

  const ladyCache = new Map();

  function buildLady(hug, part) {
    const key = `${hug}|${part}`;
    if (ladyCache.has(key)) return ladyCache.get(key);
    const g = new PixelGrid(30, 48);
    const mats = [
      makeMat('#F4C7A2', '#5A2E22'), // 0 skin
      makeMat('#6E4128', '#2A140A'), // 1 hair
      makeMat('#E86A9E', '#5A1636'), // 2 dress
      makeMat('#FFFFFF', '#5A1636', { strength: 0.5 }), // 3 collar
      makeMat('#2A1A14', null, { flat: true }), // 4 eyes
      makeMat('#F49AA8', null, { flat: true }), // 5 blush
      makeMat('#5A3A2A', '#22140C'), // 6 shoes
      makeMat('#C2506A', null, { flat: true }) // 7 mouth
    ];
    const X = (v) => v + 3;
    if (part !== 'arms') {
      g.capsule(X(7), Y0(10), X(5), Y0(20), 3, 2.4, 1);
      g.ellipse(X(12), Y0(9), 7.2, 7.6, 1);
      g.capsule(X(10), Y0(39), X(10), Y0(44), 1.2, 1.2, 0);
      g.capsule(X(14), Y0(39), X(14), Y0(44), 1.2, 1.2, 0);
      g.ellipse(X(9.6), Y0(45), 2.2, 1.4, 6);
      g.ellipse(X(14.4), Y0(45), 2.2, 1.4, 6);
      g.tri(X(12), Y0(17), X(2), Y0(40), X(22), Y0(40), 2, (a, b, c, px) => (px < X(8) ? 3 : px > X(17) ? 1 : 2));
      g.ellipse(X(12), Y0(21), 4.6, 4, 2);
      g.ellipse(X(12), Y0(17.6), 3.2, 1.4, 3);
      g.rect(X(11), Y0(15), 2, 2, 0, 1);
      g.ellipse(X(12), Y0(10.4), 5.4, 5.8, 0);
      g.ellipse(X(12), Y0(5.6), 5.8, 3, 1);
      g.ellipse(X(7.2), Y0(9), 1.6, 3.6, 1);
      g.ellipse(X(16.8), Y0(9), 1.6, 3.6, 1);
      g.rect(X(9), Y0(10), 1, 2, 4);
      g.rect(X(14), Y0(10), 1, 2, 4);
      g.put(X(8), Y0(12.5), 5);
      g.put(X(15.5), Y0(12.5), 5);
      g.rect(X(11), Y0(13.5), 3, 1, 7);
    }
    if (part !== 'body') {
      if (hug) {
        g.capsule(X(6.4), Y0(19), X(4), Y0(25), 1.5, 1.4, 2);
        g.capsule(X(4), Y0(25), X(13), Y0(28), 1.4, 1.3, 0);
        g.capsule(X(17.6), Y0(19), X(20), Y0(25), 1.5, 1.4, 2);
        g.capsule(X(20), Y0(25), X(12), Y0(29), 1.4, 1.3, 0);
      } else {
        g.capsule(X(6.4), Y0(19), X(3.4), Y0(28), 1.5, 1.3, 2);
        g.capsule(X(17.6), Y0(19), X(20.6), Y0(28), 1.5, 1.3, 2);
        g.ellipse(X(3.2), Y0(29.4), 1.5, 1.5, 0);
        g.ellipse(X(20.8), Y0(29.4), 1.5, 1.5, 0);
      }
    }
    const surface = g.render(mats);
    ladyCache.set(key, surface);
    return surface;
  }

  function Y0(v) {
    return v + 1;
  }

  function drawWinLady(x, y, cuddle = 0, part = 'all') {
    const surface = buildLady(cuddle >= 1 ? 1 : 0, part);
    ctx.drawImage(surface, snap(x - 10), snap(y - 6), surface.width * 3, surface.height * 3);

  function drawWinHeart(x, y, scale = 1, color = '#FF76B6') {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x - 6 * scale, y, 6 * scale, 0, Math.PI * 2);
    ctx.arc(x + 6 * scale, y, 6 * scale, 0, Math.PI * 2);
    ctx.moveTo(x - 12 * scale, y + 2 * scale);
    ctx.lineTo(x, y + 16 * scale);
    ctx.lineTo(x + 12 * scale, y + 2 * scale);
    ctx.closePath();
    ctx.fill();
  }

  function drawWinRabbitFace(x, y, facingLeft = false, happy = false) {
    const baseX = x + (facingLeft ? 36 : 54);
    const eyeY = y + 30;
    if (happy) {
      ctx.fillStyle = '#4D5F8B';
      ctx.fillRect(baseX - 12, eyeY + 2, 6, 1);
      ctx.fillRect(baseX + 4, eyeY + 2, 6, 1);
    } else {
      ctx.fillStyle = '#2D4B7D';
      ctx.fillRect(baseX - 12, eyeY + 1, 6, 2);
      ctx.fillRect(baseX + 4, eyeY + 1, 6, 2);
    }
    ctx.strokeStyle = '#C56D86';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(baseX - 1, y + 43, happy ? 10 : 8, 0.2, Math.PI - 0.2);

  const winGround = { x: 0, y: 360, w: 1000, baseX: 4000, moving: false };

  function drawWin() {
    const t = game.winTimer;
    drawSceneryBackdrop(THEMES.garden, 0, game.frame, 360);
    const art = platformArt(winGround, THEMES.garden);
    ctx.drawImage(art.canvas, -art.ox - 40, winGround.y - art.oy, art.canvas.width * ART, art.canvas.height * ART);

    const ladyX = 520;
    const ladyY = 360 - 140;
    const cuddle = clamp((t - 112) / 28, 0, 1);
    const runTargetX = ladyX - 120;
    const runningX = Math.min(runTargetX, -110 + t * 4.4);
    const hugX = ladyX + 6;
    const rabbitX = cuddle > 0 ? runTargetX + (hugX - runTargetX) * cuddle : runningX;
    const hugY = ladyY + 58;
    const rabbitY = cuddle > 0 ? (360 - 48) + (hugY - (360 - 48)) * cuddle - Math.sin(cuddle * Math.PI) * 60 : 360 - 48 - Math.abs(Math.sin(t * 0.3)) * 6;
    const hugging = cuddle >= 1;
    drawWinLady(ladyX, ladyY, cuddle, hugging ? 'body' : 'all');
    const state = hugging ? 'idle' : cuddle > 0 ? 'jump' : 'run';
    const rabbit = buildRabbit({ state, phase: (t % 20) / 20, ear: hugging ? Math.sin(t * 0.1) * 0.2 : -0.6, blink: hugging && Math.floor(t / 50) % 4 === 0, sx: 1, sy: 1 });
    drawArtFootprint({ c: rabbit, ox: RABBIT_CANVAS.ox, oy: RABBIT_CANVAS.oy, fw: 24, fh: 24 }, snap(rabbitX), snap(rabbitY), 48, 48, false);
    if (hugging) {
      drawWinLady(ladyX, ladyY, cuddle, 'arms');
      for (let index = 0; index < 7; index += 1) {
        const drift = Math.sin(t * 0.08 + index * 1.4) * 14;
        const rise = (t * 1.6 + index * 22) % 140;
        ctx.globalAlpha = clamp(1 - rise / 140, 0, 1);
        drawItemArt('heart', snap(ladyX + 10 + drift + (index - 3) * 16), snap(ladyY - rise), index % 2 ? 1.5 : 2);
      }
      ctx.globalAlpha = 1;
      if (t % 46 === 0) {
        burstUi(160 + Math.random() * 480, 60 + Math.random() * 120, ['#FFD94A', '#FF7AA8', '#7BE36C', '#6CC4FF', '#FFFFFF'], 26, 3.4);

    }
    drawUiParticles();

    ctx.textAlign = 'center';
    drawOutlinedText('KONIEC PRZYGODY!', BASE_W / 2, 70, 'bold 36px monospace', '#FFD94A', '#5A2A08', 6);
    if (game.scoreSyncText) {
      ctx.fillStyle = '#FFF4D6';
      ctx.font = 'bold 12px monospace';
      ctx.fillText(game.scoreSyncText, BASE_W / 2 + 120, 168);
    }
    drawLeaderboardPanel(24, 116, 240, 156);
    drawPanel(BASE_W / 2 - 300, 388, 600, 84, 'rgba(16,12,34,0.82)', 'rgba(255,224,130,0.35)', 8);
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 18px monospace';
    ctx.fillText('Polana Grzybów odczarowana! Ciąg dalszy nastąpi…', BASE_W / 2, 412);
    ctx.fillStyle = '#FFE9C8';
    ctx.font = '15px monospace';
    ctx.fillText('Pani tuli Puszka, a on aż promienieje z radości.', BASE_W / 2, 436);
    ctx.fillStyle = '#FFD94A';
    ctx.font = 'bold 19px monospace';
    ctx.fillText(`WYNIK ${game.score} · REKORD ${game.hiScore} · ★ ${totalStars()}/${LEVELS.length * 3}`, BASE_W / 2, 462);
    drawSceneButtons(overlayButtonsForScene());

  function collectLightSources() {
    const sources = [];
    const cam = game.cameraX;
    const player = game.player;
    const cfg = LIGHTING[THEME_ORDER[game.levelIndex]];
    if (cfg) sources.push({ x: player.x - cam + 24, y: player.y + 22, r: cfg.player, a: 1 });
    if (player.powerFrames > 0) sources.push({ x: player.x - cam + 24, y: player.y + 24, r: 90, a: 1, glow: '220,255,120' });
    if (!(game.level.isBoss && game.enemies.length > 0)) {
      const px = game.level.exitX - cam + TILE / 2;
      if (px > -150 && px < BASE_W + 150) sources.push({ x: px, y: BASE_H - TILE - 36, r: 150, a: 1, glow: '190,140,255' });
    }
    if (game.checkpointActive && game.checkpoint) {
      const cx = game.checkpoint.x - cam;
      if (cx > -100 && cx < BASE_W + 100) sources.push({ x: cx + 16, y: game.checkpoint.y - 40, r: 110, a: 0.9, glow: '255,190,110' });
    }
    for (const item of game.pickups) {
      if (item.taken) continue;
      const ix = item.x - cam;
      if (ix < -60 || ix > BASE_W + 60) continue;
      if (item.kind === 'golden' || item.kind === 'diamond' || item.kind === 'lettuce') sources.push({ x: ix + 12, y: item.y + 14, r: 60, a: 0.8 });
    }
    for (const enemy of game.enemies) {
      if (enemy.boss && enemy.ai === 'telegraph') sources.push({ x: enemy.x - cam + enemy.w / 2, y: enemy.y + 20, r: 160, a: 0.6, glow: '255,70,70' });
    }
    if (cfg && game.ambient) {
      for (const p of game.ambient) if (p.kind === 'firefly' || p.kind === 'ember') sources.push({ x: p.x, y: p.y, r: 26, a: 0.7 });
    }
    return sources;
  }

  function updatePlaying() {
    if (input.mutePressed) {
      audio.toggle();
    }
    if (input.pausePressed) {
      pauseOrResume();
      return;
    }
    if (input.retryPressed && !game.celebrate) {
      restartCurrentLevel('Powtarzamy poziom od początku.');
      return;
    }
    if (game.celebrate > 0) {
      updateCelebrate();
      updateParticles();
      updatePopups();
      updateAmbient(theme());
      updateWeather(theme());
      audio.updateMusic(game.scene);
      return;
    }
    if (game.hitStop > 0) {
      game.hitStop -= 1;
      if (input.jumpPressed) game.player.jumpBuffer = JUMP_BUFFER;
      updateParticles();
      updatePopups();
      updateShockwaves();
      return;
    }
    game.levelFrames += 1;
    if (game.titleCard > 0) game.titleCard -= 1;
    if (game.nameTagTimer > 0) game.nameTagTimer -= 1;
    if (game.pickupStreakTimer > 0) {
      game.pickupStreakTimer -= 1;
    } else {
      game.pickupStreak = 0;
    }
    if (input.shootPressed) {
      fireBobek();
    }
    updateMovingPlatforms();
    updatePlatformKinds();
    updatePlayer();
    updateBouncers();
    updateGeysers();
    updateWinds();
    updateRabbitAnim(game.player);
    updateDownAction();
    updateEnemies();
    updateRollers();
    updateTimedSpikes();
    if (game.level.isBoss) updateBossHazards();
    updateDefeated();
    updateBullets();
    updatePickups();
    updateP3();
    updateParticles();
    updatePopups();
    updateShockwaves();
    updateAmbient(theme());
    updateWeather(theme());
    updateCamera();
    updateGuidePrompts();
    updateSecrets();
    updateCheckpoint();
    updateEnemyContact();
    updateSpikes();
    tryFinishLevel();
    audio.updateMusic(game.scene);
  }

  let lastTime = 0;
  let accumulator = 0;

  function tick() {
    game.frame += 1;
    game.sceneTick += 1;
    updateShake();
    updateNotice();
    updateFlash();
    if (game.fade > 0) game.fade = 0;
    updateWipe();
    updateUiParticles();
    game.displayScore += (game.score - game.displayScore) * 0.18;
    if (Math.abs(game.score - game.displayScore) < 0.6) game.displayScore = game.score;
    if (game.level && game.scene !== 'MENU') {
      game.portalTick += 1;
    }
    if (game.scene === 'WIN') {
      game.winTimer += 1;
    }

    if (input.mutePressed && game.scene !== 'PLAYING') {
      audio.toggle();
    }

    if (game.scene === 'MENU') {
      if (input.confirmPressed) startGame();
    } else if (game.scene === 'MAP') {
      updateMap();
      audio.updateMusic(game.scene);
    } else if (game.scene === 'ONBOARDING') {
      if (input.confirmPressed) runSceneAction('startRun');
      if (input.menuPressed) runSceneAction('map');
    } else if (game.scene === 'SECRET_FOUND') {
      if (input.confirmPressed) runSceneAction('claimSecret');
      if (input.menuPressed) runSceneAction('map');
    } else if (game.scene === 'POWER_HELP') {
      if (input.confirmPressed || input.retryPressed) runSceneAction('continuePower');
    } else if (game.scene === 'PLAYING') {
      updatePlaying();
    } else if (game.scene === 'PAUSED') {
      if (input.confirmPressed || input.pausePressed) runSceneAction('resume');
      if (input.retryPressed) runSceneAction('restartLevel');
      if (input.menuPressed) runSceneAction('map');
    } else if (game.scene === 'LEVEL_CLEAR') {
      updateParticles();
      updatePopups();
      updateDefeated();
      if (game.lastClear) {
        for (let index = 0; index < 3; index += 1) {
          if (game.sceneTick === 14 + index * 16 && game.lastClear.earned[index]) {
            audio.tone(660 + index * 220, 0.12, 'triangle', 0.13, 990 + index * 260, 0);
            burstUi(BASE_W / 2 + (index - 1) * 120, 146, ['#FFD94A', '#FFF6B8', '#FFFFFF', '#FF9C3A'], 20, 3.6);
          }
        }
      }
      if (input.confirmPressed) runSceneAction('nextLevel');
      if (input.retryPressed) runSceneAction('restartLevel');
      if (input.menuPressed) runSceneAction('map');
    } else if (game.scene === 'GAME_OVER') {
      if (input.confirmPressed || input.retryPressed) runSceneAction('restartLevel');
      if (input.menuPressed) runSceneAction('map');
    } else if (game.scene === 'WIN') {
      if (input.confirmPressed || input.retryPressed) runSceneAction('restartAdventure');
      if (input.menuPressed) runSceneAction('menu');
    }

    input.clearPressed();
  }

  function render() {
    ctx.setTransform(game.renderScale, 0, 0, game.renderScale, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.textBaseline = 'alphabetic';
    ctx.clearRect(0, 0, BASE_W, BASE_H);
    if (game.scene === 'MENU') {
      drawMenu();
    } else if (game.scene === 'MAP') {
      drawMap();
    } else if (game.scene === 'ONBOARDING') {
      drawOnboarding();
    } else if (game.scene === 'SECRET_FOUND') {
      drawSecretFound();
    } else if (game.scene === 'POWER_HELP') {
      drawPowerHelp();
    } else if (game.scene === 'PLAYING') {
      drawWorld();
    } else if (game.scene === 'PAUSED') {
      drawPauseScreen();
    } else if (game.scene === 'LEVEL_CLEAR') {
      drawLevelClear();
    } else if (game.scene === 'GAME_OVER') {
      drawGameOver();
    } else if (game.scene === 'WIN') {
      drawWin();
    }
    if (game.scene !== 'MENU' && game.scene !== 'WIN') drawUiParticles();
    drawWipe();
  }

  function frameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const delta = Math.min(250, timestamp - lastTime);
    lastTime = timestamp;
    accumulator += delta;

    let steps = 0;
    while (accumulator >= STEP_MS && steps < MAX_STEPS) {
      tick();
      accumulator -= STEP_MS;
      steps += 1;
    }

    render();
    requestAnimationFrame(frameLoop);
  }

  requestAnimationFrame(frameLoop);
})();
</script>
</body>
</html>
