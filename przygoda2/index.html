<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1430">
<title>Puszek i Persi: Sroka Złodziejka</title>
<style>
@font-face { font-family: "Fredoka"; font-weight: 600; src: url(assets/fonts/fredoka-latin-600-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }
@font-face { font-family: "Fredoka"; font-weight: 600; src: url(assets/fonts/fredoka-latin-ext-600-normal.woff2) format("woff2"); unicode-range: U+0100-024F; }
@font-face { font-family: "Fredoka"; font-weight: 700; src: url(assets/fonts/fredoka-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }
@font-face { font-family: "Fredoka"; font-weight: 700; src: url(assets/fonts/fredoka-latin-ext-700-normal.woff2) format("woff2"); unicode-range: U+0100-024F; }
@font-face { font-family: "Press Start 2P"; src: url(assets/fonts/press-start-2p-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF; }
@font-face { font-family: "Press Start 2P"; src: url(assets/fonts/press-start-2p-latin-ext-400-normal.woff2) format("woff2"); unicode-range: U+0100-024F; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 50% 0%, #3b2d66 0%, #1b1430 60%, #120d22 100%); }
body { display: flex; align-items: center; justify-content: center; flex-direction: column; font-family: "Fredoka", "Trebuchet MS", sans-serif; color: #fff;
  touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
#wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; }
canvas { display: block; border-radius: 14px; border: 2px solid rgba(255,255,255,0.16); box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  image-rendering: pixelated; touch-action: none; -webkit-tap-highlight-color: transparent; background: #1b1430; }
#touch { display: none; width: 100%; gap: 8px; justify-content: space-between; }
#touch .grp { display: flex; gap: 8px; }
.tb { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); background: rgba(10,14,28,0.45); color: #fff;
  font: 700 15px "Fredoka", sans-serif; touch-action: none; -webkit-tap-highlight-color: transparent; line-height: 1.05; }
.tb.big { width: 76px; height: 76px; }
.tb.act { background: rgba(70,160,60,0.45); border-color: rgba(140,230,120,0.65); }
.tb.sw { background: rgba(140,90,200,0.45); border-color: rgba(200,160,255,0.65); }
.tb:active, .tb.on { box-shadow: inset 0 0 0 999px rgba(255,255,255,0.2); }
body.touch #touch { display: flex; }
body.touch.land #touch { position: fixed; inset: auto 0 0 0; padding: 0 calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left)); pointer-events: none; }
body.touch.land #touch .tb { pointer-events: auto; }
body.touch.land #touch .grp { align-items: flex-end; }
body.touch.land #touch .tb { width: 58px; height: 58px; font-size: 12px; }
body.touch.land #touch .tb.big { width: 62px; height: 62px; font-size: 18px; }
body.touch.land #bA { font-size: 13px; }
body.touch.land #touch .grp:last-child { flex-direction: column; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="768" height="480" aria-label="Puszek i Persi: Sroka Złodziejka"></canvas>
  <div id="touch">
    <div class="grp">
      <button class="tb big" id="bL">◀</button>
      <button class="tb big" id="bR">▶</button>
    </div>
    <div class="grp">
      <button class="tb" id="bU">↶<br>COFNIJ</button>
      <button class="tb sw" id="bS">ZMIEŃ</button>
      <button class="tb big act" id="bA">AKCJA</button>
    </div>
  </div>
</div>
<script src="rules.js"></script>
<script src="levels.js"></script>
<script src="art.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
